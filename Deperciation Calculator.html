<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>折舊自動化計算系統 | 國立臺中科技大學 會計資訊系</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js 圖表庫 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Apple iOS 液態玻璃風格 (Glassmorphism) */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            background-attachment: fixed;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            color: #1e293b;
        }

        /* 背景液態光暈效果 */
        .blob-1 {
            position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(255,192,203,0.6) 0%, rgba(255,192,203,0) 70%);
            border-radius: 50%; filter: blur(60px); z-index: -1; animation: float 10s ease-in-out infinite;
        }
        .blob-2 {
            position: fixed; bottom: -10%; right: -10%; width: 40vw; height: 40vw;
            background: radial-gradient(circle, rgba(142,197,252,0.8) 0%, rgba(142,197,252,0) 70%);
            border-radius: 50%; filter: blur(60px); z-index: -1; animation: float 12s ease-in-out infinite reverse;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
            100% { transform: translateY(0px) scale(1); }
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 24px;
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 0 3px rgba(142,197,252,0.5);
            outline: none;
        }

        .table-wrap::-webkit-scrollbar { height: 8px; }
        .table-wrap::-webkit-scrollbar-track { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .table-wrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.8); border-radius: 10px; }

        /* 圖表容器高度 */
        .chart-container {
            position: relative;
            height: 350px;
            width: 100%;
            padding: 15px;
        }

        /* 列印 (匯出 PDF) 樣式 */
        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
            .blob-1, .blob-2 { display: none !important; }
            .glass-card { 
                background: transparent !important; box-shadow: none !important; 
                backdrop-filter: none !important; border: none !important; 
                padding: 0 !important; margin: 0 !important;
            }
            .print-header { display: block !important; text-align: center; margin-bottom: 20px; }
            .print-info { display: flex !important; justify-content: space-between; margin-bottom: 20px; font-weight: bold; border-bottom: 2px solid #000; padding-bottom: 10px;}
            table { width: 100% !important; border-collapse: collapse !important; margin-bottom: 30px !important; }
            th, td { border: 1px solid #cbd5e1 !important; padding: 8px !important; font-size: 12px !important; color: black !important; }
            th { background-color: #f1f5f9 !important; -webkit-print-color-adjust: exact; }
            .chart-container { height: 280px !important; margin-bottom: 20px !important;}
            /* 避免圖表與表格被頁面切斷 */
            .page-break-avoid { page-break-inside: avoid; margin-bottom: 40px !important;}
            canvas { max-width: 100% !important; height: auto !important; }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="blob-1"></div>
    <div class="blob-2"></div>

    <div class="max-w-6xl mx-auto">
        
        <!-- 標題區 -->
        <div class="text-center mb-8 no-print">
            <p class="text-sm md:text-base font-bold text-slate-600 tracking-wider mb-2">
                [國立臺中科技大學 會計資訊系 程式設計課程]
            </p>
            <h1 class="text-3xl md:text-5xl font-extrabold text-slate-800 tracking-tight drop-shadow-sm">
                自動化折舊結算系統
            </h1>
            <p class="text-slate-600 mt-3 font-medium">支援動態圖表分析與專業財報匯出</p>
        </div>

        <!-- 列印專用標題 -->
        <div class="print-header hidden">
            <h2 style="font-size: 18px; margin-bottom: 5px;">[國立臺中科技大學 會計資訊系 程式設計課程]</h2>
            <h1 style="font-size: 24px; font-weight: bold; margin-bottom: 15px;">固定資產折舊計算與視覺分析報表</h1>
        </div>

        <!-- 參數輸入卡片 -->
        <div class="glass-card p-6 md:p-8 mb-8 no-print">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6 pb-6 border-b border-slate-400/30">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">製表人姓名</label>
                    <input type="text" id="preparer" value="" placeholder="請輸入姓名..." class="glass-input w-full px-4 py-3 rounded-xl">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">報表日期</label>
                    <input type="date" id="reportDate" value="" class="glass-input w-full px-4 py-3 rounded-xl">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-6">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">購置成本 ($)</label>
                    <input type="number" id="cost" value="" placeholder="如: 500000" class="glass-input w-full px-4 py-3 rounded-xl">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">估計殘值 ($)</label>
                    <input type="number" id="salvage" value="" placeholder="如: 50000" class="glass-input w-full px-4 py-3 rounded-xl">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">耐用年限 (年)</label>
                    <input type="number" id="life" value="" placeholder="如: 5" class="glass-input w-full px-4 py-3 rounded-xl">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">購買月份 (1~12)</label>
                    <input type="number" id="month" value="" min="1" max="12" placeholder="如: 9" class="glass-input w-full px-4 py-3 rounded-xl">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">遞減倍數</label>
                    <input type="number" id="dbMultiplier" value="" step="0.1" placeholder="如雙倍: 2" class="glass-input w-full px-4 py-3 rounded-xl">
                </div>
            </div>

            <div class="mt-8 flex flex-col md:flex-row gap-4">
                <button onclick="generateReport()" class="flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-transform transform hover:-translate-y-1">
                    ✨ 產生報表與動態圖表
                </button>
                <button onclick="exportPDF()" id="btn-export" class="hidden flex-1 bg-white/70 hover:bg-white text-slate-800 font-bold py-3 px-6 rounded-xl shadow-md border border-slate-300 transition-transform transform hover:-translate-y-1">
                    📄 匯出 PDF / 列印
                </button>
            </div>
            
            <div id="error-msg" class="mt-4 text-rose-600 font-bold text-center hidden bg-rose-100/50 py-2 rounded-lg"></div>
        </div>

        <!-- 報表顯示區 -->
        <div id="report-container" class="hidden">
            
            <div class="print-info hidden">
                <div id="print-asset-info"></div>
                <div id="print-meta-info" class="text-right"></div>
            </div>

            <!-- 1. 直線法報表與圖表 -->
            <div class="glass-card overflow-hidden mb-8 page-break-avoid">
                <div class="bg-blue-600/10 border-b border-slate-400/30 px-6 py-4 flex items-center">
                    <div class="w-3 h-8 bg-blue-500 rounded-full mr-3 no-print"></div>
                    <h2 class="text-xl font-bold text-slate-800">一、 直線法 (Straight-Line Method)</h2>
                </div>
                <!-- 圖表區 -->
                <div class="chart-container border-b border-slate-200/50">
                    <canvas id="chart-sl"></canvas>
                </div>
                <!-- 表格區 -->
                <div class="table-wrap overflow-x-auto p-4 md:p-6">
                    <table class="w-full text-left whitespace-nowrap">
                        <thead>
                            <tr class="text-slate-600 text-sm border-b-2 border-slate-300">
                                <th class="px-4 py-3 font-bold">財務年度</th>
                                <th class="px-4 py-3 font-bold">使用年度</th>
                                <th class="px-4 py-3 font-bold text-center">本期使用時間</th>
                                <th class="px-4 py-3 font-bold text-right">折舊費用</th>
                                <th class="px-4 py-3 font-bold text-right">累計折舊</th>
                                <th class="px-4 py-3 font-bold text-right">帳面金額</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-sl" class="divide-y divide-slate-300/50"></tbody>
                        <tfoot id="tfoot-sl" class="border-t-2 border-slate-400 font-bold bg-white/30"></tfoot>
                    </table>
                </div>
            </div>

            <!-- 2. 年數合計法報表與圖表 -->
            <div class="glass-card overflow-hidden mb-8 page-break-avoid">
                <div class="bg-emerald-600/10 border-b border-slate-400/30 px-6 py-4 flex items-center">
                    <div class="w-3 h-8 bg-emerald-500 rounded-full mr-3 no-print"></div>
                    <h2 class="text-xl font-bold text-slate-800">二、 年數合計法 (Sum-of-the-Years'-Digits)</h2>
                </div>
                <!-- 圖表區 -->
                <div class="chart-container border-b border-slate-200/50">
                    <canvas id="chart-syd"></canvas>
                </div>
                <!-- 表格區 -->
                <div class="table-wrap overflow-x-auto p-4 md:p-6">
                    <table class="w-full text-left whitespace-nowrap">
                        <thead>
                            <tr class="text-slate-600 text-sm border-b-2 border-slate-300">
                                <th class="px-4 py-3 font-bold">財務年度</th>
                                <th class="px-4 py-3 font-bold">使用年度</th>
                                <th class="px-4 py-3 font-bold text-center">本期使用時間</th>
                                <th class="px-4 py-3 font-bold text-right">折舊費用</th>
                                <th class="px-4 py-3 font-bold text-right">累計折舊</th>
                                <th class="px-4 py-3 font-bold text-right">帳面金額</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-syd" class="divide-y divide-slate-300/50"></tbody>
                        <tfoot id="tfoot-syd" class="border-t-2 border-slate-400 font-bold bg-white/30"></tfoot>
                    </table>
                </div>
            </div>

            <!-- 3. 倍數餘額遞減法報表與圖表 -->
            <div class="glass-card overflow-hidden mb-8 page-break-avoid">
                <div class="bg-purple-600/10 border-b border-slate-400/30 px-6 py-4 flex items-center">
                    <div class="w-3 h-8 bg-purple-500 rounded-full mr-3 no-print"></div>
                    <h2 class="text-xl font-bold text-slate-800">三、 餘額遞減法 (Declining Balance)</h2>
                </div>
                <!-- 圖表區 -->
                <div class="chart-container border-b border-slate-200/50">
                    <canvas id="chart-db"></canvas>
                </div>
                <!-- 表格區 -->
                <div class="table-wrap overflow-x-auto p-4 md:p-6">
                    <table class="w-full text-left whitespace-nowrap">
                        <thead>
                            <tr class="text-slate-600 text-sm border-b-2 border-slate-300">
                                <th class="px-4 py-3 font-bold">財務年度</th>
                                <th class="px-4 py-3 font-bold">使用年度</th>
                                <th class="px-4 py-3 font-bold text-center">本期使用時間</th>
                                <th class="px-4 py-3 font-bold text-right">折舊費用</th>
                                <th class="px-4 py-3 font-bold text-right">累計折舊</th>
                                <th class="px-4 py-3 font-bold text-right">帳面金額</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-db" class="divide-y divide-slate-300/50"></tbody>
                        <tfoot id="tfoot-db" class="border-t-2 border-slate-400 font-bold bg-white/30"></tfoot>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        // 金額格式化 (加入千分位逗號)
        function formatMoney(num) {
            return Math.round(num).toLocaleString('en-US');
        }

        function showError(msg) {
            const errorDiv = document.getElementById('error-msg');
            errorDiv.innerText = msg;
            errorDiv.classList.remove('hidden');
            document.getElementById('report-container').classList.add('hidden');
            document.getElementById('btn-export').classList.add('hidden');
        }

        function exportPDF() {
            window.print();
        }

        // 儲存 Chart.js 實例
        let charts = {};

        // 繪製【共用 Y 軸】的混合圖表
        function renderMixedChart(canvasId, labels, depData, bvData, colorTheme) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            
            if (charts[canvasId]) {
                charts[canvasId].destroy();
            }

            let barColor, lineColor;
            if (colorTheme === 'blue') { barColor = 'rgba(59, 130, 246, 0.7)'; lineColor = '#1d4ed8'; }
            if (colorTheme === 'emerald') { barColor = 'rgba(16, 185, 129, 0.7)'; lineColor = '#047857'; }
            if (colorTheme === 'purple') { barColor = 'rgba(168, 85, 247, 0.7)'; lineColor = '#7e22ce'; }

            charts[canvasId] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            type: 'line',
                            label: '期末帳面金額 (Line)',
                            data: bvData,
                            borderColor: lineColor,
                            backgroundColor: lineColor,
                            borderWidth: 3,
                            tension: 0.3, 
                            pointBackgroundColor: '#ffffff',
                            pointBorderWidth: 2,
                            pointRadius: 4,
                            order: 1
                            // 移除 yAxisID，強制使用預設的 Y 軸
                        },
                        {
                            type: 'bar',
                            label: '本期折舊費用 (Bar)',
                            data: depData,
                            backgroundColor: barColor,
                            borderRadius: 4,
                            order: 2
                            // 移除 yAxisID，強制使用預設的 Y 軸
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { position: 'top', labels: { font: { family: "'Noto Sans TC', sans-serif", size: 13, weight: 'bold' } } },
                        tooltip: {
                            titleFont: { family: "'Noto Sans TC', sans-serif", size: 14 },
                            bodyFont: { family: "'Noto Sans TC', sans-serif", size: 13 },
                            padding: 12,
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) label += ': $';
                                    if (context.parsed.y !== null) label += formatMoney(context.parsed.y);
                                    return label;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { 
                            grid: { display: false },
                            ticks: { font: { family: "'Noto Sans TC', sans-serif", weight: 'bold' } }
                        },
                        y: {  // 統一使用單一 Y 軸
                            type: 'linear', 
                            display: true, 
                            position: 'left',
                            beginAtZero: true, // 確保從 0 開始，比例才會正確
                            title: { display: true, text: '金額 ($)', font: { family: "'Noto Sans TC', sans-serif", weight: 'bold' } },
                            grid: { color: 'rgba(0, 0, 0, 0.08)' },
                            ticks: { font: { family: "'Noto Sans TC', sans-serif" } }
                        }
                    }
                }
            });
        }

        function generateReport() {
            document.getElementById('error-msg').classList.add('hidden');

            const preparer = document.getElementById('preparer').value || '未提供';
            const reportDate = document.getElementById('reportDate').value || '未提供';
            const costStr = document.getElementById('cost').value;
            const salvageStr = document.getElementById('salvage').value;
            const lifeStr = document.getElementById('life').value;
            const monthStr = document.getElementById('month').value;
            const dbMultiplierStr = document.getElementById('dbMultiplier').value;

            // 檢查是否有空值
            if (!costStr || !salvageStr || !lifeStr || !monthStr || !dbMultiplierStr) {
                return showError('請將所有資產與折舊參數填寫完整 (不能為空)。');
            }

            const cost = parseFloat(costStr);
            const salvage = parseFloat(salvageStr);
            const life = parseInt(lifeStr);
            const m = parseInt(monthStr);
            const dbMultiplier = parseFloat(dbMultiplierStr);

            if (cost <= 0 || life <= 0 || dbMultiplier <= 0) return showError('成本、年限與倍數必須大於 0。');
            if (salvage >= cost) return showError('預估殘值必須小於資產成本。');
            if (m < 1 || m > 12) return showError('購買月份必須在 1 到 12 之間。');

            document.getElementById('print-asset-info').innerHTML = `
                購置成本：$${formatMoney(cost)}<br>
                估計殘值：$${formatMoney(salvage)}<br>
                耐用年限：${life} 年 (購買月份：${m} 月)
            `;
            document.getElementById('print-meta-info').innerHTML = `
                製表人：${preparer}<br>
                報表日期：${reportDate}
            `;

            // --- 核心會計運算 ---
            const monthsYr1 = 13 - m;
            const monthsLast = 12 - monthsYr1;
            const depreciableAmount = cost - salvage;
            const totalPeriods = monthsLast > 0 ? life + 1 : life;

            function getYearInfo(i) {
                if (monthsLast === 0) return { assetYear: `第 ${i + 1} 載`, months: 12 };
                if (i === 0) return { assetYear: `第 1 載`, months: monthsYr1 };
                if (i === totalPeriods - 1) return { assetYear: `第 ${life} 載`, months: monthsLast };
                return { assetYear: `第 ${i}-${i+1} 載`, months: 12 };
            }

            let depSL = [], depSYD = [], depDB = [];

            // (1) 直線法
            const annualSL = depreciableAmount / life;
            depSL.push(annualSL * (monthsYr1 / 12));
            for (let i = 1; i < life; i++) depSL.push(annualSL);
            if (monthsLast > 0) depSL.push(annualSL * (monthsLast / 12));

            // (2) 年數合計法
            const sydDenominator = life * (life + 1) / 2;
            let assetYrSYD = [];
            for (let i = 0; i < life; i++) assetYrSYD.push(depreciableAmount * ((life - i) / sydDenominator));
            depSYD.push(assetYrSYD[0] * (monthsYr1 / 12));
            for (let i = 1; i < life; i++) depSYD.push(assetYrSYD[i - 1] * (monthsLast / 12) + assetYrSYD[i] * (monthsYr1 / 12));
            if (monthsLast > 0) depSYD.push(assetYrSYD[life - 1] * (monthsLast / 12));

            // (3) 倍數餘額遞減法
            const rateDB = dbMultiplier / life;
            let assetYrDB = [];
            let bvTemp = cost;
            for (let i = 0; i < life; i++) {
                let d = bvTemp * rateDB;
                assetYrDB.push(d);
                bvTemp -= d;
            }
            let depDBRaw = [];
            depDBRaw.push(assetYrDB[0] * (monthsYr1 / 12));
            for (let i = 1; i < life; i++) depDBRaw.push(assetYrDB[i - 1] * (monthsLast / 12) + assetYrDB[i] * (monthsYr1 / 12));
            if (monthsLast > 0) depDBRaw.push(assetYrDB[life - 1] * (monthsLast / 12));

            let accDBTemp = 0;
            for (let i = 0; i < depDBRaw.length; i++) {
                let d = depDBRaw[i];
                if (accDBTemp + d > depreciableAmount) d = Math.max(0, depreciableAmount - accDBTemp);
                depDB.push(d);
                accDBTemp += d;
            }

            // --- 報表渲染與圖表資料準備 ---
            let labels = [];
            let bvHistSL = [], bvHistSYD = [], bvHistDB = [];

            function renderTableAndCollectData(tbodyId, tfootId, depArray, bvHistArray) {
                const tbody = document.getElementById(tbodyId);
                const tfoot = document.getElementById(tfootId);
                tbody.innerHTML = '';
                
                let bv = cost;
                let acc = 0;

                for (let i = 0; i < totalPeriods; i++) {
                    let expense = depArray[i] || 0;
                    acc += expense;
                    bv -= expense;

                    // 修正最後一期微小尾差
                    if (i === totalPeriods - 1 && Math.abs(bv - salvage) < 1) bv = salvage;

                    bvHistArray.push(bv); // 收集期末帳面價值供圖表使用
                    if (tbodyId === 'tbody-sl') labels.push(`第 ${i + 1} 期`); 

                    let info = getYearInfo(i);
                    
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-white/50 transition-colors";
                    tr.innerHTML = `
                        <td class="px-4 py-3 font-bold text-slate-700">第 ${i + 1} 期</td>
                        <td class="px-4 py-3 text-slate-600 font-medium">${info.assetYear}</td>
                        <td class="px-4 py-3 text-center"><span class="bg-white/60 border border-slate-300 text-slate-800 py-1 px-3 rounded-full text-xs font-bold shadow-sm">${info.months} 個月</span></td>
                        <td class="px-4 py-3 text-right font-mono font-bold text-blue-700">${formatMoney(expense)}</td>
                        <td class="px-4 py-3 text-right font-mono font-bold text-emerald-700">${formatMoney(acc)}</td>
                        <td class="px-4 py-3 text-right font-mono font-bold text-slate-800">${formatMoney(bv)}</td>
                    `;
                    tbody.appendChild(tr);
                }

                tfoot.innerHTML = `
                    <tr>
                        <td colspan="3" class="px-4 py-4 text-center tracking-widest text-slate-700 font-extrabold">合 計</td>
                        <td class="px-4 py-4 text-right font-mono font-extrabold text-blue-700">${formatMoney(acc)}</td>
                        <td class="px-4 py-4 text-right font-mono font-extrabold text-emerald-700">${formatMoney(acc)}</td>
                        <td class="px-4 py-4 text-right font-mono font-extrabold text-slate-500 text-sm">--</td>
                    </tr>
                `;
            }

            // 渲染三張表格並收集折線圖資料
            renderTableAndCollectData('tbody-sl', 'tfoot-sl', depSL, bvHistSL);
            renderTableAndCollectData('tbody-syd', 'tfoot-syd', depSYD, bvHistSYD);
            renderTableAndCollectData('tbody-db', 'tfoot-db', depDB, bvHistDB);

            // 繪製統一比例尺圖表
            renderMixedChart('chart-sl', labels, depSL, bvHistSL, 'blue');
            renderMixedChart('chart-syd', labels, depSYD, bvHistSYD, 'emerald');
            renderMixedChart('chart-db', labels, depDB, bvHistDB, 'purple');

            document.getElementById('report-container').classList.remove('hidden');
            document.getElementById('btn-export').classList.remove('hidden');
            
            document.getElementById('report-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    </script>
</body>
</html>
