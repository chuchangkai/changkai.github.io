<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英泰自動控制行 - 數位維修單</title>
    <style>
        /* =========================================
           1. 視覺系統與配色 (Color & Variables)
           ========================================= */
        :root {
            --primary-blue: #007AFF;
            --primary-grad: linear-gradient(135deg, #007AFF 0%, #0055b3 100%);
            --accent-green: #34C759;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --card-bg: rgba(255, 255, 255, 0.5);
            --header-bg: rgba(235, 245, 255, 0.6);
            --text-main: #1d1d1f;
            --shadow-soft: 0 8px 30px rgba(0,0,0,0.12);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 40px 20px 150px;
            color: var(--text-main);
            background: linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .paper {
            width: 210mm;
            min-height: 297mm;
            margin: 0 auto;
            padding: 8mm 8mm;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 20px;
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(255, 255, 255, 1);
            position: relative;
        }

        .header {
            border-bottom: 2px solid rgba(0,0,0,0.05);
            padding-bottom: 15px;
            margin-bottom: 20px;
            position: relative;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .company-block h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 800;
            background: linear-gradient(45deg, #007AFF, #00C6FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .en-title {
            font-size: 14px;
            color: #888;
            font-weight: 600;
            letter-spacing: 3px;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .doc-badge {
            background: var(--primary-blue);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,122,255,0.3);
            display: inline-block;
        }

        .company-info {
            margin-top: 15px;
            font-size: 15px;
            color: #444;
            line-height: 1.8;
            font-weight: 500;
            background: rgba(255,255,255,0.5);
            padding: 10px;
            border-radius: 10px;
        }
        
        .info-icon { margin-right: 5px; font-size: 16px; }

        .meta-row {
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            margin-top: 10px;
        }
        .meta-box {
            background: #f2f2f7;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 14px;
            display: flex;
            align-items: center;
        }
        .meta-box input { background: transparent; width: 110px; text-align: right; font-weight: bold; padding: 0;}

        .section-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.8);
            background: linear-gradient(to bottom right, rgba(235, 245, 255, 0.7), rgba(255, 255, 255, 0.4));
        }

        .section-card.issue-card {
            background: linear-gradient(to bottom right, rgba(255, 240, 240, 0.7), rgba(255, 255, 255, 0.4));
        }

        .card-title {
            font-size: 14px;
            color: #555;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
        }
        .card-title::before {
            content: '';
            display: inline-block;
            width: 4px; height: 16px;
            background: var(--primary-blue);
            margin-right: 8px;
            border-radius: 2px;
        }

        input, textarea {
            width: 100%;
            border: 1px solid rgba(0,0,0,0.05);
            background: rgba(255,255,255,0.6);
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            color: #333;
            transition: all 0.3s;
            box-sizing: border-box;
        }
        input:focus, textarea:focus {
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(0,122,255,0.2);
            border-color: var(--primary-blue);
        }

        .client-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .desc-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        .desc-table td.label { 
            width: 80px; font-weight: bold; color: #444; vertical-align: top; padding-top: 10px; 
            text-align: right; padding-right: 15px;
        }
        .desc-table textarea { min-height: 50px; }

        .parts-container {
            background: white;
            border-radius: 16px;
            padding: 5px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.02);
            border: 1px solid rgba(0,0,0,0.05);
        }
        .parts-table { width: 100%; border-collapse: collapse; }
        .parts-table th {
            background: #f2f2f7;
            color: #555;
            padding: 10px;
            font-size: 13px;
            text-align: center;
        }
        .parts-table th:first-child { border-radius: 10px 0 0 10px; }
        .parts-table th:last-child { border-radius: 0 10px 10px 0; }
        
        .parts-table td { padding: 5px; }
        .parts-table input { text-align: center; background: transparent; border: none; border-bottom: 1px dashed #ddd; border-radius: 0; }
        .parts-table input:focus { background: #f9f9f9; border-bottom: 1px solid var(--primary-blue); box-shadow: none; }
        
        .total-area {
            text-align: right;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            border-top: 2px dashed #eee;
            margin-top: 10px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }
        #grandTotal { 
            width: 150px; font-size: 24px; color: var(--primary-blue); 
            background: transparent; border: none; text-align: right;
            font-weight: 800;
        }

        .footer { display: flex; justify-content: space-between; margin-top: 30px; gap: 20px; }
        .sign-box {
            flex: 1;
            background: rgba(255,255,255,0.5);
            border: 2px solid #e5e5ea;
            border-radius: 12px;
            padding: 15px;
            position: relative;
        }
        .sign-title { font-size: 14px; font-weight: bold; color: #555; margin-bottom: 30px; border-bottom: 1px solid #ddd; padding-bottom: 5px;}
        .sign-line { border-bottom: 1px dashed #aaa; height: 40px; margin-top: 10px;}

        .btn-del { 
            color: red; cursor: pointer; font-weight: bold; font-size: 18px; 
            display: flex; justify-content: center; width: 30px;
        }
        .toolbar {
            position: fixed;
            z-index: 9999;
            right: 20px;
            bottom: max(18px, env(safe-area-inset-bottom));
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 10px;
            max-width: min(760px, calc(100vw - 40px));
            padding: 10px;
            border: 1px solid rgba(255,255,255,.9);
            border-radius: 18px;
            background: rgba(255,255,255,.94);
            box-shadow: 0 10px 30px rgba(31,35,40,.18);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        .btn-float {
            min-height: 44px;
            background: var(--primary-grad);
            color: white;
            border: none;
            padding: 10px 17px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: bold;
            line-height: 1.2;
            white-space: nowrap;
            box-shadow: 0 5px 15px rgba(0,122,255,0.3);
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }
        .btn-float:hover { transform: translateY(-2px); filter: brightness(1.03); }
        .btn-float:focus-visible { outline: 3px solid rgba(0,122,255,.28); outline-offset: 2px; }

        @media (max-width: 760px) {
            body { padding-bottom: 210px; }
            .toolbar {
                left: 10px;
                right: 10px;
                bottom: max(10px, env(safe-area-inset-bottom));
                max-width: none;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                padding: 9px;
                border-radius: 16px;
            }
            .btn-float {
                width: 100%;
                min-width: 0;
                padding: 10px 8px;
                font-size: 14px;
            }
            .toolbar .btn-float:first-child {
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 390px) {
            body { padding-bottom: 250px; }
            .toolbar { grid-template-columns: 1fr; }
            .toolbar .btn-float:first-child { grid-column: auto; }
        }

        @media print {
            body { 
                background: white; 
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .toolbar, .btn-del { display: none !important; }
            
            .paper {
                box-shadow: none; margin: 0; width: 100%; border: none;
                background: white;
            }

            .section-card {
                background-color: rgba(235, 245, 255, 0.4) !important;
                border: 1px solid #ddd !important;
            }
            .section-card.issue-card {
                background-color: rgba(255, 240, 240, 0.4) !important;
            }
            .parts-table th { background-color: #f2f2f7 !important; }

            input, textarea { 
                border: none !important; 
                background: transparent !important; 
                box-shadow: none !important;
            }
            
            .company-block h1 { 
                background: none; 
                -webkit-text-fill-color: #007AFF; 
                color: #007AFF; 
            }
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button class="btn-float" onclick="addPartRow()"><span>+</span> 新增項目</button>
        <button class="btn-float" style="background: var(--accent-green);" onclick="exportFormalPDF()"><span>📄</span> 正式 PDF</button>
        <button class="btn-float" onclick="exportFormalWord()"><span>W</span> Word 備用</button>
    </div>

    <div class="paper">
        
        <div class="header">
            <div class="header-top">
                <div class="company-block">
                    <h1>英泰自動控制行</h1>
                    <div class="en-title">INTAI AUTO CONTROL</div>
                </div>
                <div style="text-align: right;">
                    <div class="doc-badge">維修單</div>
                    <div class="meta-row">
                        <div class="meta-box">
                            No. <input type="text" id="orderNo">
                        </div>
                        <div class="meta-box">
                            Date. <input type="date" id="dateField">
                        </div>
                    </div>
                </div>
            </div>

            <div class="company-info">
                <span class="info-icon">📍</span>彰化縣員林市員集路2段493巷4弄10號<br>
                <div style="margin-top: 5px;">
                    <span class="info-icon">📞</span>04-8356923 &nbsp;&nbsp; 
                    <span class="info-icon">📱</span>0935-435757 &nbsp;&nbsp; 
                    <span class="info-icon">📠</span>04-8341151 &nbsp;&nbsp; 
                    <span class="info-icon">🆔</span>45229579
                </div>
            </div>
        </div>

        <div class="section-card">
            <div class="card-title">客戶資料 Client Info</div>
            <div class="client-grid">
                <div class="input-group">
                    <label>客戶名稱 / Customer Name</label>
                    <input type="text" id="customerName" placeholder="請輸入客戶名稱" style="font-weight: bold; font-size: 16px;">
                </div>
                <div class="input-group">
                    <label>機器編號 / Machine No.</label>
                    <input type="text" id="machineNo" placeholder="編號...">
                </div>
                <div class="input-group">
                    <label>維修開始 / Start Time</label>
                    <input type="time" id="startTime">
                </div>
                <div class="input-group">
                    <label>維修結束 / End Time</label>
                    <input type="time" id="endTime">
                </div>
            </div>
        </div>

        <div class="section-card issue-card">
            <div class="card-title" style="color: #d63031;">故障與檢測 Issues & Diagnosis</div>
            <table class="desc-table">
                <tr>
                    <td class="label">故障情形</td>
                    <td><textarea id="issue" placeholder="描述..."></textarea></td>
                </tr>
                <tr>
                    <td class="label">故障原因</td>
                    <td><textarea id="cause" placeholder="原因..."></textarea></td>
                </tr>
                <tr>
                    <td class="label">處理對策</td>
                    <td><textarea id="solution" placeholder="建議事項..."></textarea></td>
                </tr>
            </table>
        </div>

        <div class="parts-container">
            <table class="parts-table" id="partsTable">
                <thead>
                    <tr>
                        <th width="35%" style="text-align: left; padding-left: 15px;">項目 / 零件名稱</th>
                        <th width="20%">規 格</th>
                        <th width="10%">數量</th>
                        <th width="15%">單 價</th>
                        <th width="15%">小 計</th>
                        <th width="5%"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="padding-left: 15px;"><input type="text" placeholder="輸入項目" style="text-align: left;"></td>
                        <td><input type="text"></td>
                        <td><input type="number" class="qty" value="1" oninput="calcTotal(this)"></td>
                        <td><input type="number" class="price" oninput="calcTotal(this)"></td>
                        <td><input type="text" class="subtotal" readonly></td>
                        <td><div class="btn-del" onclick="deleteRow(this)">×</div></td>
                    </tr>
                </tbody>
            </table>
            
            <div class="total-area">
                <span style="margin-right: 20px; color: #666;">總計 Total Amount:</span>
                <input type="text" id="grandTotal" readonly value="0">
            </div>
        </div>

        <div class="footer">
            <div class="sign-box">
                <div class="sign-title">客戶簽名 / Client Signature</div>
                <div class="sign-line"></div>
            </div>
            <div class="sign-box">
                <div class="sign-title">維修人員 / Engineer</div>
                <div class="sign-line" style="position: relative;">
                    <span style="position: absolute; bottom: 5px; right: 20px; font-weight: bold; font-size: 18px;">朱文言</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        // 1. 初始化
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        document.getElementById('dateField').valueAsDate = today;
        document.getElementById('orderNo').value = `${year}${month}${day}`;

        // 2. 正式文件輸出（PDF 與 Word 共用同一份模板）
        const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({
            '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
        }[ch]));
        const nl2br = value => esc(value).replace(/\n/g, '<br>');
        const toNumber = value => Math.max(0, Number(value) || 0);
        const moneyText = value => Math.round(value).toLocaleString('zh-TW');

        function getFormalData() {
            const rows = [...document.querySelectorAll('#partsTable tbody tr')].map(tr => ({
                item: tr.cells[0]?.querySelector('input')?.value || '',
                spec: tr.cells[1]?.querySelector('input')?.value || '',
                qty: tr.querySelector('.qty')?.value || '',
                price: tr.querySelector('.price')?.value || ''
            })).filter(r => r.item || r.spec || r.qty !== '1' || toNumber(r.price));
            const total = rows.reduce((sum, r) => sum + toNumber(r.qty) * toNumber(r.price), 0);
            const iso = document.getElementById('dateField').value || '';
            const displayDate = /^\d{4}-\d{2}-\d{2}$/.test(iso)
                ? `<span class="latin">${iso.slice(0,4)}</span><span class="date-kai"> 年 </span><span class="latin">${iso.slice(5,7)}</span><span class="date-kai"> 月 </span><span class="latin">${iso.slice(8,10)}</span><span class="date-kai"> 日</span>` : esc(iso);
            return {
                orderNo: document.getElementById('orderNo').value,
                date: displayDate,
                customer: document.getElementById('customerName').value.trim(),
                machineNo: document.getElementById('machineNo').value,
                startTime: document.getElementById('startTime').value,
                endTime: document.getElementById('endTime').value,
                issue: document.getElementById('issue').value,
                cause: document.getElementById('cause').value,
                solution: document.getElementById('solution').value,
                rows, total
            };
        }

        function formalFileName(ext) {
            const d = document.getElementById('dateField').value.replaceAll('-', '') || `${year}${month}${day}`;
            const customer = (document.getElementById('customerName').value.trim() || '客戶').replace(/[\\/:*?"<>|]/g, '_');
            return `${d}_${customer}_正式維修單.${ext}`;
        }

        function formalDocumentHtml() {
            const d = getFormalData();
            const filledRows = d.rows.map((r, i) => {
                const subtotal = toNumber(r.qty) * toNumber(r.price);
                return `<tr><td class="center latin">${i + 1}</td><td>${esc(r.item)}</td><td>${esc(r.spec)}</td><td class="center latin">${esc(r.qty)}</td><td class="right latin">${r.price ? '$' + moneyText(r.price) : ''}</td><td class="right latin">${subtotal ? '$' + moneyText(subtotal) : ''}</td></tr>`;
            }).join('');
            const blankRows = Array.from({length: Math.max(0, 3 - d.rows.length)}, () => '<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td></tr>').join('');
            return `<!DOCTYPE html>
<html lang="zh-TW" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="UTF-8"><meta name="ProgId" content="Word.Document"><title>${esc(formalFileName('pdf').replace('.pdf',''))}</title>
<style>
/* 為了讓列印跟 Word 顯示一致，調整 @page 和字體 */
@page { size: A4 portrait; margin: 15mm 20mm; background-color: #ffffff; }
@page WordSection1 { size:595.3pt 841.9pt; margin:28pt 35pt; mso-header-margin:14pt; mso-footer-margin:14pt; }
div.WordSection1 { page:WordSection1; }
* { box-sizing:border-box; }
html,body { margin:0; padding:0; background:#fff; color:#000; }
body,table,td,th,p,div,span { font-family:"Times New Roman","DFKai-SB","BiauKai","標楷體",serif; mso-ascii-font-family:"Times New Roman"; mso-hansi-font-family:"Times New Roman"; mso-fareast-font-family:"DFKai-SB"; }
body { font-size:11pt; line-height:1.28; -webkit-print-color-adjust:exact; print-color-adjust:exact; }

.title { margin:16pt 0 12pt; text-align:center; font-family:"DFKai-SB","BiauKai","標楷體",serif; mso-fareast-font-family:"DFKai-SB"; font-size:18pt; font-weight:bold; letter-spacing:6pt; }
.contact { margin:0 0 6pt; text-align:center; font-family:"DFKai-SB","BiauKai","標楷體",serif; mso-fareast-font-family:"DFKai-SB"; font-size:12pt; font-weight:normal; line-height:1.35; }
.address-line { margin-bottom:7pt; }

.contact-number { font-family:"Times New Roman",serif; mso-ascii-font-family:"Times New Roman"; mso-hansi-font-family:"Times New Roman"; font-size:12pt; font-weight:normal; }

.meta td { height:23pt; }
.section { margin-top:9pt; page-break-inside:avoid; }

.center { text-align:center; } .right { text-align:right; }
.date-kai { font-family:"DFKai-SB","BiauKai","標楷體",serif; mso-fareast-font-family:"DFKai-SB"; }
.latin { font-family:"Times New Roman",serif; mso-ascii-font-family:"Times New Roman"; mso-hansi-font-family:"Times New Roman"; }
.total td { height:29pt; border-top:.75pt solid #555; background:transparent; font-weight:normal; }
.total-label { font-family:"DFKai-SB","BiauKai","標楷體",serif; mso-fareast-font-family:"DFKai-SB"; font-size:11pt; }

        function validateFormal() {
            const field = document.getElementById('customerName');
            if (!field.value.trim()) { alert('請先填寫客戶名稱。'); field.focus(); return false; }
            return true;
        }

        // 修改 exportFormalPDF 函數，改用隱藏的 iframe 觸發原生列印
        function exportFormalPDF() {
            if (!validateFormal()) return;
            
            const html = formalDocumentHtml();
            
            // 建立一個隱藏的 iframe 作為列印容器
            const iframe = document.createElement('iframe');
            iframe.style.position = 'fixed';
            iframe.style.right = '0';
            iframe.style.bottom = '0';
            iframe.style.width = '0';
            iframe.style.height = '0';
            iframe.style.border = '0';
            document.body.appendChild(iframe);
            
            const doc = iframe.contentWindow.document;
            doc.open();
            doc.write(html);
            doc.close();
            
            // 設定標題 (列印時會預設成儲存的檔名)
            doc.title = formalFileName('pdf').replace('.pdf', '');

            // 等待字體與 DOM 載入後觸發原生列印對話框
            iframe.contentWindow.focus();
            setTimeout(() => {
                iframe.contentWindow.print();
                
                // 使用者完成儲存或取消後清理 iframe
                setTimeout(() => iframe.remove(), 2000);
            }, 500);
        }

        function exportFormalWord() {
            if (!validateFormal()) return;
            const blob = new Blob(['\ufeff', formalDocumentHtml()], {type:'application/msword;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = formalFileName('doc');
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1500);
        }

        // 3. 計算
        function calcTotal(input) {
            const row = input.closest('tr');
            const qty = parseFloat(row.querySelector('.qty').value) || 0;
            const price = parseFloat(row.querySelector('.price').value) || 0;
            const total = Math.round(qty * price);
            row.querySelector('.subtotal').value = total > 0 ? total : '';
            updateGrandTotal();
        }

        function updateGrandTotal() {
            let sum = 0;
            document.querySelectorAll('.subtotal').forEach(el => sum += parseFloat(el.value) || 0);
            document.getElementById('grandTotal').value = sum.toLocaleString();
        }

        // 4. 新增刪除
        function addPartRow() {
            const tbody = document.querySelector('#partsTable tbody');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="padding-left: 15px;"><input type="text" style="text-align: left;"></td>
                <td><input type="text"></td>
                <td><input type="number" class="qty" value="1" oninput="calcTotal(this)"></td>
                <td><input type="number" class="price" oninput="calcTotal(this)"></td>
                <td><input type="text" class="subtotal" readonly></td>
                <td><div class="btn-del" onclick="deleteRow(this)">×</div></td>
            `;
            tbody.appendChild(tr);
        }

        function deleteRow(btn) {
            const tbody = document.querySelector('#partsTable tbody');
            if (tbody.rows.length > 1) {
                btn.closest('tr').remove();
                updateGrandTotal();
            }
        }
    </script>
