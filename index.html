<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>英泰自動控制行｜整合服務系統</title>
<style>
:root{
  --blue:#007AFF;--blue-dark:#0057D9;--cyan:#64D2FF;--mint:#34C7B8;
  --purple:#5365C9;--purple-dark:#394AB5;--green:#34C759;
  --text:rgba(17,24,39,.94);--muted:rgba(31,41,55,.66);
  --stroke:rgba(255,255,255,.68);--stroke-strong:rgba(255,255,255,.96);
  --shadow:0 26px 72px rgba(30,64,122,.18),0 8px 22px rgba(30,64,122,.10),inset 0 1.5px 0 rgba(255,255,255,.96),inset 0 -1px 1px rgba(110,150,215,.14);
  --shadow-soft:0 18px 48px rgba(30,64,122,.14),inset 0 1.5px 0 rgba(255,255,255,.90);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:var(--font);color:var(--text)}
body{overflow:hidden;background:radial-gradient(circle at 15% 8%,rgba(0,122,255,.20),transparent 34%),radial-gradient(circle at 82% 12%,rgba(116,88,255,.16),transparent 31%),radial-gradient(circle at 48% 88%,rgba(52,199,184,.18),transparent 36%),linear-gradient(160deg,#f8fbff 0%,#eef6ff 43%,#f7fbfb 100%)}
body::before,body::after{content:"";position:fixed;inset:-22%;pointer-events:none;z-index:-2;filter:blur(40px)}
body::before{background:radial-gradient(circle at 27% 38%,rgba(0,122,255,.20),transparent 29%),radial-gradient(circle at 76% 62%,rgba(0,220,190,.15),transparent 31%)}
body::after{z-index:-1;background:radial-gradient(circle at 64% 22%,rgba(255,255,255,.75),transparent 22%),radial-gradient(circle at 22% 78%,rgba(175,210,255,.20),transparent 27%)}
.shell{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);position:relative}

/* Desktop navigation */
.topbar{z-index:50;width:min(1180px,calc(100vw - 28px));min-height:76px;margin:14px auto 0;padding:10px 12px;display:grid;grid-template-columns:minmax(220px,1fr) auto minmax(220px,1fr);align-items:center;gap:14px;border:1px solid var(--stroke);border-top-color:var(--stroke-strong);border-radius:30px;background:linear-gradient(135deg,rgba(255,255,255,.70),rgba(255,255,255,.25));box-shadow:var(--shadow);backdrop-filter:blur(25px) saturate(1.9);-webkit-backdrop-filter:blur(25px) saturate(1.9)}
.brand{display:flex;align-items:center;gap:12px;min-width:0;padding-left:4px}.brandmark{width:46px;height:46px;flex:0 0 46px;border-radius:16px;display:grid;place-items:center;color:#fff;font-size:18px;font-weight:950;background:linear-gradient(135deg,var(--blue),var(--blue-dark) 58%,var(--mint));box-shadow:0 12px 24px rgba(0,122,255,.26),inset 0 1px 0 rgba(255,255,255,.45)}
.brandtext{min-width:0}.brandtext strong{display:block;font-size:15px;font-weight:900;white-space:nowrap}.brandtext small{display:block;margin-top:3px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.15em;white-space:nowrap}
.navtabs{display:flex;align-items:center;gap:8px;padding:5px;border:1px solid rgba(255,255,255,.60);border-radius:999px;background:rgba(255,255,255,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.80)}
.navtab{min-height:48px;padding:0 18px;border:0;border-radius:999px;background:transparent;color:#526070;font:850 14px var(--font);cursor:pointer;white-space:nowrap;transition:transform .2s,background .2s,color .2s,box-shadow .2s}.navtab:hover{background:rgba(255,255,255,.55);transform:translateY(-1px)}.navtab.active{color:#fff;background:linear-gradient(135deg,var(--purple),var(--purple-dark));box-shadow:0 10px 22px rgba(57,74,181,.26),inset 0 1px 0 rgba(255,255,255,.35)}.navtab[data-view="repair"].active{background:linear-gradient(135deg,var(--blue),var(--blue-dark))}.navtab .ico{margin-right:6px}
.module-status{justify-self:end;text-align:right;padding-right:7px;color:var(--muted);font-size:12px;font-weight:700}.module-status b{display:block;margin-top:3px;color:#0878F9;font-size:14px;font-weight:900}

.stage{position:relative;min-height:0}.view{position:absolute;inset:0;display:none}.view.active{display:block}.frame{display:block;width:100%;height:100%;border:0;background:transparent}
.home{overflow:auto;padding:24px 20px 70px}.dashboard{width:min(1180px,100%);margin:0 auto;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(360px,.88fr);gap:22px;align-items:stretch}
.hero{position:relative;overflow:hidden;isolation:isolate;min-height:420px;padding:clamp(34px,5vw,62px);border:1px solid var(--stroke);border-top-color:var(--stroke-strong);border-radius:44px;background:linear-gradient(135deg,rgba(255,255,255,.47),rgba(255,255,255,.11));box-shadow:var(--shadow);backdrop-filter:blur(24px) saturate(1.9);-webkit-backdrop-filter:blur(24px) saturate(1.9);display:flex;flex-direction:column;justify-content:center}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 10% 0%,rgba(255,255,255,.92),transparent 38%),radial-gradient(circle at 92% 92%,rgba(100,210,255,.22),transparent 36%)}
.hero::after{content:"INTAI";position:absolute;right:-18px;bottom:-24px;z-index:-1;color:rgba(0,122,255,.055);font:950 clamp(82px,13vw,170px)/1 "Times New Roman",serif;letter-spacing:-.06em}
.eyebrow{display:inline-flex;align-items:center;width:max-content;padding:9px 14px;border-radius:999px;color:#076BCF;background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.68);font-size:12px;font-weight:900;letter-spacing:.18em}
.hero h1{margin:20px 0 14px;font-size:clamp(38px,5.8vw,70px);line-height:1.02;letter-spacing:-.045em}.hero h1 span{background:linear-gradient(135deg,var(--blue),var(--blue-dark) 55%,var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{max-width:690px;margin:0;color:var(--muted);font-size:clamp(15px,1.7vw,19px);font-weight:650;line-height:1.75}.hero-meta{display:flex;flex-wrap:wrap;gap:9px;margin-top:25px}.meta-pill{padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.40);border:1px solid rgba(255,255,255,.65);color:#516071;font-size:12px;font-weight:850}
.quick{display:grid;grid-template-rows:1fr 1fr;gap:18px}.module-card{position:relative;overflow:hidden;isolation:isolate;width:100%;padding:27px;border:1px solid var(--stroke);border-top-color:var(--stroke-strong);border-radius:34px;text-align:left;background:linear-gradient(135deg,rgba(255,255,255,.48),rgba(255,255,255,.12));box-shadow:var(--shadow-soft);backdrop-filter:blur(20px) saturate(1.7);-webkit-backdrop-filter:blur(20px) saturate(1.7);cursor:pointer;transition:transform .24s,box-shadow .24s}.module-card::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 12% 0%,rgba(255,255,255,.78),transparent 38%)}.module-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;gap:14px}.module-icon{width:56px;height:56px;flex:0 0 56px;border-radius:20px;display:grid;place-items:center;color:#fff;font-size:26px;box-shadow:0 12px 24px rgba(30,64,122,.20),inset 0 1px 0 rgba(255,255,255,.42)}.repair-card .module-icon{background:linear-gradient(135deg,var(--blue),var(--blue-dark))}.invoice-card .module-icon{background:linear-gradient(135deg,#6575D4,#394AB5)}.module-card h2{margin:0;font-size:23px;font-weight:950}.module-card .en{display:block;margin-top:3px;color:var(--muted);font-size:11px;font-weight:850;letter-spacing:.12em}.module-card p{margin:17px 0 0;color:var(--muted);font-size:14px;font-weight:600;line-height:1.65}.features{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}.feature{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.60);color:#596678;font-size:11px;font-weight:850}.enter{display:flex;align-items:center;justify-content:space-between;margin-top:18px;color:#0869CC;font-size:14px;font-weight:950}.invoice-card .enter{color:#4B50B5}.arrow{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.52);font-size:18px}

/* Mobile navigation becomes a real bottom app bar */
@media(max-width:900px){
  .shell{grid-template-rows:minmax(0,1fr)}
  .topbar{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));top:auto;width:auto;min-height:72px;margin:0;padding:8px;grid-template-columns:1fr;border-radius:25px;z-index:100}
  .brand,.module-status{display:none}.navtabs{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0;border:0;background:transparent;box-shadow:none}.navtab{min-width:0;min-height:56px;padding:5px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:18px;font-size:11px;line-height:1.1}.navtab .ico{margin:0;font-size:20px}.navtab .label{display:block}.stage{position:absolute;inset:0}.home{padding:12px 10px calc(105px + env(safe-area-inset-bottom))}.dashboard{grid-template-columns:1fr;gap:14px}.hero{min-height:330px;padding:28px 22px;border-radius:31px}.hero::after{font-size:88px;right:-8px;bottom:-10px}.quick{grid-template-rows:auto;gap:14px}.module-card{padding:22px;border-radius:28px}.frame{padding-bottom:88px}
}
@media(max-width:520px){.hero h1{font-size:39px}.hero p{font-size:14px}.module-card h2{font-size:20px}.module-icon{width:50px;height:50px;flex-basis:50px;border-radius:17px}.hero-meta{gap:6px}.meta-pill{font-size:10px;padding:7px 10px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar">
  <div class="brand"><div class="brandmark">英</div><div class="brandtext"><strong>英泰整合服務系統</strong><small>INTAI SERVICE HUB</small></div></div>
  <nav class="navtabs" aria-label="系統模組切換">
    <button class="navtab active" data-view="home" onclick="switchView('home')"><span class="ico">⌂</span><span class="label">首頁</span></button>
    <button class="navtab" data-view="repair" onclick="switchView('repair')"><span class="ico">🔧</span><span class="label">維修單</span></button>
    <button class="navtab" data-view="invoice" onclick="switchView('invoice')"><span class="ico">🧾</span><span class="label">發票套印</span></button>
  </nav>
  <div class="module-status">目前使用模組<b id="currentLabel">整合首頁</b></div>
</header>
<main class="stage">
  <section class="view home active" id="view-home">
    <div class="dashboard">
      <section class="hero">
        <span class="eyebrow">INTAI AUTO CONTROL</span>
        <h1><span>維修與發票</span><br>整合工作中心</h1>
        <p>以一致的 Liquid Glass 模塊介面，集中處理維修服務紀錄與三聯式發票套印。兩個模組保留各自的資料、計算與輸出流程，切換時互不干擾。</p>
        <div class="hero-meta"><span class="meta-pill">單一 HTML</span><span class="meta-pill">桌機與手機適用</span><span class="meta-pill">模組獨立載入</span></div>
      </section>
      <section class="quick" aria-label="快速進入模組">
        <button class="module-card repair-card" onclick="switchView('repair')">
          <span class="card-head"><span class="module-icon">🔧</span><span><h2>數位維修單</h2><span class="en">LIQUID SERVICE DESK</span></span></span>
          <p>填寫客戶資料、故障檢測、處理對策、零件明細與簽署內容。</p>
          <span class="features"><span class="feature">正式 PDF</span><span class="feature">DOCX 文件</span><span class="feature">零件計算</span></span>
          <span class="enter">進入維修單<span class="arrow">›</span></span>
        </button>
        <button class="module-card invoice-card" onclick="switchView('invoice')">
          <span class="card-head"><span class="module-icon">🧾</span><span><h2>三聯式發票套印</h2><span class="en">TRIPLICATE INVOICE PRINTING</span></span></span>
          <p>管理常用客戶、計價方式與商品明細，完成發票預覽及精準套印。</p>
          <span class="features"><span class="feature">客戶名單</span><span class="feature">含稅／未稅</span><span class="feature">模板校正</span></span>
          <span class="enter">進入發票套印<span class="arrow">›</span></span>
        </button>
      </section>
    </div>
  </section>
  <section class="view" id="view-repair"><iframe class="frame" id="repairFrame" title="數位維修單系統"></iframe></section>
  <section class="view" id="view-invoice"><iframe class="frame" id="invoiceFrame" title="三聯式發票套印系統"></iframe></section>
</main>
</div>

const labels={home:'整合首頁',repair:'數位維修單',invoice:'三聯式發票套印'};
function decodeHtml(b64){return new TextDecoder('utf-8').decode(Uint8Array.from(atob(b64),c=>c.charCodeAt(0)))}
function ensureLoaded(name){const frame=document.getElementById(name+'Frame');if(frame&&!frame.dataset.loaded){frame.srcdoc=decodeHtml(embedded[name]);frame.dataset.loaded='1'}}
function switchView(name){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+name));document.querySelectorAll('.navtab').forEach(b=>b.classList.toggle('active',b.dataset.view===name));document.getElementById('currentLabel').textContent=labels[name];if(name!=='home')ensureLoaded(name)}
</script>
