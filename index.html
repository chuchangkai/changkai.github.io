<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英泰自動控制行 - 數位維修單 (iOS Glass)</title>
    <style>
        /* =========================================
           1. 設計變數 — iOS 液態玻璃風格
           ========================================= */
        :root {
            --primary-blue: #007AFF;
            --primary-dark: #0055b3;
            --primary-grad: linear-gradient(135deg, #007AFF 0%, #0055b3 100%);
            --accent-green: #34C759;
            --accent-red: #d63031;

            --glass-bg: rgba(255, 255, 255, 0.72);
            --glass-border: rgba(255, 255, 255, 0.9);
            --glass-card-bg: rgba(255, 255, 255, 0.5);
            --glass-issue-bg: rgba(255, 240, 240, 0.55);
            --blur-amount: 24px;

            --surface-input: rgba(255, 255, 255, 0.88);
            --surface-readonly: rgba(240, 242, 247, 0.75);

            --text-primary: #1a1a1f;
            --text-secondary: #5c5c66;
            --text-label: #555;
            --text-placeholder: #9a9aa8;

            --border-input: rgba(0, 0, 0, 0.12);
            --border-focus: #007AFF;
            --border-card: rgba(255, 255, 255, 0.7);

            --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.06), 0 0 0 0.5px rgba(0,0,0,0.04);
            --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.08);
            --shadow-input-focus: 0 0 0 3px rgba(0, 122, 255, 0.2);
            --shadow-toolbar: 0 12px 40px rgba(31, 35, 40, 0.2);

            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-xl: 28px;

            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
                "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;

            --transition-fast: 0.18s ease;
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            font-family: var(--font-stack);
            margin: 0;
            padding: 24px 20px 200px;
            color: var(--text-primary);
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background-attachment: fixed;
        }

        .form-container {
            width: 100%;
            max-width: 860px;
            margin: 0 auto;
            padding: clamp(20px, 3vw, 36px) clamp(16px, 3vw, 32px);
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-glass);
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            gap: clamp(18px, 2.5vw, 28px);
            transition: all var(--transition-smooth);
        }

        /* 頁首 */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            padding-bottom: 18px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        .company-block h1 {
            margin: 0;
            font-size: clamp(22px, 3.5vw, 32px);
            font-weight: 800;
            background: linear-gradient(45deg, #007AFF, #00A8FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .en-title {
            font-size: 13px;
            color: #999;
            font-weight: 600;
            letter-spacing: 3px;
            margin-top: 3px;
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            flex-shrink: 0;
        }

        .doc-badge {
            background: var(--primary-grad);
            color: #fff;
            padding: 7px 22px;
            border-radius: 22px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 14px rgba(0, 122, 255, 0.3);
            white-space: nowrap;
        }

        .meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .meta-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 7px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            border: 1px solid rgba(255,255,255,0.6);
            white-space: nowrap;
        }
        .meta-box input {
            width: 105px;
            text-align: right;
            font-weight: 700;
            background: transparent;
            border: none;
            padding: 2px 0;
            font-size: 13px;
            color: var(--text-primary);
            outline: none;
        }
        .meta-box input:focus {
            color: var(--primary-blue);
        }

        .company-info {
            margin-top: 14px;
            font-size: 14px;
            color: #555;
            line-height: 1.7;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255,255,255,0.7);
            display: flex;
            flex-wrap: wrap;
            gap: 4px 16px;
            align-items: center;
        }
        .info-icon { margin-right: 3px; font-size: 15px; }
        .info-sep { color: #ccc; margin: 0 2px; }

        /* 卡片 */
        .section-card {
            background: var(--glass-card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-md);
            padding: clamp(16px, 2.5vw, 24px);
            border: 1px solid rgba(255, 255, 255, 0.65);
            transition: border-color var(--transition-fast);
        }
        .section-card:focus-within {
            border-color: rgba(0, 122, 255, 0.3);
        }
        .section-card.issue-card {
            background: var(--glass-issue-bg);
            border-color: rgba(255, 200, 200, 0.5);
        }

        .card-title {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 700;
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 17px;
            background: var(--primary-blue);
            border-radius: 3px;
            flex-shrink: 0;
        }
        .section-card.issue-card .card-title {
            color: #b03030;
        }
        .section-card.issue-card .card-title::before {
            background: var(--accent-red);
        }

        /* 輸入框加大清晰 */
        input[type="text"],
        input[type="number"],
        input[type="date"],
        input[type="time"],
        textarea {
            width: 100%;
            border: 1.8px solid var(--border-input);
            background: var(--surface-input);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-family: var(--font-stack);
            color: var(--text-primary);
            transition: all var(--transition-fast);
            box-sizing: border-box;
            line-height: 1.5;
            -webkit-appearance: none;
            appearance: none;
        }
        input::placeholder,
        textarea::placeholder {
            color: var(--text-placeholder);
            font-weight: 400;
        }
        input:hover,
        textarea:hover {
            border-color: rgba(0,0,0,0.2);
            background: rgba(255,255,255,0.95);
        }
        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--border-focus);
            background: #fff;
            box-shadow: var(--shadow-input-focus);
        }
        input[readonly] {
            background: var(--surface-readonly);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-color: rgba(0,0,0,0.08);
            color: #555;
            cursor: default;
            font-weight: 600;
        }
        #grandTotal {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary-blue);
            background: rgba(240, 248, 255, 0.8);
            border-color: rgba(0, 122, 255, 0.2);
            text-align: right;
        }
        textarea {
            min-height: 68px;
            resize: vertical;
        }

        .client-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 20px;
        }
        .input-group label {
            font-size: 13px;
            color: var(--text-label);
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .desc-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
        }
        .desc-table td.label {
            width: 85px;
            font-weight: 700;
            color: #555;
            vertical-align: top;
            padding-top: 14px;
            text-align: right;
            padding-right: 14px;
            font-size: 15px;
            white-space: nowrap;
        }

        /* 零件容器 */
        .parts-container {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-md);
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            overflow: hidden;
        }
        .parts-table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin: 0 -10px;
            padding: 0 10px;
        }
        .parts-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
            table-layout: auto;
        }
        .parts-table th {
            background: rgba(240, 242, 247, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #555;
            padding: 12px 8px;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.4px;
            border-bottom: 1px solid rgba(0,0,0,0.08);
        }
        .parts-table td {
            padding: 8px 6px;
            vertical-align: middle;
        }
        .parts-table input {
            text-align: center;
            background: rgba(255,255,255,0.8);
            border: 1.5px solid rgba(0,0,0,0.08);
            border-radius: 10px;
            padding: 12px 8px;
            font-size: 15px;
            width: 100%;
            min-width: 50px;
            transition: all var(--transition-fast);
        }
        .parts-table td:first-child input {
            text-align: left;
        }
        .parts-table input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 2.5px rgba(0, 122, 255, 0.15);
            background: #fff;
        }
        .parts-table .subtotal {
            font-weight: 600;
            color: #222;
        }

        .btn-del {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            color: #e04040;
            cursor: pointer;
            font-weight: 700;
            font-size: 20px;
            transition: all var(--transition-fast);
            user-select: none;
            background: rgba(255,255,255,0.7);
            border: 1px solid rgba(255,200,200,0.6);
            line-height: 1;
            margin: 0 auto;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .btn-del:hover {
            background: #ffe8e8;
            border-color: #e04040;
            transform: scale(1.08);
        }

        .parts-add-btn {
            display: flex;
            justify-content: flex-start;
            margin-top: 14px;
            padding-left: 4px;
        }
        .btn-add-part {
            background: rgba(0, 122, 255, 0.1);
            border: 1px dashed rgba(0, 122, 255, 0.4);
            color: #007AFF;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.6);
        }
        .btn-add-part:hover {
            background: rgba(0, 122, 255, 0.15);
            border-color: #007AFF;
            transform: translateY(-1px);
        }

        .total-area {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 16px;
            padding: 18px 10px 8px;
            border-top: 2px dashed rgba(0,0,0,0.08);
            margin-top: 14px;
            flex-wrap: wrap;
        }
        .total-area span {
            color: #555;
            font-weight: 700;
            font-size: 16px;
        }

        .footer {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }
        .sign-box {
            flex: 1 1 180px;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.7);
            border-radius: var(--radius-md);
            padding: 18px;
            position: relative;
            min-width: 140px;
        }
        .sign-title {
            font-size: 14px;
            font-weight: 700;
            color: #555;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            padding-bottom: 8px;
        }
        .sign-line {
            border-bottom: 1.5px dashed rgba(0,0,0,0.2);
            height: 42px;
            margin-top: 8px;
        }
        .engineer-name {
            position: absolute;
            bottom: 14px;
            right: 22px;
            font-weight: 700;
            font-size: 18px;
            color: #333;
            letter-spacing: 1px;
        }

        /* 工具列 */
        .toolbar {
            position: fixed;
            z-index: 9999;
            right: 20px;
            bottom: max(18px, env(safe-area-inset-bottom));
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 10px;
            max-width: min(400px, calc(100vw - 40px));
            padding: 10px 14px;
            border: 1px solid rgba(255,255,255,0.8);
            border-radius: 18px;
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--shadow-toolbar);
        }
        .btn-float {
            min-height: 44px;
            background: var(--primary-grad);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 14.5px;
            font-weight: 700;
            line-height: 1.2;
            white-space: nowrap;
            box-shadow: 0 4px 14px rgba(0, 122, 255, 0.28);
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.3px;
        }
        .btn-float.btn-green {
            background: linear-gradient(135deg, #34C759, #28a745);
        }
        .btn-float.btn-word {
            background: linear-gradient(135deg, #5c6bc0, #3f51b5);
        }

        /* ========== 響應式強化 ========== */
        @media (max-width: 768px) {
            body {
                padding: 16px 12px 180px;
            }
            .form-container {
                padding: 16px 12px;
                gap: 16px;
                border-radius: var(--radius-md);
            }
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .header-right {
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
                gap: 8px;
            }
            .client-grid {
                grid-template-columns: 1fr;
            }
            .desc-table td.label {
                width: 70px;
                font-size: 14px;
            }
            input,
            textarea {
                font-size: 15px;
                padding: 10px 12px;
            }
            .parts-table {
                min-width: 520px;
            }
            .parts-table input {
                font-size: 14px;
                padding: 10px 6px;
            }
            .total-area {
                flex-direction: column;
                align-items: flex-end;
            }
            .toolbar {
                left: 12px;
                right: 12px;
                max-width: none;
                justify-content: center;
                gap: 8px;
                bottom: max(12px, env(safe-area-inset-bottom));
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 8px 4px 200px;
            }
            .form-container {
                padding: 12px 8px;
                border-radius: 14px;
                gap: 12px;
            }
            .company-block h1 {
                font-size: 20px;
            }
            .meta-row {
                flex-direction: column;
                gap: 6px;
            }
            .meta-box {
                justify-content: space-between;
                width: 100%;
            }
            .meta-box input {
                width: 100%;
            }
            .parts-table {
                min-width: 460px;
            }
            .parts-table input {
                font-size: 13px;
                padding: 8px 4px;
            }
            .btn-del {
                width: 28px;
                height: 28px;
                font-size: 18px;
            }
            .sign-box {
                min-width: 120px;
                padding: 14px;
            }
            .btn-float {
                padding: 8px 12px;
                font-size: 13px;
                min-height: 40px;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
                padding: 8px 10px;
                border-radius: 16px;
            }
            .toolbar .btn-float {
                width: 100%;
            }
        }

        @media (max-width: 380px) {
            .parts-table {
                min-width: 420px;
            }
            .parts-table input {
                font-size: 12px;
                padding: 7px 2px;
            }
            .btn-del {
                width: 26px;
                height: 26px;
                font-size: 16px;
            }
            body {
                padding-bottom: 220px;
            }
        }

        /* 列印樣式 */
        @media print {
            body {
                background: white !important;
                padding: 0 !important;
            }
            .toolbar,
            .btn-del,
            .parts-add-btn {
                display: none !important;
            }
            .form-container {
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                background: white;
                box-shadow: none;
                border: none;
                padding: 10mm 8mm;
            }
            input,
            textarea {
                border: 1px solid #ccc !important;
                background: white !important;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button class="btn-float btn-green" onclick="exportFormalPDF()"><span>📄</span> 正式 PDF</button>
        <button class="btn-float btn-word" onclick="exportFormalWord()"><span>📝</span> Word 備用</button>
    </div>

    <div class="form-container">
        <div class="header">
            <div class="company-block">
                <h1>英泰自動控制行</h1>
                <div class="en-title">INTAI AUTO CONTROL</div>
            </div>
            <div class="header-right">
                <div class="doc-badge">🔧 維修單</div>
                <div class="meta-row">
                    <div class="meta-box">單號 <input type="text" id="orderNo"></div>
                    <div class="meta-box">日期 <input type="date" id="dateField"></div>
                </div>
            </div>
        </div>

        <div class="company-info">
            <span class="info-icon">📍</span> 彰化縣員林市員集路2段493巷4弄10號
            <span class="info-sep">｜</span> 📞 04-8356923 ｜ 📱 0935-435757 ｜ 📠 04-8341151 ｜ 🆔 45229579
        </div>

        <div class="section-card">
            <div class="card-title">客戶資料 Client Info</div>
            <div class="client-grid">
                <div class="input-group"><label>客戶名稱</label><input type="text" id="customerName" placeholder="請輸入客戶名稱" style="font-weight:600;"></div>
                <div class="input-group"><label>機器編號</label><input type="text" id="machineNo" placeholder="編號..."></div>
                <div class="input-group"><label>維修開始</label><input type="time" id="startTime"></div>
                <div class="input-group"><label>維修結束</label><input type="time" id="endTime"></div>
            </div>
        </div>

        <div class="section-card issue-card">
            <div class="card-title">故障與檢測</div>
            <table class="desc-table">
                <tr><td class="label">故障情形</td><td><textarea id="issue" placeholder="描述..."></textarea></td></tr>
                <tr><td class="label">故障原因</td><td><textarea id="cause" placeholder="原因..."></textarea></td></tr>
                <tr><td class="label">處理對策</td><td><textarea id="solution" placeholder="建議事項..."></textarea></td></tr>
            </table>
        </div>

        <div class="parts-container">
            <div class="parts-table-wrap">
                <table class="parts-table" id="partsTable">
                    <thead>
                        <tr>
                            <th style="width:30%; text-align:left; padding-left:14px;">項目 / 零件名稱</th>
                            <th style="width:18%;">規格</th>
                            <th style="width:10%;">數量</th>
                            <th style="width:16%;">單價</th>
                            <th style="width:16%;">小計</th>
                            <th style="width:10%;"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><input type="text" placeholder="輸入項目" style="text-align:left;"></td>
                            <td><input type="text" placeholder="規格"></td>
                            <td><input type="number" class="qty" value="1" min="1" oninput="onQtyPriceChange(this)"></td>
                            <td><input type="number" class="price" min="0" oninput="onQtyPriceChange(this)" placeholder="0"></td>
                            <td><input type="text" class="subtotal" placeholder="0" oninput="onSubtotalManual(this)"></td>
                            <td><div class="btn-del" onclick="deleteRow(this)">×</div></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="parts-add-btn">
                <button class="btn-add-part" onclick="addPartRow()"><span>＋</span> 新增零件項目</button>
            </div>
            <div class="total-area">
                <span>💰 總計金額</span>
                <input type="text" id="grandTotal" readonly value="0">
            </div>
        </div>

        <div class="footer">
            <div class="sign-box">
                <div class="sign-title">✍️ 客戶簽名</div>
                <div class="sign-line"></div>
            </div>
            <div class="sign-box" style="position:relative;">
                <div class="sign-title">🔩 維修人員</div>
                <div class="sign-line"></div>
                <span class="engineer-name">朱文言</span>
            </div>
        </div>
    </div>

    <script>
        // 初始化日期與單號
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        document.getElementById('dateField').valueAsDate = today;
        document.getElementById('orderNo').value = `${year}${month}${day}`;

        const esc = v => String(v??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const nl2br = v => esc(v).replace(/\n/g,'<br>');
        const toNum = v => Math.max(0, Number(v)||0);
        const money = v => Math.round(v).toLocaleString('zh-TW');

        function getFormalData(){
            const rows = [...document.querySelectorAll('#partsTable tbody tr')].map(tr=>{
                const item = tr.cells[0]?.querySelector('input')?.value || '';
                const spec = tr.cells[1]?.querySelector('input')?.value || '';
                const qty = tr.querySelector('.qty')?.value || '';
                const price = tr.querySelector('.price')?.value || '';
                return {item,spec,qty,price};
            }).filter(r=>r.item||r.spec||r.qty!=='1'||toNum(r.price));
            const total = rows.reduce((s,r)=>s+toNum(r.qty)*toNum(r.price),0);
            const iso = document.getElementById('dateField').value||'';
            const displayDate = /^\d{4}-\d{2}-\d{2}$/.test(iso)
                ? `<span class="latin">${iso.slice(0,4)}</span><span class="date-kai"> 年 </span><span class="latin">${iso.slice(5,7)}</span><span class="date-kai"> 月 </span><span class="latin">${iso.slice(8,10)}</span><span class="date-kai"> 日</span>`
                : esc(iso);
            return {
                orderNo: document.getElementById('orderNo').value,
                date: displayDate,
                customer: document.getElementById('customerName').value.trim(),
                machineNo: document.getElementById('machineNo').value,
                startTime: document.getElementById('startTime').value,
                endTime: document.getElementById('endTime').value,
                issue: document.getElementById('issue').value,
                cause: document.getElementById('cause').value,
                solution: document.getElementById('solution').value,
                rows, total
            };
        }

        function formalFileName(ext){
            const d = document.getElementById('dateField').value.replaceAll('-','')||`${year}${month}${day}`;
            const cust = (document.getElementById('customerName').value.trim()||'客戶').replace(/[\\/:*?"<>|]/g,'_');
            return `${d}_${cust}_正式維修單.${ext}`;
        }

        function formalDocumentHtml(){
            const d = getFormalData();
            const filledRows = d.rows.map((r,i)=>{
                const subtotal = toNum(r.qty)*toNum(r.price);
                return `<tr><td class="center latin">${i+1}</td><td>${esc(r.item)}</td><td>${esc(r.spec)}</td><td class="center latin">${esc(r.qty)}</td><td class="right latin">${r.price?'$'+money(r.price):''}</td><td class="right latin">${subtotal?'$'+money(subtotal):''}</td></tr>`;
            }).join('');
            const blankRows = Array.from({length:Math.max(0,3-d.rows.length)},()=>'<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td></tr>').join('');
            return `<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><title>${esc(formalFileName('pdf').replace('.pdf',''))}</title><style>@page{size:A4 portrait;margin:15mm 20mm;}body{font-family:"Times New Roman","DFKai-SB",serif;font-size:11pt;line-height:1.28;}table{width:100%;border-collapse:collapse;}td,th{border:.5pt solid #777;padding:4pt 5pt;}.latin{font-family:"Times New Roman",serif;}.date-kai{font-family:"DFKai-SB",serif;}</style></head><body><p style="text-align:center;color:#0070C0;font-size:18pt;font-weight:bold;">英泰自動控制行</p><p style="text-align:center;color:#C00000;font-size:10pt;">INTAI AUTO CONTROL</p><p style="text-align:center;font-size:18pt;font-weight:bold;">維 修 單</p><p style="text-align:center;">彰化縣員林市員集路2段493巷4弄10號<br>Tel:04-8356923 Mobile:0935-435757 Fax:04-8341151 統編:45229579</p><table><tr><td>維修單號</td><td>${esc(d.orderNo)}</td><td>填單日期</td><td>${d.date}</td></tr><tr><td>客戶名稱</td><td>${esc(d.customer)}</td><td>機器編號</td><td>${esc(d.machineNo)}</td></tr><tr><td>開始時間</td><td>${esc(d.startTime)}</td><td>完成時間</td><td>${esc(d.endTime)}</td></tr></table><p><b>故障情形</b><br>${nl2br(d.issue)}</p><p><b>故障原因</b><br>${nl2br(d.cause)}</p><p><b>處理對策</b><br>${nl2br(d.solution)}</p><table><tr><th>項次</th><th>項目</th><th>規格</th><th>數量</th><th>單價</th><th>小計</th></tr>${filledRows}${blankRows}</table><p style="text-align:right;">總計: NT$ ${money(d.total)} (未稅)</p><table><tr><td>客戶簽章:</td><td>維修人員: 朱文言</td></tr></table></body></html>`;
        }

        function validateFormal(){
            const f = document.getElementById('customerName');
            if(!f.value.trim()){ alert('請填寫客戶名稱'); f.focus(); return false; }
            return true;
        }

        function exportFormalPDF(){
            if(!validateFormal()) return;
            const html = formalDocumentHtml();
            const iframe = document.createElement('iframe');
            iframe.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
            document.body.appendChild(iframe);
            const doc = iframe.contentWindow.document;
            doc.open(); doc.write(html); doc.close();
            doc.title = formalFileName('pdf').replace('.pdf','');
            iframe.contentWindow.focus();
            setTimeout(()=>{ iframe.contentWindow.print(); setTimeout(()=>iframe.remove(),2000); },500);
        }

        function exportFormalWord(){
            if(!validateFormal()) return;
            const blob = new Blob(['\ufeff',formalDocumentHtml()],{type:'application/msword;charset=utf-8'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = formalFileName('doc');
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(()=>URL.revokeObjectURL(a.href),1500);
        }

        function calcSubtotal(row){
            const qty = toNum(row.querySelector('.qty').value);
            const price = toNum(row.querySelector('.price').value);
            const subtotalInput = row.querySelector('.subtotal');
            if(row.dataset.manual === 'true') return;
            const calc = qty * price;
            subtotalInput.value = calc > 0 ? calc.toLocaleString() : '';
            updateGrandTotal();
        }

        function onQtyPriceChange(input){
            const row = input.closest('tr');
            row.dataset.manual = 'false';
            calcSubtotal(row);
        }

        function onSubtotalManual(input){
            const row = input.closest('tr');
            row.dataset.manual = 'true';
            updateGrandTotal();
        }

        function updateGrandTotal(){
            let sum = 0;
            document.querySelectorAll('#partsTable tbody tr').forEach(tr => {
                const val = tr.querySelector('.subtotal').value;
                const num = parseFloat(String(val).replace(/,/g,'')) || 0;
                sum += num;
            });
            document.getElementById('grandTotal').value = sum.toLocaleString();
        }

        function addPartRow(){
            const tbody = document.querySelector('#partsTable tbody');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="text" placeholder="輸入項目" style="text-align:left;"></td>
                <td><input type="text" placeholder="規格"></td>
                <td><input type="number" class="qty" value="1" min="1" oninput="onQtyPriceChange(this)"></td>
                <td><input type="number" class="price" min="0" oninput="onQtyPriceChange(this)" placeholder="0"></td>
                <td><input type="text" class="subtotal" placeholder="0" oninput="onSubtotalManual(this)"></td>
                <td><div class="btn-del" onclick="deleteRow(this)">×</div></td>
            `;
            tbody.appendChild(tr);
            tr.querySelector('input').focus();
            updateGrandTotal();
        }

        function deleteRow(btn){
            const tbody = document.querySelector('#partsTable tbody');
            if(tbody.rows.length <= 1){
                const row = btn.closest('tr');
                row.querySelectorAll('input').forEach(inp => { if(!inp.classList.contains('qty')) inp.value = ''; else inp.value = '1'; });
                row.querySelector('.subtotal').value = '';
                row.dataset.manual = 'false';
                updateGrandTotal();
            } else {
                btn.closest('tr').remove();
                updateGrandTotal();
            }
        }
    </script>
</body>
</html>
