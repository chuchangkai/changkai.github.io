<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英泰自動控制行 - 數位維修單</title>
    <!-- 引入 html2pdf.js 用於客戶端直接生成 PDF，不經過列印對話框 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* =========================================
           1. 視覺系統與配色 (Color & Variables)
           ========================================= */
        :root {
            --primary-blue: #007AFF;
            --primary-grad: linear-gradient(135deg, #007AFF 0%, #0055b3 100%);
            --accent-green: #34C759;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --card-bg: rgba(255, 255, 255, 0.5);
            --header-bg: rgba(235, 245, 255, 0.6);
            --text-main: #1d1d1f;
            --shadow-soft: 0 8px 30px rgba(0,0,0,0.12);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 40px 20px 150px;
            color: var(--text-main);
            background: linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
        }

        /* 主體玻璃容器 */
        .paper {
            width: 210mm;
            min-height: 297mm;
            margin: 0 auto;
            padding: 8mm 8mm;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 20px;
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(255, 255, 255, 1);
            position: relative;
        }

        /* 抬頭與基本設定保留您的原設計... */
        .header { border-bottom: 2px solid rgba(0,0,0,0.05); padding-bottom: 15px; margin-bottom: 20px; position: relative; }
        .header-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .company-block h1 { margin: 0; font-size: 30px; font-weight: 800; background: linear-gradient(45deg, #007AFF, #00C6FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px; }
        .en-title { font-size: 14px; color: #888; font-weight: 600; letter-spacing: 3px; margin-top: 5px; text-transform: uppercase; }
        .doc-badge { background: var(--primary-blue); color: white; padding: 5px 15px; border-radius: 20px; font-size: 16px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,122,255,0.3); display: inline-block; }
        .company-info { margin-top: 15px; font-size: 15px; color: #444; line-height: 1.8; font-weight: 500; background: rgba(255,255,255,0.5); padding: 10px; border-radius: 10px; }
        .info-icon { margin-right: 5px; font-size: 16px; }
        .meta-row { display: flex; justify-content: flex-end; gap: 15px; margin-top: 10px; }
        .meta-box { background: #f2f2f7; padding: 5px 12px; border-radius: 8px; font-size: 14px; display: flex; align-items: center; }
        .meta-box input { background: transparent; width: 110px; text-align: right; font-weight: bold; padding: 0; border:none; outline:none;}

        /* 卡片區塊 */
        .section-card { background: linear-gradient(to bottom right, rgba(235, 245, 255, 0.7), rgba(255, 255, 255, 0.4)); border-radius: 16px; padding: 15px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.8); }
        .section-card.issue-card { background: linear-gradient(to bottom right, rgba(255, 240, 240, 0.7), rgba(255, 255, 255, 0.4)); }
        .card-title { font-size: 14px; color: #555; font-weight: 700; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; }
        .card-title::before { content: ''; display: inline-block; width: 4px; height: 16px; background: var(--primary-blue); margin-right: 8px; border-radius: 2px; }

        input, textarea { width: 100%; border: 1px solid rgba(0,0,0,0.05); background: rgba(255,255,255,0.6); padding: 8px 10px; border-radius: 8px; font-size: 15px; font-family: inherit; color: #333; transition: all 0.3s; box-sizing: border-box; }
        input:focus, textarea:focus { outline: none; background: #fff; box-shadow: 0 0 0 3px rgba(0,122,255,0.2); border-color: var(--primary-blue); }

        .client-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .input-group label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; font-weight: 600; }
        .desc-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        .desc-table td.label { width: 80px; font-weight: bold; color: #444; vertical-align: top; padding-top: 10px; text-align: right; padding-right: 15px; }
        .desc-table textarea { min-height: 50px; }

        .parts-container { background: white; border-radius: 16px; padding: 5px; box-shadow: inset 0 0 10px rgba(0,0,0,0.02); border: 1px solid rgba(0,0,0,0.05); }
        .parts-table { width: 100%; border-collapse: collapse; }
        .parts-table th { background: #f2f2f7; color: #555; padding: 10px; font-size: 13px; text-align: center; }
        .parts-table th:first-child { border-radius: 10px 0 0 10px; }
        .parts-table th:last-child { border-radius: 0 10px 10px 0; }
        .parts-table td { padding: 5px; }
        .parts-table input { text-align: center; background: transparent; border: none; border-bottom: 1px dashed #ddd; border-radius: 0; }
        .parts-table input:focus { background: #f9f9f9; border-bottom: 1px solid var(--primary-blue); box-shadow: none; }
        
        .total-area { text-align: right; padding: 15px; font-size: 18px; font-weight: bold; color: #333; border-top: 2px dashed #eee; margin-top: 10px; display: flex; justify-content: flex-end; align-items: center; }
        #grandTotal { width: 150px; font-size: 24px; color: var(--primary-blue); background: transparent; border: none; text-align: right; font-weight: 800; }

        .footer { display: flex; justify-content: space-between; margin-top: 30px; gap: 20px; }
        .sign-box { flex: 1; background: rgba(255,255,255,0.5); border: 2px solid #e5e5ea; border-radius: 12px; padding: 15px; position: relative; }
        .sign-title { font-size: 14px; font-weight: bold; color: #555; margin-bottom: 30px; border-bottom: 1px solid #ddd; padding-bottom: 5px;}
        .sign-line { border-bottom: 1px dashed #aaa; height: 40px; margin-top: 10px;}

        .btn-del { color: red; cursor: pointer; font-weight: bold; font-size: 18px; display: flex; justify-content: center; width: 30px; }
        
        /* 操作工具列 */
        .toolbar {
            position: fixed; z-index: 9999; right: 20px; bottom: max(18px, env(safe-area-inset-bottom));
            display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px;
            max-width: min(760px, calc(100vw - 40px)); padding: 10px; border: 1px solid rgba(255,255,255,.9);
            border-radius: 18px; background: rgba(255,255,255,.94); box-shadow: 0 10px 30px rgba(31,35,40,.18);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        }
        .btn-float {
            min-height: 44px; background: var(--primary-grad); color: white; border: none;
            padding: 10px 17px; border-radius: 24px; font-size: 15px; font-weight: bold;
            line-height: 1.2; white-space: nowrap; box-shadow: 0 5px 15px rgba(0,122,255,0.3);
            cursor: pointer; transition: transform 0.2s, filter 0.2s; display: inline-flex;
            align-items: center; justify-content: center; gap: 7px;
        }
        .btn-float:hover { transform: translateY(-2px); filter: brightness(1.03); }

        @media (max-width: 760px) {
            body { padding-bottom: 210px; }
            .toolbar { left: 10px; right: 10px; display: grid; grid-template-columns: 1fr 1fr; }
            .toolbar .btn-float:first-child { grid-column: 1 / -1; }
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button class="btn-float" onclick="addPartRow()"><span>+</span> 新增項目</button>
        <button class="btn-float" style="background: var(--accent-green);" onclick="exportFormalPDF()" id="pdf-btn"><span>📄</span> 正式 PDF</button>
        <button class="btn-float" onclick="exportFormalWord()"><span>W</span> Word 備用</button>
    </div>

    <!-- 網頁的視覺表單 -->
    <div class="paper">
        <div class="header">
            <div class="header-top">
                <div class="company-block">
                    <h1>英泰自動控制行</h1>
                    <div class="en-title">INTAI AUTO CONTROL</div>
                </div>
                <div style="text-align: right;">
                    <div class="doc-badge">維修單</div>
                    <div class="meta-row">
                        <div class="meta-box">No. <input type="text" id="orderNo"></div>
                        <div class="meta-box">Date. <input type="date" id="dateField"></div>
                    </div>
                </div>
            </div>
            <div class="company-info">
                <span class="info-icon">📍</span>彰化縣員林市員集路2段493巷4弄10號<br>
                <div style="margin-top: 5px;">
                    <span class="info-icon">📞</span>04-8356923 &nbsp;&nbsp; 
                    <span class="info-icon">📱</span>0935-435757 &nbsp;&nbsp; 
                    <span class="info-icon">📠</span>04-8341151 &nbsp;&nbsp; 
                    <span class="info-icon">🆔</span>45229579
                </div>
            </div>
        </div>

        <div class="section-card">
            <div class="card-title">客戶資料 Client Info</div>
            <div class="client-grid">
                <div class="input-group">
                    <label>客戶名稱 / Customer Name</label>
                    <input type="text" id="customerName" placeholder="請輸入客戶名稱" style="font-weight: bold; font-size: 16px;">
                </div>
                <div class="input-group"><label>機器編號 / Machine No.</label><input type="text" id="machineNo" placeholder="編號..."></div>
                <div class="input-group"><label>維修開始 / Start Time</label><input type="time" id="startTime"></div>
                <div class="input-group"><label>維修結束 / End Time</label><input type="time" id="endTime"></div>
            </div>
        </div>

        <div class="section-card issue-card">
            <div class="card-title" style="color: #d63031;">故障與檢測 Issues & Diagnosis</div>
            <table class="desc-table">
                <tr><td class="label">故障情形</td><td><textarea id="issue" placeholder="描述..."></textarea></td></tr>
                <tr><td class="label">故障原因</td><td><textarea id="cause" placeholder="原因..."></textarea></td></tr>
                <tr><td class="label">處理對策</td><td><textarea id="solution" placeholder="建議事項..."></textarea></td></tr>
            </table>
        </div>

        <div class="parts-container">
            <table class="parts-table" id="partsTable">
                <thead>
                    <tr><th width="35%">項目 / 零件名稱</th><th width="20%">規 格</th><th width="10%">數量</th><th width="15%">單 價</th><th width="15%">小 計</th><th width="5%"></th></tr>
                </thead>
                <tbody>
                    <tr><td><input type="text" placeholder="輸入項目" style="text-align: left;"></td><td><input type="text"></td><td><input type="number" class="qty" value="1" oninput="calcTotal(this)"></td><td><input type="number" class="price" oninput="calcTotal(this)"></td><td><input type="text" class="subtotal" readonly></td><td><div class="btn-del" onclick="deleteRow(this)">×</div></td></tr>
                </tbody>
            </table>
            <div class="total-area">
                <span style="margin-right: 20px; color: #666;">總計 Total Amount:</span>
                <input type="text" id="grandTotal" readonly value="0">
            </div>
        </div>

        <div class="footer">
            <div class="sign-box"><div class="sign-title">客戶簽名 / Client Signature</div><div class="sign-line"></div></div>
            <div class="sign-box"><div class="sign-title">維修人員 / Engineer</div><div class="sign-line" style="position: relative;"><span style="position: absolute; bottom: 5px; right: 20px; font-weight: bold; font-size: 18px;">朱文言</span></div></div>
        </div>
    </div>

    <script>
        // 1. 初始化
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        document.getElementById('dateField').valueAsDate = today;
        document.getElementById('orderNo').value = `${year}${month}${day}`;

        // 共用工具
        const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
        const nl2br = value => esc(value).replace(/\n/g, '<br>');
        const toNumber = value => Math.max(0, Number(value) || 0);
        const moneyText = value => Math.round(value).toLocaleString('zh-TW');

        function getFormalData() {
            const rows = [...document.querySelectorAll('#partsTable tbody tr')].map(tr => ({
                item: tr.cells[0]?.querySelector('input')?.value || '',
                spec: tr.cells[1]?.querySelector('input')?.value || '',
                qty: tr.querySelector('.qty')?.value || '',
                price: tr.querySelector('.price')?.value || ''
            })).filter(r => r.item || r.spec || r.qty !== '1' || toNumber(r.price));
            
            const total = rows.reduce((sum, r) => sum + toNumber(r.qty) * toNumber(r.price), 0);
            const iso = document.getElementById('dateField').value || '';
            const displayDate = /^\d{4}-\d{2}-\d{2}$/.test(iso)
                ? `<span class="latin">${iso.slice(0,4)}</span> 年 <span class="latin">${iso.slice(5,7)}</span> 月 <span class="latin">${iso.slice(8,10)}</span> 日` : esc(iso);
            
            return {
                orderNo: document.getElementById('orderNo').value,
                date: displayDate,
                customer: document.getElementById('customerName').value.trim(),
                machineNo: document.getElementById('machineNo').value,
                startTime: document.getElementById('startTime').value,
                endTime: document.getElementById('endTime').value,
                issue: document.getElementById('issue').value,
                cause: document.getElementById('cause').value,
                solution: document.getElementById('solution').value,
                rows, total
            };
        }

        function formalFileName(ext) {
            const d = document.getElementById('dateField').value.replaceAll('-', '') || `${year}${month}${day}`;
            const customer = (document.getElementById('customerName').value.trim() || '客戶').replace(/[\\/:*?"<>|]/g, '_');
            return `${d}_${customer}_正式維修單.${ext}`;
        }

        // =========================================
        // 【核心】Word 與 PDF 共享的結構模版
        // =========================================
        const formalCSS = `
            * { box-sizing: border-box; }
            .doc { width: 100%; color: #000; font-size: 11pt; line-height: 1.35; margin: 0; padding: 0;}
            .company { text-align: center; color: #0070C0; font-size: 20pt; font-weight: bold; letter-spacing: 2pt; margin: 0; }
            .english { text-align: center; color: #C00000; font-size: 11pt; font-weight: bold; letter-spacing: 1pt; margin: 2pt 0 0 0; }
            .title { text-align: center; font-size: 18pt; font-weight: bold; letter-spacing: 6pt; margin: 15pt 0 10pt 0; }
            .contact { text-align: center; font-size: 11pt; margin-bottom: 10pt; }
            .contact-line { margin-bottom: 3pt; }
            table { width: 100%; border-collapse: collapse; table-layout: fixed; margin-bottom: 12pt; }
            td, th { border: 0.5pt solid #555; padding: 5pt; vertical-align: middle; word-break: break-word; }
            th, .label { text-align: center; font-weight: bold; background-color: #f9f9f9; }
            .meta-table td { height: 25pt; }
            .desc-table-formal td { min-height: 40pt; vertical-align: top; }
            .parts-table-formal th, .parts-table-formal td { height: 25pt; text-align: center; }
            .parts-table-formal td:nth-child(2), .parts-table-formal td:nth-child(3) { text-align: left; }
            .right { text-align: right; }
            .latin { font-family: "Times New Roman", serif; }
            .total td { font-weight: bold; border-top: 1.5pt solid #333; height: 30pt; }
            .remarks { font-size: 9.5pt; line-height: 1.4; margin-bottom: 15pt; }
            .sign-table td { height: 75pt; vertical-align: top; padding: 8pt; border: 0.5pt solid #555; width: 50%; }
            .engineer { display: block; text-align: right; margin-top: 35pt; font-size: 13pt; padding-right: 20pt; }
            .footer-note { text-align: center; font-size: 9pt; color: #666; margin-top: 15pt; border-top: 0.5pt solid #aaa; padding-top: 5pt; }
            .section-title { font-weight: bold; font-size: 11.5pt; margin-bottom: 5pt; }
        `;

        function getFormalContentHtml() {
            const d = getFormalData();
            const filledRows = d.rows.map((r, i) => {
                const subtotal = toNumber(r.qty) * toNumber(r.price);
                return `<tr><td class="latin">${i + 1}</td><td>${esc(r.item)}</td><td>${esc(r.spec)}</td><td class="latin">${esc(r.qty)}</td><td class="right latin">${r.price ? '$ ' + moneyText(r.price) : ''}</td><td class="right latin">${subtotal ? '$ ' + moneyText(subtotal) : ''}</td></tr>`;
            }).join('');
            const blankRows = Array.from({length: Math.max(0, 3 - d.rows.length)}, () => '<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td></tr>').join('');
            
            return `
            <div class="doc">
                <p class="company">英泰自動控制行</p>
                <p class="english">INTAI AUTO CONTROL</p>
                <p class="title">維 修 單</p>
                <div class="contact">
                    <div class="contact-line">彰化縣員林市員集路2段493巷4弄10號</div>
                    <div class="contact-line"><span class="latin">Tel: 04-8356923 Mobile: 0935-435757 Fax: 04-8341151 統一編號: 45229579</span></div>
                </div>
                
                <table class="meta-table">
                    <colgroup><col style="width:15%"><col style="width:35%"><col style="width:15%"><col style="width:35%"></colgroup>
                    <tr><td class="label">維修單號</td><td class="latin">${esc(d.orderNo)}</td><td class="label">填單日期</td><td>${d.date}</td></tr>
                    <tr><td class="label">客戶名稱</td><td>${esc(d.customer)}</td><td class="label">機器編號</td><td class="latin">${esc(d.machineNo)}</td></tr>
                    <tr><td class="label">開始時間</td><td class="latin">${esc(d.startTime)}</td><td class="label">完成時間</td><td class="latin">${esc(d.endTime)}</td></tr>
                </table>
                
                <div class="section-title">壹、故障檢測與處理紀錄</div>
                <table class="desc-table-formal">
                    <colgroup><col style="width:15%"><col style="width:85%"></colgroup>
                    <tr><td class="label">故障情形</td><td>${nl2br(d.issue)}</td></tr>
                    <tr><td class="label">故障原因</td><td>${nl2br(d.cause)}</td></tr>
                    <tr><td class="label">處理對策</td><td>${nl2br(d.solution)}</td></tr>
                </table>
                
                <div class="section-title">貳、維修項目及零件明細</div>
                <table class="parts-table-formal">
                    <colgroup><col style="width:8%"><col style="width:32%"><col style="width:20%"><col style="width:10%"><col style="width:15%"><col style="width:15%"></colgroup>
                    <thead><tr><th>項次</th><th>項目／零件名稱</th><th>規格</th><th>數量</th><th>單價</th><th>小計</th></tr></thead>
                    <tbody>${filledRows}${blankRows}</tbody>
                    <tfoot><tr class="total"><td colspan="4" class="right">總計金額（未稅）</td><td colspan="2" class="right latin">NT$ ${moneyText(d.total)}</td></tr></tfoot>
                </table>
                
                <div class="remarks"><b>備註：</b>實際維修內容、零件規格及收費金額，以雙方確認結果為準；客戶簽章後，表示已確認本單所載維修內容。</div>
                
                <table class="sign-table">
                    <tr><td><b>客戶簽章：</b></td><td><b>維修人員：</b><span class="engineer">朱文言</span></td></tr>
                </table>
                <div class="footer-note">英泰自動控制行 維修服務紀錄</div>
            </div>`;
        }

        function validateFormal() {
            const field = document.getElementById('customerName');
            if (!field.value.trim()) { alert('請先填寫客戶名稱。'); field.focus(); return false; }
            return true;
        }

        // =========================================
        // 直接輸出 PDF 檔案 (平板繞過列印的完美解法)
        // =========================================
        async function exportFormalPDF() {
            if (!validateFormal()) return;
            
            if (typeof html2pdf === 'undefined') {
                alert('PDF 引擎尚未載入完成，請確認網路連線或重新整理網頁。');
                return;
            }

            const btn = document.getElementById('pdf-btn');
            const origText = btn.innerHTML;
            btn.innerHTML = '<span>⏳</span> 產生中...';
            btn.disabled = true;

            try {
                // 在背景產生一個用來拍照的隱藏容器 (繞開 iframe 被 iOS 封鎖的問題)
                const container = document.createElement('div');
                container.style.position = 'absolute';
                container.style.top = '0';
                container.style.left = '-9999px'; // 放去畫面外
                container.style.width = '210mm';
                container.style.padding = '15mm 20mm';
                container.style.backgroundColor = '#ffffff';
                container.style.zIndex = '-9999';
                
                // 【核心修正】: 針對平板，強迫載入 Apple 生態系內建的楷體庫
                container.style.fontFamily = '"Kaiti TC", "STKaiti", "BiauKai", "DFKai-SB", "標楷體", serif';

                // 塞入共用的 CSS 與結構
                const styleEl = document.createElement('style');
                styleEl.innerHTML = formalCSS;
                container.appendChild(styleEl);
                container.innerHTML += getFormalContentHtml();
                
                document.body.appendChild(container);

                // 給予瀏覽器微小時間載入字體排版
                await new Promise(r => setTimeout(r, 400));

                const opt = {
                    margin: 0,
                    filename: formalFileName('pdf'),
                    image: { type: 'jpeg', quality: 1.0 },
                    html2canvas: { 
                        scale: 3, // 高解析度，確保平板上文字不模糊
                        useCORS: true, 
                        letterRendering: true,
                        scrollY: 0
                    },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };

                // 直接命令 html2pdf 轉換並下載檔案，徹底繞過 window.print()
                await html2pdf().set(opt).from(container).save();
                
                // 清理背景容器
                container.remove();
                
            } catch (err) {
                console.error(err);
                alert('產生 PDF 時發生錯誤。');
            } finally {
                btn.innerHTML = origText;
                btn.disabled = false;
            }
        }

        // =========================================
        // 輸出 Word 檔案
        // =========================================
        function exportFormalWord() {
            if (!validateFormal()) return;
            
            // 將共用結構與 CSS 包裝進 Word 的格式標籤中
            const wordHtml = `<!DOCTYPE html>
                <html lang="zh-TW" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word">
                <head>
                <meta charset="UTF-8">
                <title>${esc(formalFileName('pdf').replace('.pdf',''))}</title>
                <style>
                    @page WordSection1 { size: 595.3pt 841.9pt; margin: 42.5pt 56.7pt; mso-header-margin: 14pt; mso-footer-margin: 14pt; }
                    div.WordSection1 { page: WordSection1; }
                    body { font-family: "Times New Roman", "DFKai-SB", "BiauKai", "標楷體", serif; }
                    ${formalCSS}
                </style>
                </head>
                <body><div class="WordSection1">${getFormalContentHtml()}</div></body></html>`;

            const blob = new Blob(['\ufeff', wordHtml], {type:'application/msword;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = formalFileName('doc');
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1500);
        }

        // 計算與新增刪除按鈕 (保留原本功能)
        function calcTotal(input) {
            const row = input.closest('tr');
            const qty = parseFloat(row.querySelector('.qty').value) || 0;
            const price = parseFloat(row.querySelector('.price').value) || 0;
            const total = Math.round(qty * price);
            row.querySelector('.subtotal').value = total > 0 ? total : '';
            updateGrandTotal();
        }

        function updateGrandTotal() {
            let sum = 0;
            document.querySelectorAll('.subtotal').forEach(el => sum += parseFloat(el.value) || 0);
            document.getElementById('grandTotal').value = sum.toLocaleString();
        }

        function addPartRow() {
            const tbody = document.querySelector('#partsTable tbody');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="padding-left: 15px;"><input type="text" style="text-align: left;"></td>
                <td><input type="text"></td>
                <td><input type="number" class="qty" value="1" oninput="calcTotal(this)"></td>
                <td><input type="number" class="price" oninput="calcTotal(this)"></td>
                <td><input type="text" class="subtotal" readonly></td>
                <td><div class="btn-del" onclick="deleteRow(this)">×</div></td>
            `;
            tbody.appendChild(tr);
        }

        function deleteRow(btn) {
            const tbody = document.querySelector('#partsTable tbody');
            if (tbody.rows.length > 1) {
                btn.closest('tr').remove();
                updateGrandTotal();
            }
        }
    </script>
</body>
</html>
