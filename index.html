<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>英泰自動控制行｜維修與發票整合系統</title>
<style>
:root{--blue:#007aff;--cyan:#64d2ff;--green:#34c759;--purple:#5d5fca;--text:#111827;--muted:#667085;--stroke:rgba(255,255,255,.72);--shadow:0 24px 70px rgba(30,64,122,.18),inset 0 1.5px 0 rgba(255,255,255,.92);--font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:var(--font);color:var(--text)}body{background:radial-gradient(circle at 16% 8%,rgba(0,122,255,.20),transparent 34%),radial-gradient(circle at 82% 10%,rgba(116,88,255,.16),transparent 32%),radial-gradient(circle at 50% 90%,rgba(52,199,184,.17),transparent 36%),linear-gradient(160deg,#f8fbff,#eef6ff 45%,#f7fbfb);overflow:hidden}
body:before{content:"";position:fixed;inset:-20%;pointer-events:none;background:radial-gradient(circle at 25% 40%,rgba(0,122,255,.17),transparent 29%),radial-gradient(circle at 76% 62%,rgba(0,220,190,.14),transparent 31%);filter:blur(42px)}
.shell{height:100vh;display:grid;grid-template-rows:auto 1fr;position:relative}.topbar{z-index:20;margin:14px auto 0;width:min(1180px,calc(100vw - 28px));padding:11px 13px;display:flex;align-items:center;gap:12px;border:1px solid var(--stroke);border-top-color:#fff;border-radius:28px;background:linear-gradient(135deg,rgba(255,255,255,.68),rgba(255,255,255,.25));box-shadow:var(--shadow);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8)}
.brand{display:flex;align-items:center;gap:10px;min-width:230px;padding:0 8px}.brandmark{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:white;font-weight:950;background:linear-gradient(135deg,var(--blue),#0057d9 60%,#34c7b8);box-shadow:0 9px 20px rgba(0,122,255,.25)}.brand strong{display:block;font-size:15px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.13em;margin-top:2px}
.tabs{display:flex;gap:8px;flex:1;justify-content:center}.tab{border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.34);color:#475467;border-radius:999px;min-height:46px;padding:0 18px;font:850 14px var(--font);cursor:pointer;transition:.2s;box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}.tab:hover{transform:translateY(-1px);background:rgba(255,255,255,.58)}.tab.active{color:#fff;border-color:transparent;background:linear-gradient(135deg,#6575d4,#394ab5);box-shadow:0 10px 22px rgba(57,74,181,.25),inset 0 1px 0 rgba(255,255,255,.35)}.tab[data-view="repair"].active{background:linear-gradient(135deg,#007aff,#0057d9)}
.status{min-width:230px;text-align:right;padding-right:8px;color:var(--muted);font-size:12px}.status b{color:#0878f9}.stage{position:relative;min-height:0}.view{position:absolute;inset:0;display:none}.view.active{display:block}.appframe{display:block;width:100%;height:100%;border:0;background:transparent}
.home{overflow:auto;padding:24px 20px 60px}.hero{width:min(1180px,100%);margin:0 auto;padding:clamp(28px,5vw,58px);border-radius:42px;border:1px solid var(--stroke);border-top-color:#fff;background:linear-gradient(135deg,rgba(255,255,255,.49),rgba(255,255,255,.14));box-shadow:var(--shadow);backdrop-filter:blur(24px) saturate(1.8)}.eyebrow{display:inline-flex;padding:8px 13px;border-radius:999px;background:rgba(255,255,255,.45);color:#076bcf;font-size:12px;font-weight:900;letter-spacing:.16em}.hero h1{font-size:clamp(34px,6vw,68px);line-height:1.02;margin:18px 0 12px;letter-spacing:-.04em}.hero h1 span{background:linear-gradient(135deg,#007aff,#0057d9 55%,#34c7b8);-webkit-background-clip:text;color:transparent}.hero p{margin:0;max-width:760px;color:#5e6878;font-size:clamp(15px,2vw,19px);line-height:1.7;font-weight:600}.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}.card{position:relative;overflow:hidden;text-align:left;border:1px solid var(--stroke);border-top-color:#fff;border-radius:32px;padding:28px;background:linear-gradient(135deg,rgba(255,255,255,.56),rgba(255,255,255,.18));box-shadow:0 18px 48px rgba(30,64,122,.12),inset 0 1px 0 #fff;cursor:pointer;transition:.25s}.card:hover{transform:translateY(-4px);box-shadow:0 26px 58px rgba(30,64,122,.18),inset 0 1px 0 #fff}.icon{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;font-size:27px;color:#fff;margin-bottom:20px}.repair .icon{background:linear-gradient(135deg,#007aff,#0057d9)}.invoice .icon{background:linear-gradient(135deg,#6575d4,#394ab5)}.card h2{margin:0 0 9px;font-size:24px}.card p{font-size:14px;line-height:1.65}.go{display:inline-flex;margin-top:22px;padding:11px 16px;border-radius:999px;background:rgba(255,255,255,.55);color:#075fb9;font-size:13px;font-weight:900}.invoice .go{color:#4d4fb5}
@media(max-width:760px){.topbar{margin:8px auto 0;width:calc(100vw - 12px);border-radius:22px;padding:8px;gap:6px}.brand{min-width:0;padding:0 4px}.brandmark{width:34px;height:34px}.brand strong{font-size:12px}.brand small,.status{display:none}.tabs{justify-content:flex-end}.tab{min-height:42px;padding:0 12px;font-size:12px}.home{padding:14px 8px 40px}.hero{border-radius:30px;padding:25px 18px}.cards{grid-template-columns:1fr;gap:14px}.card{border-radius:26px;padding:22px}}
@media(max-width:430px){.tab .wide{display:none}.brand strong{max-width:82px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tab{padding:0 10px}}
</style>
</head>

<div class="shell">
<header class="topbar">
  <div class="brand"><div class="brandmark">英</div><div><strong>英泰整合服務系統</strong><small>INTAI SERVICE HUB</small></div></div>
  <nav class="tabs" aria-label="系統切換">
    <button class="tab active" data-view="home" onclick="switchView('home')">⌂ <span class="wide">首頁</span></button>
    <button class="tab" data-view="repair" onclick="switchView('repair')">🔧 <span class="wide">維修單</span></button>
    <button class="tab" data-view="invoice" onclick="switchView('invoice')">🧾 <span class="wide">發票套印</span></button>
  </nav>
  <div class="status">目前模組：<b id="currentLabel">整合首頁</b></div>
</header>
<main class="stage">
  <section class="view home active" id="view-home">
    <div class="hero">
      <span class="eyebrow">INTAI AUTO CONTROL</span>
      <h1><span>維修與發票</span><br>整合工作中心</h1>
      <p>將維修服務紀錄與三聯式發票套印集中於同一個入口。兩套原有輸出流程彼此獨立，切換模組時不會清除已填寫的內容。</p>
      <div class="cards">
        <button class="card repair" onclick="switchView('repair')"><span class="icon">🔧</span><h2>數位維修單</h2><p>填寫客戶、故障檢測、處理對策與零件明細，輸出正式 PDF 或真正的 DOCX 文件。</p><span class="go">進入維修單 →</span></button>
        <button class="card invoice" onclick="switchView('invoice')"><span class="icon">🧾</span><h2>三聯式發票套印</h2><p>管理常用客戶、含稅與未稅計價、商品明細、發票預覽與套印模板。</p><span class="go">進入發票套印 →</span></button>
      </div>
    </div>
  </section>
  <section class="view" id="view-repair"><iframe class="appframe" id="repairFrame" title="數位維修單系統"></iframe></section>
  <section class="view" id="view-invoice"><iframe class="appframe" id="invoiceFrame" title="三聯式發票套印系統"></iframe></section>
</main>
</div>

const labels={home:'整合首頁',repair:'數位維修單',invoice:'三聯式發票套印'};
function decodeHtml(b64){const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));return new TextDecoder('utf-8').decode(bytes)}
function ensureLoaded(name){const frame=document.getElementById(name+'Frame');if(frame&&!frame.dataset.loaded){frame.srcdoc=decodeHtml(embedded[name]);frame.dataset.loaded='1'}}
function switchView(name){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+name));document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===name));document.getElementById('currentLabel').textContent=labels[name];if(name!=='home')ensureLoaded(name);try{localStorage.setItem('intai_last_module',name)}catch(e){}}
window.addEventListener('DOMContentLoaded',()=>{let last='home';try{last=localStorage.getItem('intai_last_module')||'home'}catch(e){}if(!labels[last])last='home';switchView(last)});
</script>
