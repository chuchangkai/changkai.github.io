<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>英泰自動控制行 - 數位維修單 Liquid Glass</title>
    <style>
        /* =========================================================
           英泰自動控制行｜Liquid Service Desk UI
           重點：保留既有功能，只重構操作介面與版面
           ========================================================= */
        :root {
            --primary-blue: #007AFF;
            --primary-dark: #0057D9;
            --primary-grad: linear-gradient(135deg, #007AFF 0%, #0057D9 100%);
            --accent-cyan: #64D2FF;
            --accent-mint: #34C7B8;
            --accent-green: #34C759;
            --accent-red: #FF3B30;

            --text-primary: rgba(17, 24, 39, .94);
            --text-secondary: rgba(31, 41, 55, .68);
            --text-label: rgba(31, 41, 55, .72);
            --text-placeholder: rgba(75, 85, 99, .48);

            --glass-clear: rgba(255,255,255,.12);
            --glass-panel: rgba(255,255,255,.22);
            --glass-panel-strong: rgba(255,255,255,.38);
            --glass-field: rgba(255,255,255,.28);
            --glass-field-focus: rgba(255,255,255,.52);
            --glass-danger: rgba(255, 245, 246, .26);
            --glass-readonly: rgba(245, 249, 255, .38);

            --stroke-glass: rgba(255,255,255,.65);
            --stroke-strong: rgba(255,255,255,.95);
            --stroke-field: rgba(255,255,255,.60);
            --shadow-float: 0 32px 84px rgba(30, 64, 122, .22), 0 8px 22px rgba(30, 64, 122, .12), inset 0 1.5px 0 rgba(255,255,255,.98), inset 0 -1.5px 1px rgba(110,150,215,.20), inset 1px 0 0 rgba(255,255,255,.35), inset -1px 0 0 rgba(110,150,215,.10);
            --shadow-soft: 0 18px 48px rgba(30, 64, 122, .16), inset 0 1.5px 0 rgba(255,255,255,.95), inset 0 -1px 1px rgba(110,150,215,.16), inset 1px 0 0 rgba(255,255,255,.22);
            --shadow-focus: 0 0 0 5px rgba(0,122,255,.16), 0 14px 32px rgba(0,122,255,.18);

            /* Liquid Glass 光學：以 SVG feDisplacementMap 折射背景，取代單純毛玻璃模糊 */
            --liquid-distortion: url(#liquid-distortion);
            --blur-clear: var(--liquid-distortion) blur(20px) saturate(2.2) brightness(1.08) contrast(1.03);
            --blur-clear-webkit: blur(24px) saturate(2.2) brightness(1.08) contrast(1.03);
            --blur-panel: var(--liquid-distortion) blur(15px) saturate(1.9) brightness(1.05);
            --blur-panel-webkit: blur(18px) saturate(1.9) brightness(1.05);
            --blur-field: var(--liquid-distortion) blur(10px) saturate(1.6);
            --blur-field-webkit: blur(13px) saturate(1.6);

            --radius-sm: 16px;
            --radius-md: 24px;
            --radius-lg: 34px;
            --radius-xl: 44px;
            --radius-pill: 999px;

            --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial,
                "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            --transition-fast: 0.2s cubic-bezier(.2,.8,.2,1);
            --transition-smooth: 0.42s cubic-bezier(.2,.8,.2,1);
        }

        *, *::before, *::after { box-sizing: border-box; }
        html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body {
            font-family: var(--font-stack);
            margin: 0;
            padding: 28px 20px 150px;
            color: var(--text-primary);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
            background:
                radial-gradient(circle at 16% 8%, rgba(0,122,255,.20), transparent 34%),
                radial-gradient(circle at 78% 12%, rgba(116, 88, 255, .16), transparent 31%),
                radial-gradient(circle at 48% 86%, rgba(52,199,184,.18), transparent 36%),
                linear-gradient(160deg, #f8fbff 0%, #eef6ff 42%, #f7fbfb 100%);
            overflow-x: hidden;
        }
        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: -22%;
            pointer-events: none;
            z-index: -2;
            filter: blur(38px);
            opacity: .78;
        }
        body::before {
            background:
                radial-gradient(circle at 26% 38%, rgba(0,122,255,.24), transparent 28%),
                radial-gradient(circle at 76% 62%, rgba(0,220,190,.17), transparent 31%);
            animation: liquidDrift 16s ease-in-out infinite alternate;
        }
        body::after {
            z-index: -1;
            background:
                radial-gradient(circle at 64% 22%, rgba(255,255,255,.76), transparent 22%),
                radial-gradient(circle at 22% 78%, rgba(175,210,255,.20), transparent 26%);
            animation: liquidDrift2 22s ease-in-out infinite alternate;
        }
        @keyframes liquidDrift {
            from { transform: translate3d(-1.4%, -1%, 0) scale(1); }
            to   { transform: translate3d(1.6%, 1.1%, 0) scale(1.045); }
        }
        @keyframes liquidDrift2 {
            from { transform: translate3d(1%, -1.2%, 0) scale(1.03); }
            to   { transform: translate3d(-1.1%, 1.3%, 0) scale(1); }
        }

        .form-container {
            width: min(1180px, calc(100vw - 40px));
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .glass-panel,
        .header,
        .section-card,
        .parts-container,
        .sign-box,
        .toolbar,
        .meta-row,
        .meta-box {
            position: relative;
            isolation: isolate;
            border: 1px solid var(--stroke-glass);
            border-top-color: var(--stroke-strong);
            box-shadow: var(--shadow-soft);
            backdrop-filter: var(--blur-panel);
            -webkit-backdrop-filter: var(--blur-panel-webkit);
            background: linear-gradient(135deg, rgba(255,255,255,.26), rgba(255,255,255,.07));
            transition: box-shadow var(--transition-smooth), background var(--transition-smooth), transform var(--transition-fast);
        }
        .glass-panel::before,
        .header::before,
        .section-card::before,
        .parts-container::before,
        .sign-box::before,
        .toolbar::before,
        .meta-row::before,
        .meta-box::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            z-index: -1;
            mix-blend-mode: screen;
            opacity: .9;
            background:
                radial-gradient(circle at var(--mx, 22%) var(--my, 8%), rgba(255,255,255,.70), transparent 40%),
                linear-gradient(135deg, rgba(255,255,255,.56), transparent 38%),
                radial-gradient(circle at 90% 100%, rgba(160,200,255,.20), transparent 34%);
            transition: background .5s cubic-bezier(.2,.8,.2,1);
        }
        /* 液態玻璃邊緣的細膩鏡面反光：滑鼠／觸控移動時高光跟隨移動 */
        .glass-panel:hover, .header:hover, .section-card:hover, .parts-container:hover, .sign-box:hover, .toolbar:hover {
            box-shadow: var(--shadow-soft), 0 0 0 1px rgba(255,255,255,.10);
        }

        .header {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(320px, 380px);
            gap: 22px;
            align-items: stretch;
            padding: clamp(26px, 4vw, 46px);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-float);
            backdrop-filter: var(--blur-clear);
            -webkit-backdrop-filter: var(--blur-clear-webkit);
        }
        .company-block { display: flex; flex-direction: column; justify-content: center; gap: 12px; }
        .eyebrow {
            display: inline-flex;
            width: fit-content;
            align-items: center;
            gap: 8px;
            padding: 8px 13px;
            border-radius: var(--radius-pill);
            color: rgba(0, 91, 190, .88);
            background: rgba(255,255,255,.34);
            border: 1px solid rgba(255,255,255,.56);
            font-size: 12px;
            font-weight: 850;
            letter-spacing: 2.8px;
            text-transform: uppercase;
        }
        .company-block h1 {
            margin: 0;
            font-size: clamp(34px, 5.2vw, 64px);
            font-weight: 900;
            line-height: 1.02;
            letter-spacing: -1.8px;
            color: var(--text-primary);
            text-wrap: balance;
        }
        .company-block h1 span {
            background: linear-gradient(135deg, #007AFF 0%, #0057D9 52%, #34C7B8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .en-title {
            margin: 0;
            color: var(--text-secondary);
            font-size: clamp(15px, 2vw, 19px);
            font-weight: 700;
            letter-spacing: .12em;
        }
        .brand-copy {
            margin: 0;
            max-width: 620px;
            color: rgba(31,41,55,.66);
            font-size: clamp(16px, 2vw, 19px);
            line-height: 1.65;
            font-weight: 600;
        }
        .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
        .start-pill,
        .ghost-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0 18px;
            border-radius: var(--radius-pill);
            text-decoration: none;
            font-size: 15px;
            font-weight: 850;
            letter-spacing: .02em;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast), filter var(--transition-fast);
        }
        .start-pill { position: relative; overflow: hidden; color: #fff; background: var(--primary-grad); box-shadow: 0 14px 28px rgba(0,122,255,.28), inset 0 1.5px 0 rgba(255,255,255,.55), inset 0 -10px 16px rgba(0,40,110,.18); }
        .start-pill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.42) 0%, transparent 46%); mix-blend-mode: screen; pointer-events: none; }
        .ghost-pill { position: relative; isolation: isolate; color: rgba(0, 91, 190, .90); background: linear-gradient(135deg, rgba(255,255,255,.30), rgba(255,255,255,.10)); border: 1px solid var(--stroke-glass); border-top-color: var(--stroke-strong); backdrop-filter: var(--blur-field); -webkit-backdrop-filter: var(--blur-field-webkit); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.85); }
        .start-pill:active, .ghost-pill:active { transform: scale(.98); }

        .meta-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            align-content: center;
            padding: 18px;
            border-radius: 32px;
        }
        .meta-box {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            align-items: center;
            gap: 12px;
            padding: 13px 16px;
            border-radius: 23px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 850;
            white-space: nowrap;
        }
        .meta-box input[type="text"],
        .meta-box input[type="date"] {
            width: 100%;
            min-width: 0;
            text-align: right;
            font-size: 15px;
            font-weight: 850;
            color: #0878F9 !important;
            -webkit-text-fill-color: #0878F9;
            caret-color: #0878F9;
            background: transparent !important;
            border: none !important;
            padding: 0 !important;
            box-shadow: none !important;
            height: auto !important;
            font-variant-numeric: tabular-nums;
        }

        .workspace {
            display: grid;
            grid-template-columns: minmax(0, 1.08fr) minmax(330px, .92fr);
            gap: 22px;
            align-items: start;
        }
        .work-column,
        .summary-column { display: grid; gap: 18px; }
        .summary-column { position: sticky; top: 22px; }
        .section-card,
        .parts-container,
        .sign-box {
            border-radius: var(--radius-lg);
            padding: clamp(18px, 2.5vw, 28px);
        }
        .section-card.issue-card { background: linear-gradient(135deg, rgba(255,240,242,.14), rgba(255,255,255,.06)); border-color: rgba(255,255,255,.62); }
        .section-card:focus-within,
        .parts-container:focus-within,
        .sign-box:focus-within { border-color: rgba(0,122,255,.46); box-shadow: var(--shadow-focus), inset 0 1px 0 rgba(255,255,255,.82); }
        .card-title { margin: 0 0 15px; display: flex; align-items: center; gap: 11px; color: var(--text-secondary); font-size: 13px; font-weight: 900; letter-spacing: 1.35px; text-transform: uppercase; }
        .card-title::before { content: ""; width: 7px; height: 24px; border-radius: 999px; background: linear-gradient(180deg, var(--primary-blue), var(--accent-cyan)); box-shadow: 0 8px 18px rgba(0,122,255,.28); flex-shrink: 0; }
        .section-card.issue-card .card-title::before { background: linear-gradient(180deg, #ff6b6b, #ff3b30); }

        input[type="text"], input[type="number"], input[type="date"], input[type="time"], textarea {
            width: 100%; border: 1px solid var(--stroke-field); border-top-color: rgba(255,255,255,.92);
            background: linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,.15)); padding: 15px 16px; border-radius: 18px; font-size: 17px; font-family: var(--font-stack); color: var(--text-primary);
            transition: transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast), background var(--transition-fast);
            line-height: 1.5; -webkit-appearance: none; appearance: none; box-shadow: inset 0 1.5px 0 rgba(255,255,255,.85), inset 0 -1px 0 rgba(0,0,0,.035); backdrop-filter: var(--blur-field); -webkit-backdrop-filter: var(--blur-field-webkit);
        }
        input::placeholder, textarea::placeholder { color: var(--text-placeholder); font-size: 16px; }
        input:hover, textarea:hover { border-color: rgba(0,122,255,.35); background: rgba(255,255,255,.50); }
        input:focus, textarea:focus { outline: none; border-color: rgba(0,122,255,.62); background: var(--glass-field-focus); box-shadow: var(--shadow-focus), inset 0 1px 0 rgba(255,255,255,.82); transform: translateY(-1px); }
        input[readonly] { background: var(--glass-readonly); border-color: rgba(255,255,255,.62); color: rgba(31,41,55,.74); cursor: default; font-weight: 850; }
        textarea { min-height: 112px; resize: vertical; line-height: 1.65; }
        .client-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 18px; }
        .input-group { display: flex; flex-direction: column; gap: 7px; }
        .input-group label { font-size: 13px; color: var(--text-label); font-weight: 850; letter-spacing: .35px; }
        .desc-table { width: 100%; border-collapse: separate; border-spacing: 0 12px; }
        .desc-table td.label { width: 92px; font-weight: 850; color: var(--text-label); vertical-align: top; padding-top: 16px; text-align: right; padding-right: 16px; font-size: 16px; white-space: nowrap; }

        .parts-container { overflow: hidden; padding: 14px; }
        .parts-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 24px; }
        .parts-table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 620px; table-layout: auto; }
        .parts-table th { background: rgba(255,255,255,.42); color: rgba(31,41,55,.64); padding: 13px 8px; font-size: 13px; font-weight: 900; text-align: center; letter-spacing: .5px; border-bottom: 1px solid rgba(255,255,255,.58); }
        .parts-table th:first-child { border-radius: 18px 0 0 18px; } .parts-table th:last-child { border-radius: 0 18px 18px 0; }
        .parts-table td { padding: 8px 6px; vertical-align: middle; }
        .parts-table input { text-align: center; background: rgba(255,255,255,.42); border: 1px solid rgba(255,255,255,.56); border-radius: 14px; padding: 13px 8px; font-size: 16px; width: 100%; min-width: 50px; box-shadow: inset 0 1px 0 rgba(255,255,255,.70); }
        .parts-table td:first-child input { text-align: left; }
        .parts-table input:focus { border-color: rgba(0,122,255,.60); background: rgba(255,255,255,.62); box-shadow: var(--shadow-focus); }
        .parts-actions { display: flex; justify-content: flex-start; padding: 12px 4px 4px; }
        .parts-add-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(135deg, rgba(255,255,255,.30), rgba(255,255,255,.10)); color: rgba(0,91,190,.90); border: 1px solid var(--stroke-glass); border-top-color: var(--stroke-strong); backdrop-filter: var(--blur-field); -webkit-backdrop-filter: var(--blur-field-webkit); padding: 13px 18px; border-radius: var(--radius-pill); font-size: 15px; font-weight: 900; cursor: pointer; transition: transform var(--transition-fast), box-shadow var(--transition-fast), background var(--transition-fast); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.82), 0 10px 24px rgba(39,69,121,.10); }
        .parts-add-btn:hover { transform: translateY(-1px); background: linear-gradient(135deg, rgba(255,255,255,.42), rgba(255,255,255,.18)); }
        .btn-del { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; color: #e33b38; cursor: pointer; font-weight: 900; font-size: 21px; background: rgba(255,255,255,.36); backdrop-filter: var(--blur-field); -webkit-backdrop-filter: var(--blur-field-webkit); border: 1px solid rgba(255,120,120,.36); box-shadow: inset 0 1px 0 rgba(255,255,255,.75); transition: transform var(--transition-fast), background var(--transition-fast), border-color var(--transition-fast); margin: 0 auto; }
        .btn-del:hover { background: rgba(255,235,235,.70); border-color: rgba(255,59,48,.52); transform: scale(1.06); }
        .total-area { margin-top: 14px; padding: 18px; display: grid; grid-template-columns: 1fr minmax(160px, 220px); align-items: center; gap: 14px; border-radius: 28px; background: linear-gradient(135deg, rgba(0,122,255,.15), rgba(255,255,255,.28)); border: 1px solid rgba(255,255,255,.62); box-shadow: inset 0 1px 0 rgba(255,255,255,.80); }
        .total-area span { color: rgba(31,41,55,.72); font-weight: 900; font-size: 17px; }
        #grandTotal { font-size: clamp(26px, 4vw, 36px); font-weight: 950; color: var(--primary-blue); text-align: right; background: transparent; border: none; box-shadow: none; padding: 0; min-height: auto; font-variant-numeric: tabular-nums; }

        .signature-area { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .sign-box { min-width: 0; padding: 20px; border-radius: 30px; }
        .sign-title { margin-bottom: 14px; display: flex; align-items: center; gap: 8px; color: rgba(31,41,55,.72); font-size: 14px; font-weight: 900; letter-spacing: .6px; }
        .client-sign-name { margin-bottom: 14px; }
        .sign-line { height: 76px; border-radius: 24px; background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.06)); border: 1px solid rgba(255,255,255,.48); backdrop-filter: var(--blur-field); -webkit-backdrop-filter: var(--blur-field-webkit); position: relative; overflow: hidden; }
        .sign-line::after { content: ""; position: absolute; left: 20px; right: 20px; bottom: 20px; height: 1px; background: linear-gradient(90deg, transparent, rgba(0,122,255,.56), transparent); }
        .engineer-name { position: absolute; right: 24px; bottom: 28px; font-size: 20px; font-weight: 900; color: rgba(17,24,39,.84); }

        .toolbar { position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 9999; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px; border-radius: var(--radius-pill); box-shadow: var(--shadow-float); max-width: calc(100vw - 24px); }
        .toolbar-label { display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; min-height: 48px; color: rgba(31,41,55,.64); font-size: 13px; font-weight: 900; white-space: nowrap; }
        .btn-float { position: relative; overflow: hidden; isolation: isolate; min-height: 58px; border: none; border-radius: var(--radius-pill); padding: 0 22px; color: #fff; font-size: 17px; font-weight: 900; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 9px; letter-spacing: .02em; transition: transform var(--transition-fast), filter var(--transition-fast), box-shadow var(--transition-fast); box-shadow: 0 10px 24px rgba(0,122,255,.28), inset 0 1.5px 0 rgba(255,255,255,.55), inset 0 -8px 14px rgba(0,20,60,.16); }
        .btn-float::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.40) 0%, transparent 50%); mix-blend-mode: screen; pointer-events: none; }
        .btn-float.btn-green { background: linear-gradient(135deg, #34C759, #24A844); }
        .btn-float.btn-word { background: linear-gradient(135deg, #6575D4, #394AB5); }
        .btn-float:hover { transform: translateY(-2px); filter: brightness(1.04); }
        .btn-float:active { transform: scale(.98); }
        .output-icon { display: inline-grid; width: 22px; height: 22px; place-items: center; font-size: 18px; line-height: 1; }

        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .header, .section-card, .parts-container, .sign-box, .toolbar, input, textarea { background: rgba(255,255,255,.86) !important; } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; } }
        @media (max-width: 920px) { body { padding: 18px 14px 150px; } .form-container { width: min(100%, 780px); } .header { grid-template-columns: 1fr; padding: 28px; } .meta-row { grid-template-columns: 1fr 1fr; } .workspace { grid-template-columns: 1fr; } .summary-column { position: static; } }
        @media (max-width: 640px) { body { padding: 12px 8px 170px; } .form-container { width: 100%; gap: 14px; } .header, .section-card, .parts-container, .sign-box { border-radius: 28px; } .header { padding: 22px; } .company-block h1 { font-size: 38px; letter-spacing: -1px; } .brand-copy { font-size: 15px; } .hero-actions { display: none; } .meta-row, .client-grid, .signature-area { grid-template-columns: 1fr; } .desc-table, .desc-table tbody, .desc-table tr, .desc-table td { display: block; width: 100%; } .desc-table { border-spacing: 0; } .desc-table tr { margin-bottom: 14px; } .desc-table td.label { width: 100%; text-align: left; padding: 0 0 7px; } .parts-table { min-width: 520px; } .total-area { grid-template-columns: 1fr; } #grandTotal { text-align: left; } .toolbar { left: 10px; right: 10px; transform: none; width: auto; justify-content: stretch; gap: 8px; padding: 9px; } .toolbar-label { display: none; } .btn-float { flex: 1 1 0; min-width: 0; min-height: 56px; padding: 0 12px; font-size: 15px; } }
        @media (max-width: 390px) { .btn-float { font-size: 14px; gap: 6px; } .output-icon { width: 18px; height: 18px; font-size: 15px; } }

        (function(){
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const GLASS_SELECTOR = '.header, .section-card, .parts-container, .sign-box, .toolbar, .meta-row, .meta-box';
            let ticking = false, lastEl = null, lastX = 0, lastY = 0;
            function applyHighlight(el, clientX, clientY){
                const r = el.getBoundingClientRect();
                const x = ((clientX - r.left) / r.width) * 100;
                const y = ((clientY - r.top) / r.height) * 100;
                el.style.setProperty('--mx', x.toFixed(1) + '%');
                el.style.setProperty('--my', y.toFixed(1) + '%');
            }
            function onMove(e){
                const point = e.touches ? e.touches[0] : e;
                const el = point.target && point.target.closest ? point.target.closest(GLASS_SELECTOR) : document.elementFromPoint(point.clientX, point.clientY)?.closest(GLASS_SELECTOR);
                if(!el) return;
                lastEl = el; lastX = point.clientX; lastY = point.clientY;
                if(!ticking){
                    ticking = true;
                    requestAnimationFrame(() => { if(lastEl) applyHighlight(lastEl, lastX, lastY); ticking = false; });
                }
            }
            document.addEventListener('pointermove', onMove, { passive: true });
        })();
    </script>
</body>
