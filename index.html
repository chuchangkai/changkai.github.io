<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="utf-8"/>
<title>三聯式發票套印系統</title>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<style>
        /* ==========================================
            全域變數 & 基礎重置
            ========================================== */
        :root {
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "微軟正黑體", sans-serif;
            --print-font: "Times New Roman", "DFKai-SB", "BiauKai", "標楷體", serif;
            --primary: #0056b3;
            --primary-light: #007AFF;
            --green: #28a745;
            --green-dark: #1e7e34;
            --red: #d63031;
            --text: #1a1a1f;
            --muted: #5a5a64;
            --border: #d5d9e0;
            --bg: #f4f5f8;
            --card-bg: #ffffff;
            --card-shadow: 0 4px 18px rgba(0, 0, 0, 0.07), 0 1px 3px rgba(0, 0, 0, 0.05);
            --input-bg: #fafbfc;
            --input-border: #d0d4db;
            --input-focus-border: #007AFF;
            --input-focus-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --transition: 0.2s ease;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: var(--font-stack);
            margin: 0;
            padding: 24px 16px 140px;
            color: var(--text);
            background: var(--bg);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* ==========================================
            操作面板容器
            ========================================== */
        .control-panel {
            width: 100%;
            max-width: 920px;
            margin: 0 auto 28px;
            padding: clamp(20px, 3vw, 36px);
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--card-shadow);
        }

        /* ==========================================
            頁首標題區
            ========================================== */
        .invoice-header {
            text-align: center;
            padding-bottom: 18px;
            margin-bottom: 8px;
            border-bottom: 2px solid #eef0f5;
        }
        .invoice-header h1 {
            margin: 0;
            font-size: clamp(24px, 3.5vw, 34px);
            font-weight: 800;
            letter-spacing: 2px;
            color: #1a1a2e;
        }
        .invoice-header .sub {
            margin-top: 2px;
            color: #888;
            font-weight: 700;
            letter-spacing: 3px;
            font-size: 12px;
            text-transform: uppercase;
        }
        .version-badge {
            display: inline-flex;
            margin-top: 10px;
            padding: 5px 14px;
            border-radius: 999px;
            background: #f0f3f8;
            border: 1px solid #e0e4ec;
            font-size: 12px;
            color: #5a6070;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* ==========================================
            區塊卡片
            ========================================== */
        .section-card {
            margin-top: 16px;
            padding: clamp(14px, 2vw, 22px);
            background: #fafbfd;
            border: 1px solid #eaecf2;
            border-radius: var(--radius-md);
            transition: var(--transition);
        }
        .section-card:focus-within {
            border-color: #b8d0f0;
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.06);
        }
        .card-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 14px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .card-title::before {
            content: "";
            width: 4px;
            height: 18px;
            border-radius: 3px;
            background: var(--primary-light);
            flex-shrink: 0;
        }

        /* ==========================================
            表單網格 & 輸入群組
            ========================================== */
        .field-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 16px 36px;
            align-items: end;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 0;
        }
        .input-group.full {
            grid-column: 1 / -1;
        }
        .input-group label,
        .field-label {
            font-size: 13px;
            font-weight: 700;
            color: #4a4a56;
            letter-spacing: 0.3px;
        }

        /* ==========================================
            輸入框 / 下拉選單基礎樣式
            ========================================== */
        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            min-width: 0;
            border: 1.5px solid var(--input-border);
            background: var(--input-bg);
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            font-family: var(--font-stack);
            font-size: 15px;
            color: var(--text);
            outline: none;
            transition: var(--transition);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.03);
            height: 48px;
        }
        input:hover,
        select:hover {
            border-color: #b0b8c5;
            background: #fff;
        }
        input:focus,
        select:focus {
            border-color: var(--input-focus-border);
            background: #fff;
            box-shadow: var(--input-focus-shadow);
        }
        input::placeholder {
            color: #9aa0ab;
        }
        input:disabled {
            background: #eef0f5;
            color: #7a7d85;
            cursor: not-allowed;
            border-color: #dde0e6;
        }

        /* ==========================================
            日期欄位特殊樣式
            ========================================== */
        .date-fields {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto;
            gap: 10px;
            align-items: center;
            width: 100%;
        }
        .date-fields input[type="text"] {
            text-align: center;
            font-weight: 800;
            color: var(--primary-light);
            height: 48px;
            padding: 12px 8px;
        }
        .date-fields span {
            font-size: 18px;
            color: #444;
            font-weight: 700;
            user-select: none;
        }

        /* ==========================================
            買受人行
            ========================================== */
        .client-line {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 10px;
            align-items: end;
        }
        .client-line input {
            height: 48px;
        }
        .client-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        /* ==========================================
            按鈕基礎
            ========================================== */
        button {
            font-family: var(--font-stack);
            cursor: pointer;
            border: none;
            font-weight: 700;
            transition: var(--transition);
            letter-spacing: 0.3px;
        }
        button:active {
            transform: scale(0.97);
        }

        .mini-btn {
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            color: #fff;
            white-space: nowrap;
            font-size: 13px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .mini-btn:hover {
            filter: brightness(1.06);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
        }
        .mini-btn.save {
            background: #17a2b8;
        }
        .mini-btn.save:hover {
            background: #138496;
        }
        .mini-btn.delete {
            background: #dc3545;
        }
        .mini-btn.delete:hover {
            background: #c82333;
        }
        .mini-btn.export {
            background: #6f42c1;
        }
        .mini-btn.export:hover {
            background: #5e35b0;
        }
        .mini-btn.import {
            background: #e83e8c;
        }
        .mini-btn.import:hover {
            background: #d6336c;
        }

        /* ==========================================
            計價方式 Radio 樣式
            ========================================== */
        .tax-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .tax-choice {
            position: relative;
        }
        .tax-choice input[type="radio"] {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
        .tax-choice label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            border: 2px solid #dde1e8;
            border-radius: 12px;
            background: #fafbfd;
            cursor: pointer;
            font-size: 14px;
            color: #555;
            font-weight: 700;
            transition: var(--transition);
            user-select: none;
            width: 100%;
        }
        .tax-choice label::before {
            content: "";
            width: 16px;
            height: 16px;
            border: 2px solid #bcc3cf;
            border-radius: 50%;
            box-shadow: inset 0 0 0 3px #fff;
            background: #fff;
            flex-shrink: 0;
            transition: var(--transition);
        }
        .tax-choice input:checked+label {
            border-color: #007AFF;
            background: #f0f7ff;
            color: #0056b3;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.1);
        }
        .tax-choice input:checked+label::before {
            border-color: #007AFF;
            background: #007AFF;
        }

        /* ==========================================
            商品明細表頭
            ========================================== */
        .items-head {
            display: grid;
            grid-template-columns: minmax(180px, 3fr) 70px minmax(75px, 1fr) minmax(70px, 0.8fr) minmax(110px, 1.2fr);
            gap: 8px;
            padding: 0 6px 8px;
            color: #6b7280;
            font-size: 12px;
            font-weight: 800;
            text-align: center;
            letter-spacing: 0.4px;
        }
        .items-head span:first-child {
            text-align: left;
            padding-left: 10px;
        }

        /* ==========================================
            商品明細行 (Grid 佈局)
            ========================================== */
        .item-row {
            display: grid;
            grid-template-columns: minmax(180px, 3fr) 70px minmax(75px, 1fr) minmax(70px, 0.8fr) minmax(110px, 1.2fr);
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }
        .item-row input {
            margin: 0;
            padding: 11px 10px;
            text-align: center;
            height: 44px;
            font-size: 14px;
        }
        .item-row .item-name {
            text-align: left;
        }
        .item-row label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 8px 4px;
            border-radius: 8px;
            background: #fff8e6;
            border: 1px solid #e8d59c;
            color: #7a6115;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            height: 44px;
            margin: 0;
            width: auto;
            transition: var(--transition);
        }
        .item-row label:hover {
            background: #fff3d0;
            border-color: #d4b860;
        }
        .item-row label input[type="checkbox"] {
            width: auto;
            height: auto;
            margin: 0;
            cursor: pointer;
            transform: scale(1.1);
        }
        .item-row input:disabled {
            background: #eef0f5;
            color: #8a8d94;
            border-color: #dde0e6;
        }

        /* ==========================================
            輔助文字
            ========================================== */
        .helper-note {
            margin-top: 8px;
            color: #888;
            font-size: 12px;
            line-height: 1.5;
        }

        /* ==========================================
            浮動工具列 (Action Bar)
            ========================================== */
        .action-bar {
            position: fixed;
            z-index: 9999;
            right: 24px;
            bottom: max(24px, env(safe-area-inset-bottom));
            display: flex;
            flex-direction: row;
            gap: 12px;
            padding: 10px 16px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px) saturate(1.6);
            -webkit-backdrop-filter: blur(16px) saturate(1.6);
            border: 1px solid rgba(200, 210, 225, 0.7);
            box-shadow: 0 10px 32px rgba(40, 55, 80, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }
        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 160px;
            height: 52px;
            padding: 12px 24px;
            border-radius: 999px;
            font-size: 15px;
            font-weight: 800;
            color: #fff;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(30, 60, 120, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            transition: var(--transition);
            letter-spacing: 0.5px;
        }
        .action-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.04);
            box-shadow: 0 10px 26px rgba(30, 60, 120, 0.26), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
        .action-btn:active {
            transform: scale(0.97);
        }
        .preview-btn {
            background: linear-gradient(135deg, #5b6cc4 0%, #3d4fb0 100%);
        }
        .print-btn {
            background: linear-gradient(135deg, #36ca5a 0%, #1fa83a 100%);
        }

        /* ==========================================
            列印預覽容器
            ========================================== */
        .preview-title {
            display: block;
            max-width: 1100px;
            margin: 0 auto 8px;
            color: #6b7280;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .preview-wrap {
            display: block;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 14px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(200, 210, 225, 0.6);
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            overflow: auto;
        }
        .preview-wrap #print-area {
            margin: 0 auto;
            box-shadow: 0 6px 22px rgba(20, 35, 60, 0.12);
            border-radius: 4px;
        }
        .preview-highlight {
            animation: previewPulse 1.25s ease;
        }
        @keyframes previewPulse {
            35% {
                box-shadow: 0 0 0 5px rgba(0, 122, 255, 0.18), 0 10px 30px rgba(0, 122, 255, 0.16);
            }
        }

        /* ==========================================
            A4 橫式列印範圍 & 發票定位 (核心 - 不可更動)
            ========================================== */
        #print-area {
            position: relative;
            width: 297mm;
            height: 209mm;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        #invoice-box {
            position: relative;
            width: 190mm;
            height: 105mm;
            border: none;
        }
        .print-text {
            position: absolute;
            font-family: var(--print-font);
            font-size: 11pt;
            letter-spacing: 1px;
            white-space: nowrap;
            height: 5.5mm;
            display: flex;
            align-items: center;
        }
        .num-align-right {

            justify-content: flex-end;
            width: 25mm;
        }
        #p-taxid {
            letter-spacing: 4mm;

        /* ==========================================
            列印媒體查詢
            ========================================== */

            html,
            body {
                margin: 0 !important;
                padding: 0 !important;
                background: none !important;
                overflow: hidden !important;
            }
            .control-panel,
            .action-bar,
            .preview-title {
                display: none !important;
            }
            .preview-wrap {
                display: block !important;
                position: static !important;
                width: auto !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important;
                background: none !important;
                border: 0 !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                overflow: visible !important;
            }
            #print-area {
                box-shadow: none !important;
                margin: 0 !important;
                page-break-after: avoid !important;
            }
            @page {
                margin: 0;
                size: A4 landscape;
            }
        }

        /* ==========================================

            ========================================== */

            body {
                padding: 12px 8px 130px;
            }
            .control-panel {

                border-radius: var(--radius-md);
            }

                gap: 12px;

            .input-group.full {

            }

   Liquid Glass skin + template tool. Print coordinates unchanged.
   ========================================================= */
@media screen {
    :root {
        --primary: #007AFF;
        --primary-light: #007AFF;
        --green: #34C759;
        --green-dark: #24aa45;
        --text: #1a1a1f;
        --muted: #5f6270;
        --border: rgba(255,255,255,.60);
        --bg: radial-gradient(ellipse at 18% 0%, rgba(224,195,252,.92) 0%, transparent 46%),

<script>
        // ==========================================
        // 【客戶資料庫模組】
        // ==========================================
        let clientDB = JSON.parse(localStorage.getItem('feather_invoice_clients')) || [];

        function renderClientList() {
            const select = document.getElementById('client-select');
            select.innerHTML = '<option value="">-- 手動輸入 或 從清單快速帶入 --</option>';
            clientDB.forEach((client, index) => {
                let displayTxt = client.taxid ? `${client.name} (${client.taxid})` : client.name;
                select.innerHTML += `<option value="${index}">${displayTxt}</option>`;
            });
        }

        function saveClient() {
            const name = document.getElementById('in-buyer').value.trim();
            const taxid = document.getElementById('in-taxid').value.trim();
            if (!name) { alert('請至少輸入「買受人」名稱！'); return; }

            const existsIndex = clientDB.findIndex(c => c.name === name);
            if (existsIndex === -1) {
                clientDB.push({ name: name, taxid: taxid });
                localStorage.setItem('feather_invoice_clients', JSON.stringify(clientDB));
                renderClientList();
                document.getElementById('client-select').value = clientDB.length - 1;
                alert('✅ 客戶資料已成功記憶！');
            } else {
                clientDB[existsIndex].taxid = taxid;
                localStorage.setItem('feather_invoice_clients', JSON.stringify(clientDB));
                renderClientList();
                document.getElementById('client-select').value = existsIndex;
                alert('ℹ️ 客戶資料已更新！');
            }
        }

        function loadClient() {
            const select = document.getElementById('client-select');
            const index = select.value;
            if (index !== "") {
                document.getElementById('in-buyer').value = clientDB[index].name;
                document.getElementById('in-taxid').value = clientDB[index].taxid;
            } else {
                document.getElementById('in-buyer').value = '';
                document.getElementById('in-taxid').value = '';
            }
            calculate();
        }

        function deleteClient() {
            const select = document.getElementById('client-select');
            const index = select.value;
            if (index !== "") {
                if (confirm(`確定要將「${clientDB[index].name}」刪除嗎？`)) {
                    clientDB.splice(index, 1);
                    localStorage.setItem('feather_invoice_clients', JSON.stringify(clientDB));
                    document.getElementById('in-buyer').value = '';
                    document.getElementById('in-taxid').value = '';
                    renderClientList();
                    calculate();
                }
            } else {
                alert('⚠️ 請先選擇要刪除的客戶！');
            }
        }

        function csvEscape(value) {
            var text = String(value == null ? '' : value);
            return /[",\n\r]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
        }

        function exportClients() {
            if (clientDB.length === 0) { alert('目前沒有客戶資料可以匯出。'); return; }
            var rows = [
                ['買受人名稱', '統一編號']
            ];
            clientDB.forEach(function(c) { rows.push([c.name || '', c.taxid || '']); });
            var csv = '\uFEFF' + rows.map(function(row) { return row.map(csvEscape).join(','); }).join('\r\n');
            var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            var now = new Date();
            var stamp = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 10).replace(
                /-/g, '');
            a.href = url;
            a.download = '英泰自動控制行_客戶名單_' + stamp + '.csv';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
        }

        function importClients() {
            var fileInput = document.getElementById('client-csv-file');
            fileInput.value = '';
            fileInput.click();
        }

        function parseCsv(text) {
            var rows = [],
                row = [],
                field = '',
                quoted = false;
            for (var i = 0; i < text.length; i++) {
                var ch = text[i];
                if (quoted) {
                    if (ch === '"' && text[i + 1] === '"') { field += '"';
                        i++; } else if (ch === '"') { quoted = false; } else { field += ch; }
                } else if (ch === '"') { quoted = true; } else if (ch === ',') { row.push(field);
                    field = ''; } else if (ch === '\n') { row.push(field.replace(/\r$/, ''));
                    rows.push(row);
                    row = [];
                    field = ''; } else { field += ch; }
            }
            if (field !== '' || row.length) { row.push(field.replace(/\r$/, ''));
                rows.push(row); }
            return rows;
        }

        function handleClientCsvFile(event) {
            var file = event.target.files && event.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function() {
                try {
                    var rows = parseCsv(String(reader.result || '').replace(/^\uFEFF/, '')).filter(function(r) { return r
                            .some(function(v) { return String(v).trim(); }); });
                    if (!rows.length) throw new Error('CSV 沒有資料');
                    if ((rows[0][0] || '').indexOf('買受人') >= 0 || (rows[0][1] || '').indexOf('統一編號') >= 0) rows
                        .shift();
                    var imported = rows.map(function(r) { return { name: String(r[0] || '').trim(), taxid: String(r[1] ||
                                '').trim() }; }).filter(function(c) { return c.name; });
                    if (!imported.length) throw new Error('找不到有效的客戶名稱');
                    if (!confirm('讀取到 ' + imported.length + ' 筆資料，是否合併到目前客戶名單？')) return;
                    imported.forEach(function(item) {
                        var idx = clientDB.findIndex(function(c) { return c.name === item.name; });
                        if (idx >= 0) clientDB[idx] = item;
                        else clientDB.push(item);
                    });
                    localStorage.setItem('feather_invoice_clients', JSON.stringify(clientDB));
                    renderClientList();
                    alert('CSV 匯入完成，共處理 ' + imported.length + ' 筆客戶資料。');
                } catch (err) { alert('CSV 匯入失敗：' + err.message); }
            };
            reader.readAsText(file, 'UTF-8');
        }

        // ==========================================
        // 【操作介面商品明細動態生成】
        // ==========================================
        const itemsContainer = document.getElementById('items-container');
        for (let i = 1; i <= 5; i++) {
            itemsContainer.innerHTML += `
                <div class="item-row">
                    <input type="text" id="in-item-${i}" class="item-name" placeholder="品名 ${i}">
                    <label title="勾選後此列改為乙式計價">
                        <input type="checkbox" id="is-yishi-${i}" onchange="toggleRowYishi(${i})"> 乙式
                    </label>
                    <input type="number" id="in-qty-${i}" class="item-num" placeholder="數量" step="any" oninput="calculate()">
                    <input type="text" id="in-unit-${i}" class="item-unit" placeholder="單位" value="">
                    <input type="number" id="in-price-${i}" class="item-price" placeholder="單價" step="any" oninput="calculate()">
                </div>
            `;
        }

        // 獨立行號乙式開關邏輯
        function toggleRowYishi(i) {
            const isYishi = document.getElementById(`is-yishi-${i}`).checked;
            const qtyInput = document.getElementById(`in-qty-${i}`);
            const unitInput = document.getElementById(`in-unit-${i}`);
            const priceField = document.getElementById(`in-price-${i}`);

            if (isYishi) {
                qtyInput.value = "";
                qtyInput.placeholder = "乙";
                qtyInput.disabled = true;
                unitInput.value = "";
                unitInput.placeholder = "式";
                unitInput.disabled = true;
            } else {
                qtyInput.placeholder = "數量";
                qtyInput.disabled = false;
                unitInput.placeholder = "單位";
                unitInput.disabled = false;
            }
            priceField.value = "";
            updatePlaceholders();
            calculate();
        }

        function updatePlaceholders() {
            const isInc = document.getElementById('mode-inc').checked;

            document.getElementById('lbl-exc').innerText = "未稅計價";
            document.getElementById('lbl-inc').innerText = "含稅計價 (自動逆推)";

            for (let i = 1; i <= 5; i++) {
                const isYishiRow = document.getElementById(`is-yishi-${i}`);
                if (isYishiRow) {
                    const priceField = document.getElementById(`in-price-${i}`);
                    if (isYishiRow.checked) {
                        priceField.placeholder = isInc ? "總價(含稅)" : "總價(未稅)";
                    } else {
                        priceField.placeholder = isInc ? "單價(含稅)" : "單價(未稅)";
                    }
                }
            }
        }

        // 金額專用：帶有千分位逗號
        function formatNumberWithComma(num) {
            return Number(num).toLocaleString('en-US');
        }

        // 數量專用：維持純數字，拿掉千分位逗號
        function formatQtyWithoutComma(num) {
            return num.toString();
        }

        function fillChineseNumberSpaces(total) {
            const digitChars = ['零', '壹', '貳', '參', '肆', '伍', '陸', '柒', '捌', '玖'];
            let paddedStr = total.toString().padStart(9, ' ');
            for (let i = 0; i < 9; i++) {
                let charCode = paddedStr.charAt(8 - i);
                let targetDiv = document.getElementById(`c-${i+1}`);
                targetDiv.innerText = (charCode === ' ') ? '零' : digitChars[parseInt(charCode)];
            }
        }

        // ==========================================
        // 【動態字體自適應防超線邏輯 (Canvas 精確量測)】
        // ==========================================
        function fitElementText(elId, text) {
            const el = document.getElementById(elId);
            if (!el) return;
            el.innerText = text;

            if (!text) {
                el.style.fontSize = '11pt';
                el.style.letterSpacing = '1px';
                return;
            }

            let maxMm = 0;
            if (elId === 'p-buyer') {
                maxMm = 73;
            } else if (elId.startsWith('p-item-')) {
                maxMm = 36.5;
            } else if (elId.startsWith('p-qty-')) {
                maxMm = 12.5;
            } else if (elId.startsWith('p-price-')) {
                maxMm = 12.5;
            } else if (elId.startsWith('p-amount-') || elId === 'p-subtotal' || elId === 'p-tax' || elId === 'p-total') {
                maxMm = 25.5;
            }

            if (maxMm <= 0) return;

            const maxPx = maxMm * 3.7795;

            const canvas = fitElementText.canvas || (fitElementText.canvas = document.createElement("canvas"));
            const ctx = canvas.getContext("2d");

            ctx.font = '11pt "Times New Roman", "DFKai-SB", "BiauKai", "標楷體", serif';
            let measuredWidth = ctx.measureText(text).width + (text.length * 1);

            if (measuredWidth > maxPx) {
                ctx.font = '9.5pt "Times New Roman", "DFKai-SB", "BiauKai", "標楷體", serif';
                let w95 = ctx.measureText(text).width;

                if (w95 <= maxPx) {
                    el.style.fontSize = '9.5pt';
                    el.style.letterSpacing = '0px';
                } else {
                    ctx.font = '8.5pt "Times New Roman", "DFKai-SB", "BiauKai", "標楷體", serif';
                    let w85 = ctx.measureText(text).width;
                    if (w85 <= maxPx) {
                        el.style.fontSize = '8.5pt';
                        el.style.letterSpacing = '0px';
                    } else {
                        el.style.fontSize = '7.5pt';
                        el.style.letterSpacing = '-0.5px';
                    }
                }
            } else {
                el.style.fontSize = '11pt';
                el.style.letterSpacing = '1px';
            }
        }

        // ==========================================
        // 【核心計算與防偽畫線邏輯】
        // ==========================================
        function calculate() {
            document.getElementById('p-month').innerText = document.getElementById('in-month').value;
            document.getElementById('p-day').innerText = document.getElementById('in-day').value;
            fitElementText('p-buyer', document.getElementById('in-buyer').value);
            document.getElementById('p-taxid').innerText = document.getElementById('in-taxid').value;

            const isTaxIncluded = document.getElementById('mode-inc').checked;

            let total_exc_sum = 0;
            let total_inc_sum = 0;
            let isBlankBelowPrinted = false;

            for (let i = 1; i <= 5; i++) {
                let item = document.getElementById(`in-item-${i}`).value.trim();
                let qty = parseFloat(document.getElementById(`in-qty-${i}`).value) || 0;
                let unit = document.getElementById(`in-unit-${i}`).value.trim();
                let inputPriceFieldValue = parseFloat(document.getElementById(`in-price-${i}`).value) || 0;
                let isYishiRow = document.getElementById(`is-yishi-${i}`).checked;

                let printItem = item;
                let printQtyAndUnit = '';
                let printPrice = '';
                let printAmt = 0;

                let isEmpty = false;
                if (isYishiRow) {
                    isEmpty = (item === "" && inputPriceFieldValue === 0);
                } else {
                    isEmpty = (item === "" && qty === 0 && inputPriceFieldValue === 0);
                }

                if (!isEmpty) {
                    if (isYishiRow) {
                        printQtyAndUnit = "乙式";
                        printPrice = "";

                        if (inputPriceFieldValue > 0) {
                            if (isTaxIncluded) {
                                total_inc_sum += inputPriceFieldValue;
                                printAmt = Math.round(inputPriceFieldValue / 1.05);
                            } else {
                                printAmt = inputPriceFieldValue;
                                total_exc_sum += inputPriceFieldValue;
                            }
                        }
                    } else {
                        if (qty > 0) {
                            printQtyAndUnit = formatQtyWithoutComma(qty) + unit;
                        } else if (unit !== "") {
                            printQtyAndUnit = unit;
                        }

                        if (qty > 0 && inputPriceFieldValue > 0) {
                            if (isTaxIncluded) {
                                let rowTotalInc = Math.round(qty * inputPriceFieldValue);
                                total_inc_sum += rowTotalInc;
                                printAmt = Math.round(rowTotalInc / 1.05);
                                let calculatedPrice = +(inputPriceFieldValue / 1.05).toFixed(2);
                                printPrice = formatNumberWithComma(calculatedPrice);
                            } else {
                                printAmt = Math.round(qty * inputPriceFieldValue);
                                total_exc_sum += printAmt;
                                printPrice = formatNumberWithComma(inputPriceFieldValue);
                            }
                        }
                    }
                } else {
                    if (!isBlankBelowPrinted) {
                        let hasAnyUpperItem = false;
                        for (let j = 1; j < i; j++) {
                            let prevIsYishi = document.getElementById(`is-yishi-${j}`).checked;
                            let prevItem = document.getElementById(`in-item-${j}`).value.trim();
                            let prevPrice = parseFloat(document.getElementById(`in-price-${j}`).value) || 0;
                            let prevQty = parseFloat(document.getElementById(`in-qty-${j}`).value) || 0;

                            if (prevIsYishi) {
                                if (prevItem !== "" || prevPrice > 0) { hasAnyUpperItem = true; break; }
                            } else {
                                if (prevItem !== "" || prevQty > 0 || prevPrice > 0) { hasAnyUpperItem = true; break; }
                            }
                        }
                        if (hasAnyUpperItem) {
                            printItem = "＝＝ 以下空白 ＝＝";
                            printQtyAndUnit = "";
                            isBlankBelowPrinted = true;
                        }
                    }
                }

                fitElementText(`p-item-${i}`, printItem);
                fitElementText(`p-qty-${i}`, printQtyAndUnit);
                fitElementText(`p-price-${i}`, printPrice);
                fitElementText(`p-amount-${i}`, printAmt > 0 ? formatNumberWithComma(printAmt) : '');
            }

            let final_subtotal = 0,
                tax = 0,
                final_total = 0;

            if (isTaxIncluded) {
                final_subtotal = Math.round(total_inc_sum / 1.05);
                tax = total_inc_sum - final_subtotal;
                final_total = total_inc_sum;
            } else {
                final_subtotal = total_exc_sum;
                tax = Math.round(total_exc_sum * 0.05);
                final_total = total_exc_sum + tax;
            }

            fitElementText('p-subtotal', final_subtotal > 0 ? formatNumberWithComma(final_subtotal) : '');
            fitElementText('p-tax', tax > 0 ? formatNumberWithComma(tax) : '');
            fitElementText('p-total', final_total > 0 ? formatNumberWithComma(final_total) : '');

            if (final_total > 0) {
                fillChineseNumberSpaces(final_total);
            } else {
                for (let i = 1; i <= 9; i++) document.getElementById(`c-${i}`).innerText = '';
            }
        }

        function scrollToPrintPreview() {
            calculate();
            updatePreviewScale();
            var title = document.querySelector('.preview-title');
            var wrap = document.querySelector('.preview-wrap');
            if (title) title.scrollIntoView({ behavior: 'smooth', block: 'start' });
            if (wrap) {
                wrap.classList.remove('preview-highlight');
                void wrap.offsetWidth;
                wrap.classList.add('preview-highlight');
                setTimeout(function() { wrap.classList.remove('preview-highlight'); }, 1300);
            }
        }

        function printInvoiceOnly() {
            calculate();
            document.body.classList.remove('template-mode');
            setTimeout(function() { window.print(); }, 80);
        }


        function updatePreviewScale() {
            var wrap = document.querySelector('.preview-wrap');
            var area = document.getElementById('print-area');
            if (!wrap || !area) return;
            area.style.transform = 'scale(1)';
            var wrapStyle = window.getComputedStyle(wrap);
            var padX = parseFloat(wrapStyle.paddingLeft) + parseFloat(wrapStyle.paddingRight);
            var padY = parseFloat(wrapStyle.paddingTop) + parseFloat(wrapStyle.paddingBottom);
            var available = Math.max(320, wrap.clientWidth - padX);
            var scale = Math.min(1, available / area.offsetWidth);
            area.style.setProperty('--preview-scale', scale);
            area.style.transform = 'scale(' + scale + ')';
            wrap.style.height = Math.ceil(area.offsetHeight * scale + padY) + 'px';
        }
        function printTemplate() {
            calculate();
            document.body.classList.add('template-mode');
            setTimeout(function(){ window.print(); }, 80);
        }
        window.addEventListener('afterprint', function(){ document.body.classList.remove('template-mode'); });
        window.addEventListener('resize', function(){ setTimeout(updatePreviewScale, 80); });
        // 初始化設定
        window.onload = function() {
            const today = new Date();
            document.getElementById('in-month').value = today.getMonth() + 1;
            document.getElementById('in-day').value = today.getDate();

            renderClientList();

            document.querySelectorAll('.control-panel input').forEach(input => {
                input.addEventListener('input', calculate);
            });

            updatePlaceholders();
            calculate();
            setTimeout(updatePreviewScale, 80);
        };
    </script>
</body>
