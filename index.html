<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英泰自動控制行 - 數位維修單</title>
    <style>
        /* =========================================
           1. 設計系統與變數 (Design Tokens)
           ========================================= */
        :root {
            --primary-blue: #007AFF;
            --primary-dark: #0055b3;
            --primary-grad: linear-gradient(135deg, #007AFF 0%, #0055b3 100%);
            --accent-green: #34C759;
            --accent-red: #d63031;

            /* iOS Liquid Glass 背景 */
            --bg-body: radial-gradient(ellipse at 20% 0%, #e0c3fc 0%, transparent 50%),
                       radial-gradient(ellipse at 80% 20%, #8ec5fc 0%, transparent 50%),
                       radial-gradient(ellipse at 40% 80%, #a8edea 0%, transparent 50%),
                       radial-gradient(ellipse at 90% 90%, #fed6e3 0%, transparent 50%),
                       linear-gradient(160deg, #d4b8f0 0%, #a8d0fa 35%, #b8e6f5 70%, #d0f0e8 100%);
            --surface-card: rgba(255, 255, 255, 0.55);
            --surface-input: rgba(255, 255, 255, 0.72);
            --surface-readonly: rgba(244, 244, 247, 0.65);
            --surface-issue: rgba(255, 245, 245, 0.6);

            --text-primary: #1a1a1f;
            --text-secondary: #5c5c66;
            --text-label: #444;
            --text-placeholder: #999;

            --border-input: rgba(120, 130, 150, 0.28);
            --border-focus: #007AFF;
            --border-card: rgba(255, 255, 255, 0.5);
            --border-light: rgba(255, 255, 255, 0.35);

            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04), inset 0 1px 0 rgba(255,255,255,0.6);
            --shadow-card-hover: 0 16px 48px rgba(0, 0, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.06), inset 0 1px 0 rgba(255,255,255,0.7);
            --shadow-input-focus: 0 0 0 4px rgba(0, 122, 255, 0.15);
            --shadow-toolbar: 0 12px 40px rgba(0, 0, 0, 0.12);

            /* Liquid Glass tokens */
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-bg-strong: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.55);
            --glass-border-outer: rgba(255, 255, 255, 0.35);
            --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.65);
            --glass-blur: blur(24px) saturate(1.8);
            --glass-blur-heavy: blur(40px) saturate(2);

            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 28px;

            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC",
                "Noto Sans TC", "Microsoft JhengHei", sans-serif;

            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* =========================================
           2. 基礎重置與全域樣式
           ========================================= */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            font-family: var(--font-stack);
            margin: 0;
            padding: 24px 16px 200px;
            color: var(--text-primary);
            background: var(--bg-body);
            background-attachment: fixed;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* =========================================
           3. 主容器 — 響應式表單卡片
           ========================================= */
        .form-container {
            width: 100%;
            max-width: 860px;
            margin: 0 auto;
            padding: clamp(20px, 3.5vw, 36px) clamp(16px, 3vw, 32px);
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255,255,255,0.7);
            display: flex;
            flex-direction: column;
            gap: clamp(18px, 3vw, 28px);
            transition: all var(--transition-smooth);
        }

        @media (hover: hover) {
            .form-container:hover {
                box-shadow: var(--shadow-card-hover);
                background: var(--glass-bg-strong);
            }
        }

        /* =========================================
           4. 頁首區塊
           ========================================= */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            padding-bottom: 18px;
            border-bottom: 2px solid var(--border-light);
        }

        .company-block {
            flex: 1 1 auto;
            min-width: 200px;
        }

        .company-block h1 {
            margin: 0;
            font-size: clamp(22px, 3.5vw, 30px);
            font-weight: 800;
            background: linear-gradient(45deg, #007AFF, #00A8FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .en-title {
            font-size: 13px;
            color: #999;
            font-weight: 600;
            letter-spacing: 3px;
            margin-top: 3px;
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
            flex-shrink: 0;
        }

        .doc-badge {
            background: var(--primary-grad);
            color: #fff;
            padding: 7px 20px;
            border-radius: 22px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 3px 12px rgba(0, 122, 255, 0.28);
            white-space: nowrap;
        }

        .meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .meta-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(245, 245, 249, 0.7);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.4);
        }
        .meta-box input {
            width: 105px;
            text-align: right;
            font-weight: 700;
            background: transparent;
            border: none;
            padding: 2px 0;
            font-size: 13px;
            color: var(--text-primary);
            outline: none;
        }
        .meta-box input:focus {
            color: var(--primary-blue);
        }
        .meta-box input[type="date"] {
            width: 120px;
            font-family: var(--font-stack);
        }

        /* 公司資訊條 */
        .company-info {
            margin-top: 12px;
            font-size: 14px;
            color: #555;
            line-height: 1.7;
            font-weight: 500;
            background: rgba(249, 250, 252, 0.6);
            backdrop-filter: blur(8px);
            padding: 12px 14px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            display: flex;
            flex-wrap: wrap;
            gap: 4px 16px;
            align-items: center;
        }
        .company-info .info-line {
            display: flex;
            flex-wrap: wrap;
            gap: 2px 14px;
            align-items: center;
        }
        .info-icon {
            margin-right: 3px;
            font-size: 15px;
        }
        .info-sep {
            color: #ccc;
            margin: 0 2px;
        }

        /* =========================================
           5. 區塊卡片 (Section Cards)
           ========================================= */
        .section-card {
            background: var(--glass-bg-strong);
            backdrop-filter: blur(16px) saturate(1.5);
            -webkit-backdrop-filter: blur(16px) saturate(1.5);
            border-radius: var(--radius-md);
            padding: clamp(16px, 2.5vw, 24px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 4px 16px rgba(0,0,0,0.04), inset 0 1px 0 rgba(255,255,255,0.5);
            transition: all var(--transition-fast);
        }
        .section-card:focus-within {
            border-color: rgba(0, 122, 255, 0.35);
            box-shadow: 0 4px 20px rgba(0, 122, 255, 0.08), inset 0 1px 0 rgba(255,255,255,0.6);
        }

        .section-card.issue-card {
            background: rgba(255, 245, 245, 0.55);
            border-color: rgba(255, 180, 180, 0.35);
            border-top: 1px solid rgba(255,255,255,0.6);
        }
        .section-card.issue-card:focus-within {
            border-color: rgba(214, 48, 49, 0.3);
            box-shadow: 0 4px 20px rgba(214, 48, 49, 0.06), inset 0 1px 0 rgba(255,255,255,0.6);
        }

        .card-title {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 700;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 17px;
            background: var(--primary-blue);
            border-radius: 3px;
            flex-shrink: 0;
        }
        .section-card.issue-card .card-title {
            color: #b03030;
        }
        .section-card.issue-card .card-title::before {
            background: var(--accent-red);
        }

        /* =========================================
           6. 輸入框系統 — 清晰可見、加大
           ========================================= */
        input[type="text"],
        input[type="number"],
        input[type="date"],
        input[type="time"],
        textarea {
            width: 100%;
            border: 2px solid var(--border-input);
            background: var(--surface-input);
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            font-size: 17px;
            font-family: var(--font-stack);
            color: var(--text-primary);
            transition: all var(--transition-fast);
            box-sizing: border-box;
            line-height: 1.5;
            -webkit-appearance: none;
            appearance: none;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.04);
        }

        input::placeholder,
        textarea::placeholder {
            color: var(--text-placeholder);
            font-weight: 400;
            font-style: normal;
            font-size: 16px;
        }

        input:hover,
        textarea:hover {
            border-color: rgba(0, 122, 255, 0.35);
            background: rgba(255, 255, 255, 0.85);
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--border-focus);
            background: #fff;
            box-shadow: var(--shadow-input-focus), 0 2px 8px rgba(0, 122, 255, 0.08);
            transform: translateY(-1px);
        }

        /* readonly 輸入框 */
        input[readonly] {
            background: var(--surface-readonly);
            border-color: rgba(200, 205, 215, 0.5);
            color: #555;
            cursor: default;
            font-weight: 600;
        }
        input[readonly]:focus {
            box-shadow: none;
            border-color: rgba(200, 205, 215, 0.5);
            transform: none;
        }

        /* 總計欄位 */
        #grandTotal {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary-blue);
            background: rgba(246, 249, 255, 0.7);
            border-color: rgba(0, 122, 255, 0.25);
            text-align: right;
            letter-spacing: 0.5px;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
            line-height: 1.6;
        }

        /* =========================================
           7. 客戶資料網格
           ========================================= */
        .client-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 18px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .input-group label {
            font-size: 12.5px;
            color: var(--text-label);
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        /* =========================================
           8. 描述表格（故障檢測）
           ========================================= */
        .desc-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }
        .desc-table td.label {
            width: 85px;
            font-weight: 700;
            color: #555;
            vertical-align: top;
            padding-top: 12px;
            text-align: right;
            padding-right: 14px;
            font-size: 14px;
            white-space: nowrap;
        }
        .desc-table td {
            vertical-align: top;
        }

        /* =========================================
           9. 零件表格區域
           ========================================= */
        .parts-container {
            background: var(--glass-bg-strong);
            backdrop-filter: blur(16px) saturate(1.5);
            -webkit-backdrop-filter: blur(16px) saturate(1.5);
            border-radius: var(--radius-md);
            padding: 10px;
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 4px 16px rgba(0,0,0,0.04), inset 0 1px 0 rgba(255,255,255,0.5);
            overflow: hidden;
        }

        /* 零件區塊內的新增按鈕 */
        .parts-add-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: var(--primary-grad);
            color: #fff;
            border: none;
            padding: 12px 22px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-fast);
            box-shadow: 0 4px 14px rgba(0, 122, 255, 0.28);
            margin: 8px 4px 4px;
            letter-spacing: 0.3px;
        }
        .parts-add-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
            box-shadow: 0 7px 20px rgba(0, 122, 255, 0.35);
        }
        .parts-add-btn:active {
            transform: translateY(0);
            filter: brightness(0.96);
        }
        .parts-actions {
            display: flex;
            justify-content: flex-start;
            padding: 4px 6px 2px;
        }

        .parts-table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: var(--radius-sm);
        }
        .parts-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 560px;
            table-layout: auto;
        }
        .parts-table th {
            background: rgba(241, 243, 247, 0.7);
            color: #555;
            padding: 10px 7px;
            font-size: 12.5px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.4px;
            white-space: nowrap;
            border-bottom: 2px solid #e0e3ea;
        }
        .parts-table th:first-child {
            border-radius: 10px 0 0 0;
            padding-left: 14px;
            text-align: left;
        }
        .parts-table th:last-child {
            border-radius: 0 10px 0 0;
        }

        .parts-table td {
            padding: 6px 5px;
            vertical-align: middle;
        }
        .parts-table td:first-child {
            padding-left: 8px;
        }
        .parts-table input {
            text-align: center;
            background: rgba(255, 255, 255, 0.75);
            border: 2px solid rgba(180, 190, 210, 0.35);
            border-radius: 8px;
            padding: 12px 8px;
            font-size: 16px;
            width: 100%;
            min-width: 50px;
            transition: all var(--transition-fast);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.03);
        }
        .parts-table td:first-child input {
            text-align: left;
        }
        .parts-table input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.12), inset 0 1px 2px rgba(0,0,0,0.03);
            background: #fff;
            z-index: 1;
            position: relative;
            transform: translateY(-1px);
        }
        .parts-table input[readonly] {
            background: rgba(246, 247, 250, 0.6);
            border-color: rgba(200, 205, 215, 0.4);
            color: #555;
            font-weight: 600;
        }
        .parts-table .qty,
        .parts-table .price {
            text-align: center;
        }

        /* 刪除按鈕 */
        .btn-del {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            color: #e04040;
            cursor: pointer;
            font-weight: 700;
            font-size: 18px;
            transition: all var(--transition-fast);
            user-select: none;
            background: #fff;
            border: 1.5px solid #f5d0d0;
            line-height: 1;
            margin: 0 auto;
        }
        .btn-del:hover {
            background: #ffe8e8;
            border-color: #e04040;
            color: #c02020;
            transform: scale(1.08);
        }
        .btn-del:active {
            transform: scale(0.94);
            background: #ffd4d4;
        }

        /* 總計區域 */
        .total-area {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 14px;
            padding: 16px 10px 8px;
            border-top: 2px dashed #e8ebf1;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .total-area span {
            color: #666;
            font-weight: 700;
            font-size: 15px;
            white-space: nowrap;
        }
        .total-area input {
            width: 150px;
            text-align: right;
        }

        /* =========================================
           10. 頁尾簽名區
           ========================================= */
        .footer {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .sign-box {
            flex: 1 1 180px;
            background: rgba(250, 251, 253, 0.6);
            backdrop-filter: blur(8px);
            border: 2px solid #e5e8ef;
            border-radius: var(--radius-md);
            padding: 16px;
            position: relative;
            min-width: 140px;
        }
        .sign-title {
            font-size: 13px;
            font-weight: 700;
            color: #555;
            margin-bottom: 28px;
            border-bottom: 1px solid #e0e3ea;
            padding-bottom: 7px;
            letter-spacing: 0.5px;
        }
        .sign-line {
            border-bottom: 1.5px dashed #c5c9d4;
            height: 40px;
            margin-top: 8px;
            position: relative;
        }
        .sign-line .engineer-name {
            position: absolute;
            bottom: 5px;
            right: 18px;
            font-weight: 700;
            font-size: 17px;
            color: #333;
            letter-spacing: 1px;
        }

        /* =========================================
           11. 浮動工具列
           ========================================= */
        .toolbar {
            position: fixed;
            z-index: 9999;
            right: 20px;
            bottom: max(18px, env(safe-area-inset-bottom));
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 10px;
            max-width: min(760px, calc(100vw - 40px));
            padding: 10px 14px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.35);
            box-shadow: var(--shadow-toolbar);
            backdrop-filter: blur(24px) saturate(1.8);
            -webkit-backdrop-filter: blur(24px) saturate(1.8);
        }
        .btn-float {
            min-height: 44px;
            background: var(--primary-grad);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 24px;
            font-size: 14.5px;
            font-weight: 700;
            line-height: 1.2;
            white-space: nowrap;
            box-shadow: 0 4px 14px rgba(0, 122, 255, 0.28);
            cursor: pointer;
            transition: all var(--transition-fast);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            letter-spacing: 0.3px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .btn-float:hover {
            transform: translateY(-2px);
            filter: brightness(1.04);
            box-shadow: 0 7px 20px rgba(0, 122, 255, 0.35);
        }
        .btn-float:active {
            transform: translateY(0);
            filter: brightness(0.96);
            box-shadow: 0 2px 8px rgba(0, 122, 255, 0.25);
        }
        .btn-float:focus-visible {
            outline: 3px solid rgba(0, 122, 255, 0.3);
            outline-offset: 3px;
        }
        .btn-float.btn-green {
            background: linear-gradient(135deg, #34C759 0%, #28a745 100%);
            box-shadow: 0 4px 14px rgba(52, 199, 89, 0.3);
        }
        .btn-float.btn-green:hover {
            box-shadow: 0 7px 20px rgba(52, 199, 89, 0.38);
        }
        .btn-float.btn-word {
            background: linear-gradient(135deg, #5c6bc0 0%, #3f51b5 100%);
            box-shadow: 0 4px 14px rgba(63, 81, 181, 0.3);
        }
        .btn-float.btn-word:hover {
            box-shadow: 0 7px 20px rgba(63, 81, 181, 0.38);
        }

        /* =========================================
           12. 響應式斷點 — 平板 (768px - 1024px)
           ========================================= */
        @media (max-width: 1024px) {
            body {
                padding: 16px 12px 180px;
            }
            .form-container {
                max-width: 100%;
                border-radius: var(--radius-md);
                padding: 20px 16px;
                gap: 18px;
            }
            .header {
                gap: 12px;
            }
            .company-block h1 {
                font-size: 24px;
            }
            .client-grid {
                gap: 12px 14px;
            }
            .parts-table {
                min-width: 500px;
            }
            .parts-table th,
            .parts-table td {
                padding: 7px 4px;
                font-size: 12px;
            }
            .parts-table input {
                padding: 7px 4px;
                font-size: 13px;
            }
            .toolbar {
                right: 12px;
                bottom: max(12px, env(safe-area-inset-bottom));
                gap: 8px;
                padding: 9px 10px;
                border-radius: 16px;
            }
            .btn-float {
                padding: 9px 15px;
                font-size: 13.5px;
                min-height: 40px;
            }
        }

        /* =========================================
           13. 響應式斷點 — 手機 (< 640px)
           ========================================= */
        @media (max-width: 640px) {
            body {
                padding: 10px 8px 210px;
                background: var(--bg-body);
                background-attachment: fixed;
            }
            .form-container {
                border-radius: var(--radius-md);
                padding: 16px 12px;

        // =========================================

            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[ch]));
        const nl2br = value => esc(value).replace(/\n/g, '<br>');
        const toNumber = value => Math.max(0, Number(value) || 0);
        const moneyText = value => Math.round(value).toLocaleString('zh-TW');

        // =========================================
        // 3. 收集正式文件資料
        // =========================================

            const rows = [...document.querySelectorAll('#partsTable tbody tr')].map(tr => {
                const qty = tr.querySelector('.qty')?.value || '';
                const price = tr.querySelector('.price')?.value || '';
                const subtotalVal = tr.querySelector('.subtotal')?.value || '';
                const subtotalNum = parseFloat(String(subtotalVal).replace(/,/g, '')) || 0;
                const autoSubtotal = toNumber(qty) * toNumber(price);
                const finalSubtotal = subtotalNum > 0 ? subtotalNum : autoSubtotal;
                return {
                    item: tr.cells[0]?.querySelector('input')?.value || '',
                    spec: tr.cells[1]?.querySelector('input')?.value || '',
                    qty: qty,
                    price: price,
                    subtotal: finalSubtotal
                };
            }).filter(r => r.item || r.spec || r.qty !== '1' || toNumber(r.price) || r.subtotal > 0);
            const total = rows.reduce((sum, r) => sum + r.subtotal, 0);
            const iso = document.getElementById('dateField').value || '';
            const displayDate = /^\d{4}-\d{2}-\d{2}$/.test(iso) ?
                `<span class="latin">${iso.slice(0,4)}</span><span class="date-kai"> 年 </span><span class="latin">${iso.slice(5,7)}</span><span class="date-kai"> 月 </span><span class="latin">${iso.slice(8,10)}</span><span class="date-kai"> 日</span>` :
                esc(iso);
            return {
                orderNo: document.getElementById('orderNo').value,
                date: displayDate,
                customer: document.getElementById('customerName').value.trim(),
                machineNo: document.getElementById('machineNo').value,
                startTime: document.getElementById('startTime').value,
                endTime: document.getElementById('endTime').value,
                issue: document.getElementById('issue').value,
                cause: document.getElementById('cause').value,
                solution: document.getElementById('solution').value,
                rows,
                total

        }

            return `${d}_${customer}_正式維修單.${ext}`;

        <div class="section"><div class="section-title">壹、故障檢測與處理紀錄</div><table class="desc"><tr><td class="label">故障情形</td><td>${nl2br(d.issue)}</td></tr><tr><td class="label">故障原因</td><td>${nl2br(d.cause)}</td></tr><tr><td class="label">處理對策</td><td>${nl2br(d.solution)}</td></tr></table></div>
        <div class="section"><div class="section-title">貳、維修項目及零件明細</div><table class="parts"><colgroup><col style="width:7%"><col style="width:31%"><col style="width:20%"><col style="width:10%"><col style="width:15%"><col style="width:17%"></colgroup><thead><tr><th>項次</th><th>項目／零件名稱</th><th>規格</th><th>數量</th><th>單價</th><th>小計</th></tr></thead><tbody>${filledRows}${blankRows}</tbody><tfoot><tr class="total"><td colspan="4" class="right total-label">總計金額（新臺幣）</td><td colspan="2" class="right"><span class="total-amount">NT$ ${moneyText(d.total)}</span><span class="tax-note">（未稅價）</span></td></tr></tfoot></table></div>
        <div class="remarks"><span class="remarks-label">備註：</span>實際維修內容、零件規格及收費金額，以雙方確認結果為準；客戶簽章後，表示已確認本單所載維修內容。</div>
        <table class="sign"><colgroup><col style="width:50%"><col style="width:50%"></colgroup><tr><td><span class="sign-label">客戶簽章：</span></td><td><span class="sign-label">維修人員：</span><span class="engineer">朱文言</span></td></tr></table>
        <p class="notice">本維修單供客戶確認維修內容及留存紀錄使用。</p><div class="footer">英泰自動控制行　維修服務紀錄</div>
        </div></div></body></html>`;
        }

        // =========================================
        // 6. 驗證
        // =========================================
        function validateFormal() {
            const field = document.getElementById('customerName');
            if (!field.value.trim()) {
                alert('⚠️ 請先填寫【客戶名稱】再輸出正式文件。');
                field.focus();
                return false;
            }
            return true;
        }

        // =========================================
        // 7. 輸出正式 PDF（使用隱藏 iframe 觸發原生列印）
        // =========================================
        function exportFormalPDF() {
            if (!validateFormal()) return;

            const html = formalDocumentHtml();

            const iframe = document.createElement('iframe');
            iframe.style.position = 'fixed';
            iframe.style.right = '0';
            iframe.style.bottom = '0';
            iframe.style.width = '0';
            iframe.style.height = '0';
            iframe.style.border = '0';
            document.body.appendChild(iframe);

            const doc = iframe.contentWindow.document;
            doc.open();
            doc.write(html);
            doc.close();

            doc.title = formalFileName('pdf').replace('.pdf', '');

            iframe.contentWindow.focus();
            setTimeout(() => {
                iframe.contentWindow.print();
                setTimeout(() => iframe.remove(), 2000);
            }, 500);
        }

        // =========================================
        // 8. 輸出 Word 備用檔
        // =========================================
        function exportFormalWord() {
            if (!validateFormal()) return;
            const blob = new Blob(['\ufeff', formalDocumentHtml()], { type: 'application/msword;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = formalFileName('doc');
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1500);
        }

        // =========================================
        // 9. 零件表格 — 即時計算
        // =========================================
        function calcTotal(input) {
            const row = input.closest('tr');
            const qty = parseFloat(row.querySelector('.qty').value) || 0;
            const price = parseFloat(row.querySelector('.price').value) || 0;
            const subtotalEl = row.querySelector('.subtotal');
            
            // 當數量和單價都有值時，自動計算小計
            if (qty > 0 && price > 0) {
                const total = Math.round(qty * price);
                subtotalEl.value = total > 0 ? total.toLocaleString() : '';
            }
            updateGrandTotal();
        }

        function updateGrandTotal() {
            let sum = 0;
            document.querySelectorAll('.subtotal').forEach(el => {
                const val = parseFloat(String(el.value).replace(/,/g, '')) || 0;
                sum += val;
            });
            document.getElementById('grandTotal').value = sum > 0 ? sum.toLocaleString() : '0';
        }

        // =========================================
        // 10. 新增 / 刪除零件列
        // =========================================
        function addPartRow() {
            const tbody = document.querySelector('#partsTable tbody');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="text" placeholder="輸入項目" style="text-align:left;"></td>
                <td><input type="text" placeholder="規格"></td>
                <td><input type="number" class="qty" value="1" min="1" oninput="calcTotal(this)"></td>
                <td><input type="number" class="price" min="0" oninput="calcTotal(this)" placeholder="0"></td>
                <td><input type="text" class="subtotal" oninput="updateGrandTotal()" placeholder="0"></td>
                <td><div class="btn-del" onclick="deleteRow(this)" title="刪除此列">×</div></td>
            `;
            tbody.appendChild(tr);
            // 自動聚焦到新列的項目輸入框
            setTimeout(() => {
                const newInput = tr.querySelector('input');
                if (newInput) newInput.focus();
            }, 150);
        }

        function deleteRow(btn) {
            const tbody = document.querySelector('#partsTable tbody');
            if (tbody.rows.length > 1) {
                btn.closest('tr').remove();
                updateGrandTotal();
            } else {
                // 如果只剩一列，清空內容而非刪除
                const row = btn.closest('tr');
                row.querySelectorAll('input').forEach(inp => {
                    if (!inp.classList.contains('qty')) inp.value = '';
                    else inp.value = '1';
                });
                row.querySelector('.subtotal').value = '';
                updateGrandTotal();
            }
        }

        // =========================================
        // 11. 鍵盤快捷鍵：Enter 新增列（在最後一個 price 欄位時）
        // =========================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.target.classList.contains('price')) {
                e.preventDefault();
                addPartRow();
            }
        });
    </script>
</body>
</html>
