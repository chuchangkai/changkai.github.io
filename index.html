<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英泰自動控制行 - 數位維修單 (iOS Glass)</title>
    <style>
        /* =========================================
           1. 設計系統與變數 (iOS Liquid Glass)
           ========================================= */
        :root {
            --primary-blue: #007AFF;
            --primary-dark: #0055b3;
            --primary-grad: linear-gradient(135deg, #007AFF 0%, #0055b3 100%);
            --accent-green: #34C759;
            --accent-red: #d63031;

            --bg-body: radial-gradient(ellipse at 20% 0%, #e0c3fc 0%, transparent 50%),
                       radial-gradient(ellipse at 80% 20%, #8ec5fc 0%, transparent 50%),
                       radial-gradient(ellipse at 40% 80%, #a8edea 0%, transparent 50%),
                       radial-gradient(ellipse at 90% 90%, #fed6e3 0%, transparent 50%),
                       linear-gradient(160deg, #d4b8f0 0%, #a8d0fa 35%, #b8e6f5 70%, #d0f0e8 100%);
            --surface-card: rgba(255, 255, 255, 0.55);
            --surface-input: rgba(255, 255, 255, 0.75);
            --surface-readonly: rgba(244, 244, 247, 0.7);
            --surface-issue: rgba(255, 245, 245, 0.55);

            --text-primary: #1a1a1f;
            --text-secondary: #5c5c66;
            --text-label: #444;
            --text-placeholder: #999;

            --border-input: rgba(120, 130, 150, 0.3);
            --border-focus: #007AFF;
            --border-card: rgba(255, 255, 255, 0.5);
            --border-light: rgba(255, 255, 255, 0.35);

            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04), inset 0 1px 0 rgba(255,255,255,0.6);
            --shadow-input-focus: 0 0 0 4px rgba(0, 122, 255, 0.15);
            --shadow-toolbar: 0 12px 40px rgba(0, 0, 0, 0.12);

            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-bg-strong: rgba(255, 255, 255, 0.65);
            --glass-blur: blur(24px) saturate(1.8);

            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 26px;

            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
                "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;

            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *,
        *::before,
        *::after { box-sizing: border-box; }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            font-family: var(--font-stack);
            margin: 0;
            padding: 28px 20px 210px;
            color: var(--text-primary);
            background: var(--bg-body);
            background-attachment: fixed;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .form-container {
            width: 100%;
            max-width: 980px;
            margin: 0 auto;
            padding: clamp(24px, 3.5vw, 42px) clamp(20px, 3vw, 38px);
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-card);
            border-top: 1px solid rgba(255,255,255,0.7);
            display: flex;
            flex-direction: column;
            gap: clamp(20px, 3vw, 30px);
            transition: all var(--transition-smooth);
        }

        /* 頁首 */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-light);
        }
        .company-block { text-align: center; }
        .company-block h1 {
            margin: 0;
            font-size: clamp(26px, 4vw, 38px);
            font-weight: 800;
            background: linear-gradient(45deg, #007AFF, #00A8FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            line-height: 1.2;
        }
        .en-title {
            font-size: 15px;
            color: #999;
            font-weight: 600;
            letter-spacing: 4px;
            margin-top: 4px;
            text-transform: uppercase;
        }
/* =========================================
           修改這裡：使用 Grid 讓單號與日期「依照空間平分」
           ========================================= */
        .meta-row {
            display: grid;
            grid-template-columns: 1fr 1fr; /* ★ 核心：1fr 1fr 代表完美平分成兩等份 */
            gap: 14px;
            width: 100%;
            max-width: 460px; /* 控制最大寬度，避免在電腦大螢幕上拉得太長，可自由微調 */
            margin: 0 auto;
        }

        .meta-box {
            display: flex;
            align-items: center;
            justify-content: space-between; /* 讓「單號/日期」靠左，輸入的文字靠右 */
            gap: 8px;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 9px 18px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
            border: 1px solid rgba(255,255,255,0.5);
            white-space: nowrap; /* ★ 確保「單號」兩個字絕對不會變成上下兩行 */
            box-sizing: border-box;
        }

/* =========================================
           強制修正：確保抬頭輸入框維持透明無框，不被下方樣式干擾
           ========================================= */
        .meta-box input[type="text"],
        .meta-box input[type="date"] {
            flex: 1; 
            width: 100%;
            min-width: 0; 
            text-align: right;
            font-weight: 700;
            font-size: 15px;
            color: var(--text-primary);
            outline: none;
            /* 👇 關鍵修正：加上 !important 強制壓過下方的通用 input 設定 */
            background: transparent !important;
            border: none !important;
            padding: 0 !important;
            box-shadow: none !important;
            height: auto !important;
        }

        .meta-box input:focus { 
            color: var(--primary-blue); 
        }
        .meta-box input:focus { color: var(--primary-blue); }

        /* 卡片 */
        .section-card {
            background: var(--glass-bg-strong);
            backdrop-filter: blur(16px) saturate(1.5);
            -webkit-backdrop-filter: blur(16px) saturate(1.5);
            border-radius: var(--radius-md);
            padding: clamp(18px, 2.5vw, 26px);
            border: 1px solid var(--border-card);
            border-top: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 4px 20px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.5);
            transition: all var(--transition-fast);
        }
        .section-card:focus-within {
            border-color: rgba(0, 122, 255, 0.35);
            box-shadow: 0 6px 24px rgba(0, 122, 255, 0.1), inset 0 1px 0 rgba(255,255,255,0.6);
        }
        .section-card.issue-card {
            background: var(--surface-issue);
            border-color: rgba(255, 180, 180, 0.4);
        }
        .card-title {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 700;
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 1.4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-title::before {
            content: '';
            display: inline-block;
            width: 5px;
            height: 19px;
            background: var(--primary-blue);
            border-radius: 3px;
            flex-shrink: 0;
        }
        .section-card.issue-card .card-title { color: #b03030; }
        .section-card.issue-card .card-title::before { background: var(--accent-red); }

        /* 輸入框 */
        input[type="text"],
        input[type="number"],
        input[type="date"],
        input[type="time"],
        textarea {
            width: 100%;
            border: 2px solid var(--border-input);
            background: var(--surface-input);
            padding: 16px 18px;
            border-radius: var(--radius-sm);
            font-size: 17px;
            font-family: var(--font-stack);
            color: var(--text-primary);
            transition: all var(--transition-fast);
            box-sizing: border-box;
            line-height: 1.5;
            -webkit-appearance: none;
            appearance: none;
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.04);
        }
        input::placeholder, textarea::placeholder { color: var(--text-placeholder); font-size: 16px; }
        input:hover, textarea:hover { border-color: rgba(0, 122, 255, 0.4); background: rgba(255,255,255,0.9); }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--border-focus);
            background: #fff;
            box-shadow: var(--shadow-input-focus), 0 2px 10px rgba(0,122,255,0.08);
            transform: translateY(-1px);
        }
        input[readonly] {
            background: var(--surface-readonly);
            border-color: rgba(200,205,215,0.5);
            color: #555;
            cursor: default;
            font-weight: 600;
        }
        #grandTotal {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary-blue);
            background: rgba(246,249,255,0.8);
            border-color: rgba(0,122,255,0.25);
            text-align: right;
        }
        textarea { min-height: 90px; resize: vertical; line-height: 1.6; }

        .client-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 24px; }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 13px; color: var(--text-label); font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }

        .desc-table { width: 100%; border-collapse: separate; border-spacing: 0 10px; }
        .desc-table td.label { width: 90px; font-weight: 700; color: #555; vertical-align: top; padding-top: 16px; text-align: right; padding-right: 16px; font-size: 16px; white-space: nowrap; }

        .parts-container {
            background: var(--glass-bg-strong);
            backdrop-filter: blur(16px) saturate(1.5);
            -webkit-backdrop-filter: blur(16px) saturate(1.5);
            border-radius: var(--radius-md);
            padding: 12px;
            border: 1px solid var(--border-card);
            border-top: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 4px 20px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.5);
            overflow: hidden;
        }
        .parts-actions { display: flex; justify-content: flex-start; padding: 6px 8px 2px; }
        .parts-add-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--primary-grad);
            color: #fff;
            border: none;
            padding: 13px 24px;
            border-radius: 26px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-fast);
            box-shadow: 0 4px 14px rgba(0,122,255,0.3);
        }
        .parts-add-btn:hover { transform: translateY(-2px); box-shadow: 0 7px 20px rgba(0,122,255,0.4); }

        .parts-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--radius-sm); }
        .parts-table { width: 100%; border-collapse: collapse; min-width: 620px; table-layout: auto; }
        .parts-table th {
            background: rgba(241,243,247,0.75);
            color: #555; padding: 12px 8px; font-size: 13px; font-weight: 700;
            text-align: center; letter-spacing: 0.5px; border-bottom: 2px solid #e0e3ea;
        }
        .parts-table td { padding: 8px 6px; vertical-align: middle; }
        .parts-table input {
            text-align: center; background: rgba(255,255,255,0.8); border: 2px solid rgba(180,190,210,0.4);
            border-radius: 10px; padding: 14px 8px; font-size: 16px; width: 100%; min-width: 50px;
            transition: all var(--transition-fast); box-shadow: inset 0 1px 3px rgba(0,0,0,0.03);
        }
        .parts-table td:first-child input { text-align: left; }
        .parts-table input:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(0,122,255,0.12); background: #fff; }
        .btn-del {
            display: inline-flex; align-items: center; justify-content: center;
            width: 34px; height: 34px; border-radius: 50%; color: #e04040; cursor: pointer;
            font-weight: 700; font-size: 20px; background: #fff; border: 2px solid #f5d0d0;
            transition: all var(--transition-fast); margin: 0 auto;
        }
        .btn-del:hover { background: #ffe8e8; border-color: #e04040; color: #c02020; transform: scale(1.08); }

        .total-area {
            display: flex; justify-content: flex-end; align-items: center; gap: 16px;
            padding: 18px 10px 8px; border-top: 2px dashed #e8ebf1; margin-top: 10px; flex-wrap: wrap;
        }
        .total-area span { color: #666; font-weight: 700; font-size: 18px; }

        .footer { display: flex; gap: 20px; flex-wrap: wrap; }
        .sign-box {
            flex: 1 1 200px; background: rgba(250,251,253,0.65); backdrop-filter: blur(8px);
            border: 2px solid #e5e8ef; border-radius: var(--radius-md); padding: 20px;
            position: relative; min-width: 160px;
        }
        .sign-title { font-size: 15px; font-weight: 700; color: #555; margin-bottom: 10px; border-bottom: 1px solid #e0e3ea; padding-bottom: 8px; }
        .client-sign-name { margin-bottom: 16px; }
        .sign-line { border-bottom: 1.5px dashed #c5c9d4; height: 44px; margin-top: 10px; position: relative; }
        .engineer-name { position: absolute; bottom: 8px; right: 20px; font-weight: 700; font-size: 18px; color: #333; }

        .toolbar {
            position: fixed; z-index: 9999; right: 24px; bottom: max(24px, env(safe-area-inset-bottom));
            display: flex; flex-wrap: wrap; gap: 12px; padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.6); border-radius: 22px;
            background: rgba(255,255,255,0.4); backdrop-filter: blur(24px) saturate(1.8);
            -webkit-backdrop-filter: blur(24px) saturate(1.8); box-shadow: var(--shadow-toolbar);
        }
        .btn-float {
            min-height: 46px; background: var(--primary-grad); color: #fff; border: none;
            padding: 12px 22px; border-radius: 26px; font-size: 15px; font-weight: 700;
            cursor: pointer; transition: all var(--transition-fast); display: inline-flex;
            align-items: center; gap: 6px; letter-spacing: 0.3px;
            box-shadow: 0 4px 14px rgba(0,122,255,0.28);
        }
        .btn-float:hover { transform: translateY(-2px); box-shadow: 0 7px 20px rgba(0,122,255,0.38); }
        .btn-float.btn-green { background: linear-gradient(135deg, #34C759, #28a745); }
        .btn-float.btn-word { background: linear-gradient(135deg, #5c6bc0, #3f51b5); }

@media (max-width: 768px) {
    body { padding: 20px 12px 190px; }
    .form-container { padding: 20px 14px; }
    .client-grid { grid-template-columns: 1fr; }
    .meta-row { flex-direction: column; align-items: center; } /* 👈 這行還留著舊的設定 */
    .toolbar { left: 12px; right: 12px; max-width: none; justify-content: center; }
}
        @media (max-width: 480px) {
            body { padding: 10px 6px 220px; }
            .parts-table { min-width: 480px; }
            .btn-float { padding: 10px 14px; font-size: 14px; }
            .toolbar { flex-direction: column; align-items: stretch; }
        }


        /* 本輪介面細節調整 */
        .meta-box input[type="text"],
        .meta-box input[type="date"] {
            color: #0878f9 !important;
            -webkit-text-fill-color: #0878f9;
            caret-color: #0878f9;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }
        .meta-box input[type="date"]::-webkit-calendar-picker-indicator {
            opacity: .9;
            filter: none;
        }

        .toolbar {
            padding: 13px 16px;
            gap: 14px;
            border-radius: 32px;
        }
        .btn-float {
            min-height: 58px;
            padding: 13px 30px;
            border-radius: 999px;
            font-size: 17px;
            font-weight: 800;
            justify-content: center;
            box-shadow: 0 7px 18px rgba(50, 72, 150, .25), inset 0 1px 0 rgba(255,255,255,.35);
        }
        .btn-float .action-icon {
            display: inline-grid;
            place-items: center;
            width: 22px;
            height: 22px;
            font-size: 16px;
            line-height: 1;
        }
        .btn-float:active { transform: scale(.98); }

        .parts-actions {
            display: block;
            padding: 16px 2px 4px;
        }
        .parts-add-btn {
            width: 100%;
            min-height: 78px;
            border: 2px dashed #1682ff;
            border-radius: 18px;
            color: #0878f9;
            background: rgba(73, 145, 255, .08);
            box-shadow: none;
            font-size: 17px;
            font-weight: 800;
        }
        .parts-add-btn .add-icon {
            display: inline-grid;
            place-items: center;
            width: 26px;
            height: 26px;
            font-size: 28px;
            font-weight: 500;
            line-height: 1;
        }
        .parts-add-btn:hover {
            transform: translateY(-1px);
            color: #006ee6;
            border-color: #006ee6;
            background: rgba(73, 145, 255, .13);
            box-shadow: 0 6px 16px rgba(0,122,255,.10);
        }
        .parts-add-btn:active { transform: scale(.995); }

        .btn-del {
            display: grid;
            place-items: center;
            padding: 0;
            line-height: 1;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 22px;
            font-weight: 500;
            translate: none;
        }
        .btn-del:hover { transform: scale(1.06); }

        @media (max-width: 768px) {
            .toolbar { padding: 10px; gap: 9px; border-radius: 25px; }
            .btn-float { flex: 1 1 0; min-height: 54px; padding: 11px 16px; font-size: 16px; }
            .parts-add-btn { min-height: 72px; }
        }
        @media (max-width: 480px) {
            .toolbar { flex-direction: row; align-items: stretch; }
            .btn-float { min-width: 0; padding: 10px 9px; font-size: 14px; }
            .btn-float .action-icon { width: 18px; height: 18px; font-size: 14px; }
            .parts-add-btn { min-height: 68px; font-size: 16px; border-radius: 16px; }
        }

        @media print {
            body { background: #fff !important; padding: 0 !important; }
            .toolbar, .btn-del, .parts-actions, .parts-add-btn { display: none !important; }
            .form-container { backdrop-filter: none; background: #fff; box-shadow: none; border: none; padding: 10mm 8mm; }
            input, textarea { border: 1px solid #ccc !important; background: #fff !important; }
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button class="btn-float btn-green" onclick="exportFormalPDF()"><span class="action-icon">▤</span> 儲存 PDF</button>
        <button class="btn-float btn-word" onclick="exportFormalWord()"><span class="action-icon">📝</span> 下載 Word</button>
    </div>

    <div class="form-container">
        <div class="header">
            <div class="company-block">
                <h1>英泰自動控制行</h1>
                <div class="en-title">INTAI AUTO CONTROL</div>
            </div>
            <div class="meta-row">
                <div class="meta-box">
                    單號 <input type="text" id="orderNo" placeholder="自動產生">
                </div>
                <div class="meta-box">
                    日期 <input type="date" id="dateField">
                </div>
            </div>
        </div>

        <div class="section-card">
            <div class="card-title">客戶資料 Client Info</div>
            <div class="client-grid">
                <div class="input-group"><label>客戶名稱</label><input type="text" id="customerName" placeholder="請輸入客戶名稱" style="font-weight:600;"></div>
                <div class="input-group"><label>機器編號</label><input type="text" id="machineNo" placeholder="編號..."></div>
                <div class="input-group"><label>維修開始</label><input type="time" id="startTime"></div>
                <div class="input-group"><label>維修結束</label><input type="time" id="endTime"></div>
            </div>
        </div>

        <div class="section-card issue-card">
            <div class="card-title">故障與檢測</div>
            <table class="desc-table">
                <tr><td class="label">故障情形</td><td><textarea id="issue" placeholder="描述..."></textarea></td></tr>
                <tr><td class="label">故障原因</td><td><textarea id="cause" placeholder="原因..."></textarea></td></tr>
                <tr><td class="label">處理對策</td><td><textarea id="solution" placeholder="建議事項..."></textarea></td></tr>
            </table>
        </div>

        <div class="parts-container">
            <div class="parts-table-wrap">
                <table class="parts-table" id="partsTable">
                    <thead>
                        <tr>
                            <th style="width:28%; text-align:left; padding-left:14px;">項目 / 零件名稱</th>
                            <th style="width:18%;">規格</th>
                            <th style="width:10%;">數量</th>
                            <th style="width:14%;">單價</th>
                            <th style="width:16%;">小計</th>
                            <th style="width:10%;"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><input type="text" placeholder="輸入項目" style="text-align:left;"></td>
                            <td><input type="text" placeholder="規格"></td>
                            <td><input type="number" class="qty" value="1" min="1" oninput="onQtyPriceChange(this)"></td>
                            <td><input type="number" class="price" min="0" oninput="onQtyPriceChange(this)" placeholder="0"></td>
                            <td><input type="text" class="subtotal" placeholder="0" oninput="onSubtotalManual(this)"></td>
                            <td><div class="btn-del" onclick="deleteRow(this)">×</div></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="parts-actions">
                <button type="button" class="parts-add-btn" onclick="addPartRow()"><span class="add-icon">＋</span> 新增維修項目</button>
            </div>
            <div class="total-area">
                <span>💰 總計金額</span>
                <input type="text" id="grandTotal" readonly value="0">
            </div>
        </div>

        <div class="footer">
            <div class="sign-box">
                <div class="sign-title">✍️ 客戶簽名</div>

    <script>
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        document.getElementById('dateField').valueAsDate = today;
        document.getElementById('orderNo').value = `${year}${month}${day}`;

        const esc = v => String(v??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const nl2br = v => esc(v).replace(/\n/g,'<br>');
        const toNum = v => Math.max(0, Number(v)||0);
        const money = v => Math.round(v).toLocaleString('zh-TW');

        function getFormalData(){
            const rows = [...document.querySelectorAll('#partsTable tbody tr')].map(tr=>{
                const qty = tr.querySelector('.qty')?.value || '';
                const price = tr.querySelector('.price')?.value || '';
                const subtotalVal = tr.querySelector('.subtotal')?.value || '';
                const subtotalNum = parseFloat(String(subtotalVal).replace(/,/g,'')) || 0;
                const autoSubtotal = toNum(qty) * toNum(price);
                const finalSubtotal = subtotalNum > 0 ? subtotalNum : autoSubtotal;
                return {
                    item: tr.cells[0]?.querySelector('input')?.value || '',
                    spec: tr.cells[1]?.querySelector('input')?.value || '',
                    qty, price, subtotal: finalSubtotal
                };
            }).filter(r=>r.item||r.spec||r.qty!=='1'||toNum(r.price)||r.subtotal>0);
            const total = rows.reduce((s,r)=>s+r.subtotal,0);
            const iso = document.getElementById('dateField').value||'';
            const displayDate = /^\d{4}-\d{2}-\d{2}$/.test(iso)
                ? `<span class="latin">${iso.slice(0,4)}</span><span class="date-kai"> 年 </span><span class="latin">${iso.slice(5,7)}</span><span class="date-kai"> 月 </span><span class="latin">${iso.slice(8,10)}</span><span class="date-kai"> 日</span>` : esc(iso);
            return {
                orderNo: document.getElementById('orderNo').value,
                date: displayDate,
                customer: document.getElementById('customerName').value.trim(),
                machineNo: document.getElementById('machineNo').value,
                startTime: document.getElementById('startTime').value,
                endTime: document.getElementById('endTime').value,
                issue: document.getElementById('issue').value,
                cause: document.getElementById('cause').value,
                solution: document.getElementById('solution').value,
                rows, total,
                clientSignName: document.querySelector('.client-sign-name').value.trim()
            };
        }

        function formalFileName(ext){
            const d = document.getElementById('dateField').value.replaceAll('-','')||`${year}${month}${day}`;
            const cust = (document.getElementById('customerName').value.trim()||'客戶').replace(/[\\/:*?"<>|]/g,'_');
            return `${d}_${cust}_正式維修單.${ext}`;
        }

// 輸出文件模板（已修正手機隱藏線條的 Bug）
        function formalDocumentHtml(){
            const d = getFormalData();
            const filledRows = d.rows.map((r,i)=>{
                const subtotal = r.subtotal || toNum(r.qty)*toNum(r.price);
                return `<tr><td class="center latin">${i+1}</td><td>${esc(r.item)}</td><td>${esc(r.spec)}</td><td class="center latin">${esc(r.qty)}</td><td class="right latin">${r.price?'$'+money(r.price):''}</td><td class="right latin">${subtotal?'$'+money(subtotal):''}</td></tr>`;
            }).join('');
            const blankRows = Array.from({length:Math.max(0,3-d.rows.length)},()=>'<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td></tr>').join('');
            const clientSignDisplay = d.clientSignName ? `客戶簽章：${esc(d.clientSignName)}` : '客戶簽章：';
            return `<!DOCTYPE html>
<html lang="zh-TW" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">

        .total td { height:29pt; border-top: 1.5px solid #333; background:transparent; font-weight:normal; }

        .total-amount { font-family:"Times New Roman",serif; mso-ascii-font-family:"Times New Roman"; mso-hansi-font-family:"Times New Roman"; font-size:12pt; }
        .tax-note { font-family:"DFKai-SB","BiauKai","標楷體",serif; mso-fareast-font-family:"DFKai-SB"; font-size:10.5pt; font-weight:normal; }
        .remarks-label { font-weight:bold; }
        .remarks { margin-top:5pt; font-family:"DFKai-SB","BiauKai","標楷體",serif; mso-fareast-font-family:"DFKai-SB"; font-size:9pt; font-weight:normal; line-height:1.4; }
        .sign { margin-top:9pt; }
        /* 🚨 修正：將 .5pt 改為 1px */
        .sign td { height:62pt; padding:6pt 8pt; vertical-align:top; border: 1px solid #555; font-weight:normal; }
        .sign-label,.engineer { font-family:"DFKai-SB","BiauKai","標楷體",serif; mso-fareast-font-family:"DFKai-SB"; font-weight:normal; }
        .engineer { display:block; margin-top:23pt; padding-right:22pt; text-align:right; font-size:13pt; }
        .notice { margin:6pt 0 0; text-align:center; font-family:"DFKai-SB","BiauKai","標楷體",serif; font-size:8.5pt; font-weight:normal; }
        /* 🚨 修正：將 .5pt 改為 1px */
        .footer { margin-top:6pt; padding-top:4pt; border-top: 1px solid #555; text-align:center; font-family:"DFKai-SB","BiauKai","標楷體",serif; font-size:8pt; font-weight:normal; color:#444; }
        @media print { body { -webkit-print-color-adjust:exact; print-color-adjust:exact; } }
    </style>
</head>
<body>
<div class="WordSection1">
    <div class="doc">
        <p class="company">英泰自動控制行</p>
        <p class="english">INTAI AUTO CONTROL</p>
        <p class="title">維 修 單</p>
        <div class="contact">
            <div class="address-line">彰化縣員林市員集路<span class="contact-number">2</span>段<span class="contact-number">493</span>巷<span class="contact-number">4</span>弄<span class="contact-number">10</span>號</div>
            <div class="contact-line"><span class="contact-label">Tel：</span><span class="contact-number">04-8356923</span> <span class="contact-label">Mobile：</span><span class="contact-number">0935-435757</span> <span class="contact-label">Fax：</span><span class="contact-number">04-8341151</span> <span class="contact-label">統一編號：</span><span class="contact-number">45229579</span></div>
        </div>
        <table class="meta">
            <colgroup><col style="width:16%"><col style="width:34%"><col style="width:16%"><col style="width:34%"></colgroup>
            <tr><td class="label">維修單號</td><td class="latin">${esc(d.orderNo)}</td><td class="label">填單日期</td><td>${d.date}</td></tr>
            <tr><td class="label">客戶名稱</td><td>${esc(d.customer)}</td><td class="label">機器編號</td><td class="latin">${esc(d.machineNo)}</td></tr>

                <tbody>${filledRows}${blankRows}</tbody>

        }

        function validateFormal(){
            const f = document.getElementById('customerName');
            if(!f.value.trim()){ alert('請填寫客戶名稱'); f.focus(); return false; }
            return true;
        }

function exportFormalPDF(){
            if(!validateFormal()) return;
            const html = formalDocumentHtml();
            const iframe = document.createElement('iframe');
            
            // 🚨 關鍵修正：不能用 0 寬高，改用 100% 寬高並藏在背景，強制 iOS 渲染表格線條
            iframe.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; border:0; z-index:-9999; opacity:0; pointer-events:none;';
            
            document.body.appendChild(iframe);
            const doc = iframe.contentWindow.document;
            doc.open(); doc.write(html); doc.close();
            doc.title = formalFileName('pdf').replace('.pdf','');
            iframe.contentWindow.focus();
            setTimeout(()=>{ iframe.contentWindow.print(); setTimeout(()=>iframe.remove(),2000); },500);
        }

        function exportFormalWord(){
            if(!validateFormal()) return;
            const blob = new Blob(['\ufeff',formalDocumentHtml()],{type:'application/msword;charset=utf-8'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = formalFileName('doc');
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(()=>URL.revokeObjectURL(a.href),1500);
        }

        function calcSubtotal(row){
            const qty = toNum(row.querySelector('.qty').value);
            const price = toNum(row.querySelector('.price').value);
            const subtotalEl = row.querySelector('.subtotal');
            if(row.dataset.manual === 'true') return;
            const calc = qty * price;
            subtotalEl.value = calc > 0 ? calc.toLocaleString() : '';
            updateGrandTotal();
        }
        function onQtyPriceChange(input){
            const row = input.closest('tr');
            row.dataset.manual = 'false';
            calcSubtotal(row);
        }
        function onSubtotalManual(input){
            const row = input.closest('tr');
            row.dataset.manual = 'true';
            updateGrandTotal();
        }
        function updateGrandTotal(){
            let sum = 0;
            document.querySelectorAll('#partsTable tbody tr').forEach(tr => {
                const val = tr.querySelector('.subtotal').value;
                sum += parseFloat(String(val).replace(/,/g,'')) || 0;
            });
            document.getElementById('grandTotal').value = sum.toLocaleString();
        }

        function addPartRow(){
            const tbody = document.querySelector('#partsTable tbody');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="text" placeholder="輸入項目" style="text-align:left;"></td>
                <td><input type="text" placeholder="規格"></td>
                <td><input type="number" class="qty" value="1" min="1" oninput="onQtyPriceChange(this)"></td>
                <td><input type="number" class="price" min="0" oninput="onQtyPriceChange(this)" placeholder="0"></td>
                <td><input type="text" class="subtotal" placeholder="0" oninput="onSubtotalManual(this)"></td>
                <td><div class="btn-del" onclick="deleteRow(this)">×</div></td>
            `;
            tbody.appendChild(tr);
            tr.querySelector('input').focus();
            updateGrandTotal();
        }

        function deleteRow(btn){
            const tbody = document.querySelector('#partsTable tbody');
            if(tbody.rows.length <= 1){
                const row = btn.closest('tr');
                row.querySelectorAll('input').forEach(inp => { if(!inp.classList.contains('qty')) inp.value = ''; else inp.value = '1'; });
                row.querySelector('.subtotal').value = '';
                row.dataset.manual = 'false';
                updateGrandTotal();
            } else {
                btn.closest('tr').remove();
                updateGrandTotal();
            }
        }

        document.addEventListener('keydown', function(e){
            if(e.key === 'Enter' && e.target.classList.contains('price')){
                e.preventDefault();
                addPartRow();
            }
        });
    </script>
